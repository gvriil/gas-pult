# Модуль «Сезон шин» (автомойки и шиномонтаж, сеть) — формат файла: docs/MODULES.md
id = "carwash-tire-season"
version = "1.0"
title = "Сезон шин: запись на переобувку"
industry = "Автомойки и шиномонтаж (сеть)"
about = "За 3–4 недели до переобувки — клиентам с хранением шин и прошлым клиентам: свободный слот, пик — поровну по филиалам."
description = """
Дату старта сезона ({{season}}: {{season_start}}, регион «{{region}}») задаёт человек: обязательные сроки — по ТР ТС
018/2011 (зимние шины в декабре–феврале, шипы запрещены в июне–августе; регион может сроки увеличить), ориентир —
среднесуточная +5…+7 °C. За {{lead_weeks}} недели до старта агент собирает две пачки: клиентам с хранением шин у вас
(сервисное сообщение по договору хранения) и прошлым клиентам шиномонтажа (это реклама — только с согласием на
рассылку, ст. 18 ФЗ «О рекламе»). Каждому — свободный слот из data/slots.csv; пик распределяется по филиалам с учётом
постов и того, где лежат шины клиента, при перегрузе — соседний филиал (скрипт peak_spread.py). Пачка уходит только
после «Отправить пачку из N?» — «Да»; без «Да» — черновики в outbox/. Персональные данные клиентов (телефоны,
госномера) — 152-ФЗ: для клиентов в РФ сессия только на российской модели (GigaChat или YandexGPT, docs/RU-MODELS.md),
хранение в РФ.
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Проверь дату старта сезона в [settings] (навык tire-season), \
разложи слоты по филиалам скриптом peak_spread.py и покажи план — ничего не отправляй."""
uses = ["reminders"]

[settings]
season = "зима"                  # «зима» — переобувка на зимние, «лето» — на летние
season_start = "2026-11-23"      # дата старта переобувки — задаёт человек (пример)
region = "Средняя полоса (пример)"
lead_weeks = 3                   # за сколько недель до старта писать: 3–4
max_load = 0.85                  # загрузка постов филиала за день, выше — предлагаем соседний филиал
clients = "data/clients.csv"
slots = "data/slots.csv"
branches = "data/branches.csv"
batch_max = 50

[[integrations]]
id = "booking-api"
title = "Система записи / CRM автомойки (официальный API)"
why = "Свободные слоты и клиенты из системы записи напрямую. Без неё — выгрузки в data/slots.csv и data/clients.csv."
how = "Если у вашей системы записи есть официальный API (например, YCLIENTS REST API) — MCP-сервер с ключом сети: панель → Интеграции → «Свой сервер (адрес)». Ключ хранит сервер, не модуль. Запись слота — только после «Да» клиента и человека."
optional = true

[[integrations]]
id = "telegram-sender"
title = "Бот или SMS-шлюз сети для сообщений клиентам"
why = "Отправить одобренную пачку. Без него — черновики в outbox/, отправляете сами."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота или SMS-шлюза сети."
optional = true

[[data_sources]]
title = "Клиенты, хранение шин, согласия: data/clients.csv"
kind = "client_export"
about = "выгрузка CRM или системы записи сети; согласия на уведомления и на рекламу — из неё же"

[[data_sources]]
title = "Свободные слоты и посты филиалов: data/slots.csv, data/branches.csv"
kind = "client_export"
about = "выгрузка расписания постов шиномонтажа"

[[data_sources]]
title = "Система записи / CRM сети"
kind = "official_api"
about = "только официальный API с ключом сети (например, YCLIENTS REST API), если подключён"

[[schedule]]
at = "10:00"
days = [1, 3, 5]
title = "Сезон шин: пачка записи"
prompt = """Проверь, началась ли кампания сезона (навык tire-season: старт {{season_start}} минус {{lead_weeks}} нед.). \
Не началась или сезон прошёл — ответь одной строкой. Началась — разложи слоты (peak_spread.py), собери пачки \
(reminder-batch): хранение и прошлые клиенты отдельно, и спроси «Отправить пачку из N?». Без «Да» не отправляй."""

[[decisions]]
question = "Отправить пачку из N? (сегмент, филиалы, первые три имени, загрузка пика по филиалам)"
options = ["Да", "Нет"]
when = "в дни кампании, по пачке на сегмент"

[[decisions]]
question = "Филиал перегружен — предложить клиентам соседний филиал?"
options = ["Да, соседний", "Добавить слоты", "Сдвинуть на неделю"]
when = "загрузка постов филиала выше порога, а свободных слотов в окне нет"

[[decisions]]
question = "Дата старта сезона не задана или прошла — какую ставим?"
options = ["Предложенную агентом", "Через неделю", "Задам сам"]
when = "season_start пустая или раньше сегодняшней"
