# Модуль «Аварийная диспетчерская» (пакет «УК-старт») — формат файла: docs/MODULES.md
id = "uk-emergency"
version = "1.0"
title = "Аварийная диспетчерская"
industry = "Управляющие компании — «УК-старт»"
sections = ["comms"]
about = "Таймеры аварийных заявок по п. 13 Правил № 416: нет отметки о локализации за 30 минут — сигнал кнопками."
description = """
Диспетчер пишет заявку в сессию («Дом 1, кв. 5, течь ГВС в подвале») или в журнал data/emergency.csv (выгрузка
системы АДС). Агент ставит время регистрации и вид, а каждые {{every}} минут проверяет таймеры по п. 13 Правил № 416:
локализация аварии — 30 минут с регистрации, информирование заявителя о сроках — 30 минут, засор — 2 часа,
устранение — 3 суток. За 10 минут до срока — предупреждение, срок прошёл без отметки — сигнал вопросом с кнопками в
Telegram и панели. Бригады агент не вызывает — это делает диспетчер. Проверка раз в {{every}} минут — это
сообщения в сессию круглые сутки: учитывайте расход. Сессия — только на российской модели (GigaChat или YandexGPT,
docs/RU-MODELS.md); адреса и телефоны жителей — 152-ФЗ, хранение в РФ. Сроки сверены 02.11.2026.
"""
start = """Прочитай CLAUDE.md и data/emergency.csv (пример выдуманный). Проверь таймеры открытых заявок навыком \
emergency-watch и покажи, что было бы сигналом сейчас, — без звонков и сообщений жителям."""

[settings]
journal = "data/emergency.csv"
every = 10
warn_min = 10
region = "РФ"

[[integrations]]
id = "ads-export"
title = "Журнал АДС (выгрузка)"
why = "Если заявки ведёт система АДС — её выгрузка в data/emergency.csv. Без неё — диспетчер пишет заявки в сессию."
how = "Экспорт журнала аварийных заявок системы АДС в CSV в data/ (раз в 5–10 минут) или ввод заявок в сессию."
optional = true

[[data_sources]]
title = "Журнал аварийных заявок: data/emergency.csv"
kind = "client_export"
about = "журнал АДС самой УК или ввод диспетчера"

[[schedule]]
every = 10
title = "Таймеры аварийных заявок"
prompt = """Проверь таймеры открытых аварийных заявок (навык emergency-watch). Нет открытых или всё в сроке — \
ответь одной строкой «аварийных без отметок нет» и больше ничего не делай. Просрочено — сигнал вопросом."""

[[decisions]]
question = "АВАРИЯ: заявка № <n> (дом, система) — <m> мин без отметки о локализации. Что сделать?"
options = ["Локализовано — отметить", "Бригада на месте", "Передать руководителю"]
when = "30 минут с регистрации без отметки о локализации"

[[decisions]]
question = "Заявителю по № <n> не сообщили срок исполнения (30 мин) — отметить?"
options = ["Сообщили — отметить", "Сообщить сейчас", "Передать руководителю"]
when = "30 минут с регистрации без отметки об информировании"
