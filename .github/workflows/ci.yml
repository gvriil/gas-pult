name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # раз в сутки — полная матрица, с macOS
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в PR отменяет прежний прогон этого PR. На main и по расписанию — своя группа у каждого прогона: иначе
# слияния подряд отменяют друг друга (даже без cancel-in-progress GitHub держит в группе один ожидающий прогон).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# macOS — только на main, раз в сутки и вручную: раннеров macOS arm64 у GitHub не хватает, задание по 15 минут ждёт
# в очереди и отменяется без шагов («The job was not acquired by Runner of type hosted even after multiple attempts»).
# В PR обязательная проверка — ubuntu. Отменённое без шагов перезапускает ci-retry.yml — один раз.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - name: shellcheck install.sh, bin/pult-tenant-setup
        run: shellcheck install.sh bin/pult-tenant-setup

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: gas-pult --version

  # Вход по ключу (passkeys.py) — необязательная зависимость webauthn: в обычной задаче её тесты пропускаются,
  # здесь пакет стоит и пропусков быть не должно.
  passkeys:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,passkeys]"
      - run: pip show webauthn | head -2
      - name: тесты ключей входа — без пропусков
        run: |
          pytest -q -rs tests/test_passkeys.py | tee passkeys.log
          ! grep -q SKIPPED passkeys.log
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, passkeys]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
