# Модуль «Заявки с сайта и соцсетей» (фитнес-клубы, семейные) — формат файла: docs/MODULES.md
id = "fitness-leads"
version = "1.0"
title = "Заявки: ответ сразу и запись"
industry = "Фитнес-клубы (семейные)"
sections = ["comms"]
about = "Ответ на заявку сразу, даже ночью: экскурсия и вводная; утром — тёплый список."
description = """
Каждые 15 минут агент смотрит новые заявки (форма сайта, сообщения сообщества во ВКонтакте, бот клуба
в Telegram — через официальные API и вебхуки; остальное — выгрузкой в data/leads.csv). На заявку — ответ сразу, в
том числе ночью: спасибо, 2–3 свободных слота экскурсии и вводной тренировки из data/slots.csv, без цен и скидок
вне прайса. Ответ на обращение — сервисный (человек сам написал); дальнейшие рекламные сообщения — только с его
согласием. Сразу отвечает только по одобренному шаблону (auto_reply = {{auto_reply}}); иначе — черновики в outbox/.
Утром в {{warm_at}} — «тёплый список» менеджеру: кто ждёт ответа, кто без записи, кого подтвердить. Для клиентов в
РФ — российская модель (GigaChat или YandexGPT, docs/RU-MODELS.md), хранение в РФ (152-ФЗ).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Для заявки 3 подбери слоты (навык lead-slots) и покажи \
черновик ответа, затем тёплый список на 2026-11-02 08:30 (навык warm-list), — ничего не отправляй."""
uses = ["reminders"]

[settings]
leads = "data/leads.csv"
slots = "data/slots.csv"
auto_reply = false            # true — сразу отвечать по одобренному шаблону, в том числе ночью; включает человек
auto_booking = false          # true — записывать в слот через API системы записи по просьбе заявителя
lead_hours = 10               # слот — не раньше чем через N часов от ответа
warm_at = "8:30"
price_url = "прайс клуба в data/price.md"

[[integrations]]
id = "site-forms"
title = "Форма сайта клуба (вебхук или почта)"
why = "Заявки с сайта сразу. Без вебхука — письма с формы через Gmail или выгрузка в data/leads.csv."
how = "Форма сайта отправляет заявку вебхуком на MCP-сервер клуба (панель → Интеграции → «Свой сервер (адрес)») или письмом на почту клуба (коннектор Gmail)."
optional = true

[[integrations]]
id = "gmail"
why = "Если форма сайта присылает заявки письмом — читать новые и отвечать черновиком."
optional = true

[[integrations]]
id = "vk-community"
title = "Сообщество ВКонтакте (официальный VK API)"
why = "Сообщения и заявки сообщества сразу. Без него — выгрузка заявок в data/leads.csv."
how = "Callback API или Long Poll сообщества с ключом доступа сообщества (dev.vk.com) — через MCP-сервер клуба: панель → Интеграции → «Свой сервер (адрес)». Заявки из лид-форм — выгрузкой."
optional = true

[[integrations]]
id = "club-booking"
title = "Система записи клуба (официальный API)"
why = "Свободные слоты и запись напрямую. Без неё — data/slots.csv и бронь в outbox/bookings.csv."
how = "Если у вашей системы записи есть официальный API — MCP-сервер с ключом клуба: панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[data_sources]]
title = "Заявки: data/leads.csv"
kind = "client_export"
about = "выгрузка CRM или формы сайта, лид-форм соцсетей; согласия — отдельными полями"

[[data_sources]]
title = "Слоты экскурсий и вводных: data/slots.csv"
kind = "client_export"
about = "выгрузка системы записи: филиал, дата, время, вид, мест, занято"

[[data_sources]]
title = "Форма сайта, VK API сообщества, бот клуба в Telegram, система записи"
kind = "official_api"
about = "только официальные API и вебхуки с ключами клуба; без парсинга страниц и чужих сообществ"

[[schedule]]
every = 15                    # каждые 15 минут, круглые сутки: каждая проверка — сообщение в сессию (расход)
title = "Новые заявки"
prompt = """Новые заявки с последней проверки (навык lead-slots): каждой — ответ по шаблону templates/first-reply.md \
и 2–3 свободных слота. auto_reply = {{auto_reply}}: «да» — отправь сразу, «нет» — черновик в outbox/. Нет новых — \
ответь одной строкой «новых заявок нет»."""

[[schedule]]
at = "08:30"
title = "Тёплый список"
prompt = """Тёплый список за сутки (навык warm-list): кто ждёт ответа, кто без записи, кого подтвердить сегодня; \
WARM.md и вопрос менеджеру «Что делаем?»."""

[[decisions]]
question = "Тёплый список: N заявок, из них M ночью без ответа — что делаем?"
options = ["Раздать администраторам", "Подробно", "Позже"]
when = "каждое утро"

[[decisions]]
question = "Включить сразу отвечать на заявки по шаблону, в том числе ночью?"
options = ["Да", "Нет"]
when = "один раз после проверки шаблона; меняет auto_reply"

[[decisions]]
question = "Заявитель спрашивает цену или скидку вне прайса — что отвечаем?"
options = ["Цена по прайсу", "Позвонит администратор", "Позже"]
when = "вопрос не закрывается прайсом из data/price.md"
