# Роль «Владелец пульта: разработчик» — формат: docs/SCENARIOS.md. Проекты выдуманы.
title = "Разработчик: владелец пульта"
short = "Несколько проектов с Claude Code: ночная смена по плану и ответы агентам с телефона."
industries = ["Общие"]
offer = []
modules = ["night-shift"]
who = """Вы ведёте несколько проектов и сами работаете с Claude Code. Днём — встречи и дорога, ночью агент мог бы \
работать, но страшно оставить его без присмотра: вдруг push в main или удалит не то."""
without = """Агент стоит, пока вы не за ноутбуком: вопрос «можно продолжать?» висит до вечера. Ночью ничего не \
делается, утром вы вспоминаете, на чём остановились. Две сессии ждут ответа одновременно, а вы узнаёте об этом, только \
когда открыли терминал."""
needs = [
    "Сервер с tmux и Claude Code — пульт уже установлен",
    "PLAN.md в проекте: задачи на ночь по шагам, что считать готовым",
    "Ветки night/… и запрет на push в main без «Да» — правила модуля «Ночная смена»",
]
first_step = """Создайте пространство «Ночная смена», напишите в PLAN.md три небольшие задачи и оставьте на ночь — в \
7:30 придёт отчёт; будить агент будет только по трём причинам."""

[demo]
business = "проект api"
point = "api"

[[moments]]
at = "13:10"
text = """Пульт, три сессии (демо): «{{point}}» ждёт ответа — Claude спрашивает про схему базы; «site» работает — тесты; «bot» свободна.
Вы в такси: открыли панель с телефона, ответили на вопрос кнопкой — «{{point}}» продолжила работу."""

[[moments]]
at = "23:40"
module = "night-shift"
text = """Ночная смена, задача 4 из PLAN.md: миграция добавляет столбец в живую базу проекта «{{point}}».

Нужно необратимое или внешнее действие — разрешаете?"""
[[moments.buttons]]
label = "Да"
result = "Агент выполнил бы миграцию по плану (с бэкапом и способом отката из PLAN.md) и пошёл дальше."
[[moments.buttons]]
label = "Нет"
result = "Агент отложил бы задачу с пометкой в REPORT.md и взял следующую."

[[moments]]
at = "03:15"
day = "ночью"
module = "night-shift"
text = """Задача 6: нет ключа к тестовому платёжному шлюзу — проверка падает не по задаче после трёх попыток.

Работа заблокирована — пропустить задачу и идти дальше?"""
[[moments.buttons]]
label = "Да"
result = "Агент пропустил бы задачу 6 и взял задачу 7; в отчёте — что нужно от вас."
[[moments.buttons]]
label = "Нет"
result = "Агент остановился бы и подождал вашего ответа утром."

[[moments]]
at = "07:30"
day = "утром"
module = "night-shift"
text = """Утренний отчёт (REPORT.md): сделано 5 задач из 7, ветка night/2026-11-03, тесты зелёные; пропущена 1 (нет ключа).
Найден риск: токен в истории коммитов старой ветки.

Найден риск безопасности или данных — исправлять сейчас?"""
[[moments.buttons]]
label = "Да"
result = "Агент подготовил бы план: отозвать токен, выпустить новый, почистить историю ветки — каждое необратимое действие отдельным «Да»."
[[moments.buttons]]
label = "Нет"
result = "Агент записал бы риск в отчёт первым пунктом и не трогал историю."

[[inputs]]
id = "nights"
title = "Ночей в неделю с планом"
unit = "шт."
default = 4
min = 1
max = 7
about = "Сколько ночей в неделю вы оставляете агенту PLAN.md."

[[inputs]]
id = "tasks"
title = "Задач за ночь"
unit = "шт."
default = 5
min = 1
max = 30
about = "Небольшие задачи с понятной проверкой; лимит модуля — 20 итераций."

[[inputs]]
id = "sessions"
title = "Сессий одновременно"
unit = "шт."
default = 3
min = 1
max = 20
about = "Сколько окон Claude Code у вас обычно открыто днём."

[[benefit]]
title = "Ваши часы, которые отработала ночная смена"
unit = "ч в неделю"
of = ["nights", "tasks"]
low = 0.3
high = 0.7
round = 0.5
about = "Допущение: задача экономит вам 20–40 минут после утреннего ревью; часть задач уходит в «заблокировано» — учтено в нижней границе."

[[benefit]]
title = "Простой сессий без ответа"
unit = "ч в неделю меньше"
of = ["sessions"]
low = 1
high = 2
round = 0.5
about = "Допущение: каждая сессия днём 1–2 часа в неделю ждёт ответа, пока вы не у ноутбука; ответ кнопкой с телефона снимает это ожидание."
