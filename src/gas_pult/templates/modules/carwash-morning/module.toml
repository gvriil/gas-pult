# Модуль «Утренние цифры сети» (автомойки и шиномонтаж) — формат файла: docs/MODULES.md
id = "carwash-morning"
version = "1.0"
title = "Утренние цифры по филиалам"
industry = "Автомойки и шиномонтаж (сеть)"
about = "В 8:00 по каждому филиалу — выручка, загрузка постов, средний чек и доля допродаж против плана; вопрос «что делаем»."
description = """
Каждое утро в 8:00 агент берёт вчерашние смены всех филиалов (касса или CRM — выгрузка в data/shifts.csv) и
план месяца (data/plan.csv) и считает по каждому филиалу: выручку, загрузку постов (занятые пост-часы / доступные),
средний чек и долю допродаж (детейлинг, доп. услуги) — за вчера и с начала месяца, против плана. Три самых заметных
отклонения (порог {{threshold}} %) — в вопрос «Что делаем?» с 2–4 вариантами кнопками; полностью — SUMMARY.md, история —
history/. Персональных данных в сводке нет; для сети в РФ — российская модель (docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Собери пробную сводку за 2026-11-01 навыком branch-kpi \
и покажи её с вопросом «Что делаем?»."""

[settings]
shifts = "data/shifts.csv"
branches = "data/branches.csv"
plan = "data/plan.csv"
threshold = 5

[[integrations]]
id = "booking-api"
title = "Касса / CRM автомойки (официальный API)"
why = "Смены, чеки и загрузку постов — напрямую. Без неё — выгрузка в data/shifts.csv к 7:50."
how = "Если у вашей системы есть официальный API — MCP-сервер с ключом сети: панель → Интеграции → «Свой сервер (адрес)». Иначе — регламентная выгрузка отчёта по сменам в data/."
optional = true

[[integrations]]
id = "gdrive"
title = "Google Таблицы (через Google Диск)"
why = "Если план по филиалам ведёте в Google Таблице."
optional = true

[[data_sources]]
title = "Смены по филиалам: data/shifts.csv"
kind = "client_export"
about = "выгрузка кассы или CRM: выручка, чеки, допродажи, занятые пост-часы"

[[data_sources]]
title = "План и посты: data/plan.csv, data/branches.csv"
kind = "client_export"
about = "план месяца по филиалам и число постов, часы работы"

[[data_sources]]
title = "Касса / CRM сети или Google Таблицы"
kind = "official_api"
about = "только официальный API с ключом сети или коннектор Google Диска, если подключены"

[[schedule]]
at = "08:00"
title = "Утренние цифры сети"
prompt = """Утренние цифры за вчера по каждому филиалу (навык branch-kpi): выручка, загрузка постов, средний чек, доля \
допродаж против плана, за вчера и с начала месяца. SUMMARY.md и вопрос «Что делаем?» с 2–4 вариантами под цифры дня."""

[[decisions]]
question = "Что делаем? (по филиалам: выручка, загрузка, чек, допродажи; топ-3 отклонения)"
options = ["Разобрать главное отклонение", "Подробно по филиалу", "Всё в порядке", "Позже"]
when = "каждое утро после сводки; варианты агент подбирает под цифры дня"
