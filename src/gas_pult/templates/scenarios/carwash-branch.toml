# Роль «Управляющий филиалом автомойки» — формат: docs/SCENARIOS.md. Компания и люди выдуманы.
title = "Управляющий филиалом автомойки"
short = "Одна мойка в сети: смены и посты, отзывы по своему филиалу, пик сезона шин."
industries = ["Автомойки и шиномонтаж (сеть)"]
offer = []
modules = ["carwash-morning", "carwash-reviews", "carwash-tire-season"]
who = """Вы отвечаете за филиал «{{point}}»: посты, смены, очередь. О плохом отзыве узнаёте от владельца через два \
дня, а в сезон шин запись трещит: клиенты звонят, окон нет, и часть уезжает к соседям."""
without = """Вчерашние цифры филиала вы считаете сами по кассе и сменам. Отзывы читаете, когда вспомните, — негатив \
висит без ответа, пока его не заметит владелец. В пик переобувки администратор по телефону отказывает клиентам, хотя \
в соседнем филиале сети есть окна."""
needs = [
    "Выгрузка смен и кассы филиала (CSV или XLSX) — та же, что для сводки владельца сети",
    "Отзывы по карточке филиала: Google — Business Profile API; Яндекс Карты и 2ГИС — выгрузка",
    "Свободные слоты и посты филиалов — выгрузка системы записи или её официальный API",
    "Ваш Telegram — вопросы по вашему филиалу приходят вам, а не всей сети",
]
first_step = """Владелец сети подключает вас участником пульта; вы отмечаете свой филиал — и негатив по нему с черновиком \
ответа приходит вам в течение часа."""

[demo]
business = "Сеть автомоек «Пример»"
point = "Центр"

[[moments]]
at = "08:00"
module = "carwash-morning"
text = """Филиал «{{point}}» вчера: выручка 52 300 ₽ при плане 60 000 ₽ (−13 %), загрузка постов 61 %, средний чек 1 350 ₽, допродажи 9 %.
Ниже плана — вечерняя смена: 3 поста простаивали с 18 до 20.

Что делаем?"""
[[moments.buttons]]
label = "Разобрать главное отклонение"
result = "Агент прислал бы разбор вечерней смены: сколько машин было в те же часы на прошлой неделе, кто был на смене, 2–3 варианта (сдвинуть смену, акция «после работы»)."
[[moments.buttons]]
label = "Подробно по филиалу"
result = "Агент показал бы цифры филиала по часам и постам против плана."
[[moments.buttons]]
label = "Всё в порядке"
result = "Агент запишет, что отклонение принято, — в сводке владельцу будет пометка «управляющий видел»."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит после обеда."

[[moments]]
at = "12:40"
module = "carwash-reviews"
text = """Негатив ★2 по «{{point}}» (Google): «Помыли, но салон пыльный, а мастер даже не извинился».
Ответ готов: «Здравствуйте! Простите — так быть не должно. Приезжайте в удобное время, назовите администратору номер отзыва — перемоем салон бесплатно».

Что делаем?"""
[[moments.buttons]]
label = "Опубликовать"
result = "В рабочем режиме ответ опубликовался бы в карточке Google через официальный API. Сейчас ничего не опубликовано."
[[moments.buttons]]
label = "Изменить"
result = "Агент спросил бы, что поменять, и прислал новый черновик на «Да»."
[[moments.buttons]]
label = "Не отвечать"
result = "Агент запишет решение и уберёт отзыв из очереди; владелец сети увидит это в вечерней сводке."
[[moments.buttons]]
label = "Позвонить клиенту"
result = "Агент поставил бы вам задачу «позвонить» с текстом отзыва; ответ на карте — после звонка."

[[moments]]
at = "15:00"
module = "carwash-tire-season"
text = """Сезон шин: «{{point}}» загружен на 94 % в субботу и воскресенье, свободных слотов в окне нет. В филиале «Север» в те же дни свободно 22 окна.

Филиал перегружен — предложить 18 клиентам соседний филиал?"""
[[moments.buttons]]
label = "Да, соседний"
result = "В рабочем режиме 18 клиентам ушло бы предложение записаться в «Север» на свободное время — после вашего «Да». Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Добавить слоты"
result = "Агент спросил бы, на какие часы открыть дополнительные слоты, и пересчитал загрузку."
[[moments.buttons]]
label = "Сдвинуть на неделю"
result = "Агент предложил бы этим клиентам даты на неделю позже — пока это не мешает сроку переобувки."

[[moments]]
at = "17:00"
module = "carwash-reviews"
text = """Готовы ответы на 7 отзывов по «{{point}}»: 6 позитивных, 1 вопрос про цену химчистки.
Первый: «Спасибо, Анна! Рады, что понравилась химчистка — ждём снова».

Опубликовать 7 ответов?"""
[[moments.buttons]]
label = "Опубликовать все"
result = "В рабочем режиме ответы в Google ушли бы через API, для Яндекс Карт и 2ГИС — готовые тексты для вставки."
[[moments.buttons]]
label = "По одному"
result = "Агент прислал бы ответы по одному — каждый на «Да» или правку."
[[moments.buttons]]
label = "Нет"
result = "Ответы останутся черновиками до завтра."

[[inputs]]
id = "reviews"
title = "Отзывов в неделю на филиал"
unit = "шт."
default = 15
min = 1
max = 500
about = "Все площадки вместе: Google, Яндекс Карты, 2ГИС."

[[inputs]]
id = "season"
title = "Клиентов на переобувку за сезон"
unit = "чел."
default = 400
min = 10
max = 20000
step = 10
about = "Сколько машин филиал переобувает за сезон."

[[inputs]]
id = "avg_check"
title = "Средний чек шиномонтажа"
unit = "₽"
default = 2500
min = 300
max = 50000
step = 100
about = "Переобувка комплекта с балансировкой."

[[benefit]]
title = "Время на отзывы"
unit = "ч в неделю"
of = ["reviews"]
low = 0.04
high = 0.08
round = 0.5
about = "Допущение: 2,5–5 минут на ответ вручную; агент готовит черновик, вы нажимаете кнопку."

[[benefit]]
title = "Записи, не потерянные в пик"
unit = "чел. за сезон"
of = ["season"]
low = 0.03
high = 0.08
round = 1
about = "Допущение: в пик часть клиентов не находит окна и уезжает; перенос в соседний филиал или на неделю сохраняет 3–8 % сезона. Проверим на первом сезоне."

[[benefit]]
title = "Выручка с этих записей"
unit = "₽ за сезон"
of = ["season", "avg_check"]
low = 0.03
high = 0.08
round = 1000
about = "Сохранённые записи × средний чек шиномонтажа."

[[benefit]]
title = "Время на утренние цифры"
unit = "ч в неделю"
of = []
low = 1
high = 2
round = 0.5
about = "Допущение: 10–20 минут в день на подсчёт по кассе и сменам, 6 дней в неделю."
