Клиенты дольше 45 дней без визита — 27. Что делаем?"""
buttons = ["Оставить", "Особое предложение", "Позже"]
replies = ["Агент оставит их в покое и не будет писать до следующего визита.", "Агент подготовил бы черновик предложения — скидку назначаете вы; без вашего «Да» ничего не уйдёт.", "Агент спросит снова через неделю."]
