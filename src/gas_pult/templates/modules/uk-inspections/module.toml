# Модуль «Проверки жилинспекции» (пакет «УК-старт») — формат файла: docs/MODULES.md
id = "uk-inspections"
version = "1.0"
title = "Проверки жилинспекции"
industry = "Управляющие компании — «УК-старт»"
about = "Предписание → пункты с исполнителями и сроками, фото и акты по пунктам, отчёт в срок; не успеваем — вопрос директору."
description = """
Для управляющей организации (РФ). Предписание органа жилищного надзора (текст, PDF или скан в data/incoming/ — или
человек диктует пункты) агент раскладывает на пункты с исполнителем и сроком в data/orders.csv, напоминает
исполнителям, собирает фото и акты в папку пункта (evidence/), за {{report_days}} рабочих дней до срока готовит
черновик уведомления об исполнении — директор подписывает и направляет. Не успевают — вопрос директору «Просить
продление?» с черновиком ходатайства об отсрочке исполнения (ст. 93–94 248-ФЗ). Неисполнение предписания в срок —
штраф по ст. 19.5 КоАП РФ (по лицензионным требованиям — ч. 24: юрлицу 200–300 тыс. руб.). Рабочие дни — по
производственному календарю. Сверено 02.11.2026 — сверять с КонсультантПлюс. Сессия — только на российской модели
(GigaChat или YandexGPT, docs/RU-MODELS.md): адреса и данные жителей — 152-ФЗ, хранение в РФ.
"""
start = """Прочитай CLAUDE.md, data/orders.csv и evidence/ (пример выдуманный). Посчитай сроки пунктов скриптом \
order_check.py (навык order-watch) и покажи, что горит и где нет фото и актов, — никому не пиши."""
uses = ["documents", "deadlines", "reminders"]

[settings]
orders = "data/orders.csv"
evidence = "evidence"
report_days = 5        # черновик отчёта — за N рабочих дней до срока
warn_days = 3          # напоминание исполнителю — ещё за M рабочих дней до этого
region = "РФ"

[[integrations]]
id = "gmail"
why = "Предписания, пришедшие на почту УК, и поручения исполнителям после «Да». Без него — черновики в outbox/."
optional = true

[[data_sources]]
title = "Предписания: data/incoming/ (PDF, скан, текст) и data/orders.csv"
kind = "client_export"
about = "документы, полученные УК; пункты вносит агент после «Внести» или человек"

[[data_sources]]
title = "Фото и акты: evidence/<предписание>/<пункт>/"
kind = "client_export"
about = "от исполнителей и подрядчиков УК"

[[schedule]]
at = "09:00"
days = [1, 2, 3, 4, 5]
title = "Предписания: сроки и отчёты"
prompt = """Проверь сроки пунктов предписаний (навык order-watch): напоминания исполнителям — пачкой после «Да»; \
«готовить отчёт» — черновик (order-report); нет фото и актов, а срок близко — вопрос директору «Просить продление?»; \
срок сегодня или просрочено — сразу вопрос. Итог — ORDERS.md. Ничего не отправляй в инспекцию."""

[[decisions]]
question = "Предписание № <n> от <дата>: N пунктов, срок <дата>, исполнители — внести в реестр?"
options = ["Внести", "Изменить", "Не вносить"]
when = "пришло новое предписание"

[[decisions]]
question = "Пункт <n> предписания <№>: до срока <k> раб. дн., фото и актов нет. Просить продление?"
options = ["Просить продление", "Успеем — напомнить исполнителю", "Позже"]
when = "подошла дата отчёта, а подтверждений нет"

[[decisions]]
question = "Отчёт по предписанию <№> (N пунктов, срок <дата>) готов (черновик) — что дальше?"
options = ["Подпишу и отправлю", "Изменить", "Не готово — ждём фото"]
when = "за report_days рабочих дней до срока, подтверждения собраны"

[[decisions]]
question = "ПРОСРОЧЕНО: пункт <n> предписания <№>, срок был <дата>. Что делаем?"
options = ["Срочно исполнить и отчитаться", "Передать юристу", "Уже отчитались — отметить"]
when = "срок прошёл, отчёта нет"
