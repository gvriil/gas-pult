# Модуль «Календарь сроков отчётности» — формат файла: docs/MODULES.md
id = "acc-deadlines"
version = "1.0"
title = "Сроки отчётности клиентов"
industry = "Бухгалтеры и юристы на аутсорсе"
about = "Что и кому сдать и уплатить в ближайшие дни по каждому клиенту, что не готово — и напоминания клиентам по вашему «Да»."
description = """
Для бухгалтерской фирмы на аутсорсе: календарь сроков (data/tax-calendar.csv — уведомления, ЕНП, НДС, УСН, 6-НДФЛ,
РСВ, персонифицированные сведения) накладывается на профиль каждого клиента (data/clients.csv: режим, работодатель)
и статус работ (data/status.csv). По будням в 9:00 — что сдать и уплатить за {{horizon}} рабочих дней, что не
готово и чьих документов не хватает. Напоминания клиентам — пачкой после «Да». Сроки — с датой сверки по
nalog.gov.ru; календарь обновлять ежегодно, сверять с КонсультантПлюс. Для клиентов в РФ — российская модель
(профили GigaChat или YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md, data/tax-calendar.csv, data/clients.csv и data/status.csv (пример выдуманный). \
Составь план сроков на ближайшие рабочие дни (навык deadline-plan) — без отправки напоминаний."""
uses = ["deadlines", "reminders"]

[settings]
calendar = "data/tax-calendar.csv"
clients = "data/clients.csv"
status = "data/status.csv"
horizon = 5

[[integrations]]
id = "onec"
title = "1С: статус отчётности и данные клиентов"
why = "Что уже сдано и уплачено — из базы 1С клиента (выгрузка или OData только на чтение). Без него — data/status.csv."
how = "В 1С — регламентная выгрузка отчёта «Отчётность» в CSV в data/ или публикация стандартного интерфейса OData (its.1c.ru) с правами только на чтение."
optional = true

[[integrations]]
id = "gmail"
why = "Канал напоминаний клиентам по почте. Без него — черновики в outbox/."
optional = true

[[data_sources]]
title = "Календарь сроков: data/tax-calendar.csv"
kind = "client_export"
about = "сроки по НК РФ, сверены с nalog.gov.ru 02.11.2026; обновлять ежегодно"

[[data_sources]]
title = "Клиенты и статус работ: data/clients.csv, data/status.csv"
kind = "client_export"
about = "выгрузка из учётной системы бухгалтерской фирмы или 1С"

[[data_sources]]
title = "1С клиента"
kind = "official_api"
about = "стандартный интерфейс OData платформы 1С:Предприятие — только чтение, с согласия клиента"

[[schedule]]
at = "09:00"
days = [1, 2, 3, 4, 5]
title = "Сроки на ближайшие дни"
prompt = """Составь план сроков (навык deadline-plan) на ближайшие рабочие дни: что сдать и уплатить, что не готово, \
DEADLINES.md. Затем вопрос «Напомнить клиентам?» — без «Да» ничего не отправляй."""

[[decisions]]
question = "До срока <что> осталось N раб. дн., не готово у K клиентов. Напомнить им?"
options = ["Да", "Нет", "Показать список"]
when = "каждое утро, если есть несданное или нет документов"

[[decisions]]
question = "ПРОСРОЧЕНО: <что> у <клиент> — что делаем?"
options = ["Сдать сегодня", "Позвонить клиенту", "Отметить сданным"]
when = "срок прошёл, а статус не «сдано»"
