# Роль «Руководитель фитнес-клуба» — формат: docs/SCENARIOS.md. Клуб и люди выдуманы.
title = "Руководитель фитнес-клуба"
short = "Выручка и загрузка залов утром, справки для налогового вычета, рассрочки и детские группы."
industries = ["Фитнес-клубы (семейные)"]
offer = ["fitness"]
modules = ["fitness-morning", "fitness-kids", "fitness-tax-installments"]
who = """Вы отвечаете за выручку клуба и за то, чтобы всё работало: продажи, загрузка групп, детское направление, \
рассрочки. Цифры за вчера приходят от разных людей в разное время, а заявки на справку для налогового вычета копятся \
у администратора стопкой."""
without = """Сводку по продажам и загрузке собираете из трёх таблиц к обеду. Об отмене детской тренировки родители \
узнают у дверей бассейна. Справки для вычета делают вручную по одной, срок выдачи висит на администраторе; платежи по \
рассрочке вспоминают, когда они уже просрочены."""
needs = [
    "Выгрузка продаж, продлений, плана и расписания групп (учётная система клуба или Google Таблицы)",
    "Дети, группы и родители с согласиями на уведомления — выгрузка учётной системы",
    "Оплаты и графики рассрочек; есть ли клуб в перечне для налогового вычета за год — отмечаете вы",
    "Справки подписывает уполномоченное лицо клуба — агент только готовит черновики данных",
]
first_step = """Пришлите выгрузку продаж и расписания групп за прошлый месяц — через неделю цифры клуба будут \
приходить в 8:00; справки и рассрочки подключаем вторым шагом."""

[demo]
business = "Фитнес-клуб «Пример»"
point = "Центр"

[[moments]]
at = "08:00"
module = "fitness-morning"
text = """Утренние цифры клуба (демо) · {{business}}
Вчера: продано 6 карт (3 новые, 3 продления), посещений 412, загрузка групповых — 74 %.
«{{point}}»: продления ниже плана на 18 %; йога 19:00 — 98 %, пилатес 11:00 — 31 %.

Что делаем?"""
[[moments.buttons]]
label = "Разобрать главное отклонение"
result = "Агент прислал бы разбор продлений: у кого кончились карты, сколько звонков сделано, 2–3 варианта действий."
[[moments.buttons]]
label = "Подробно по филиалу"
result = "Агент показал бы цифры клуба «{{point}}» по дням и по группам против плана."
[[moments.buttons]]
label = "Всё в порядке"
result = "Агент запишет, что отклонение принято, и не будет поднимать его до завтра."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит после обеда."

[[moments]]
at = "09:30"
module = "fitness-kids"
text = """Отмена: бассейн, группа «Дельфины 7–9» завтра в 17:00 — техническая чистка чаши. Перенос — на четверг, 17:00.
Родителей с согласием на уведомления: 14 (первые: Анна П., Олег С., Мария К.).

Отправить пачку из 14?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме 14 родителей получили бы сообщение об отмене и переносе. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Нет"
result = "Пачка останется черновиком; агент напомнит через час — событие завтра."

[[moments]]
at = "10:00"
module = "fitness-tax-installments"
text = """Справки для налогового вычета: 8 черновиков данных готовы (расходы за 2025 год). Выдаёт и подписывает уполномоченное лицо клуба; до срока выдачи по первой заявке — 4 рабочих дня.

Справки готовы: 8 черновиков — выдать?"""
[[moments.buttons]]
label = "Выдать"
result = "Агент передал бы 8 черновиков уполномоченному лицу на подпись и отметил заявки «в работе»."
[[moments.buttons]]
label = "Проверю сам"
result = "Агент прислал бы черновики по одному — с суммами и периодами."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит завтра — с оставшимся сроком выдачи."

[[moments]]
at = "10:05"
module = "fitness-tax-installments"
text = """Рассрочки: 3 платежа сегодня, 5 — через 3 дня, 2 просрочены до 30 дней.
Пример: «Елена, добрый день! Напоминаем: 05.11 — очередной платёж по рассрочке за карту, 4 000 ₽».

Отправить пачку из 10?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме 10 участников получили бы напоминание о платеже. Блокировок и неустоек агент не применяет — только по пункту договора и вашему решению."
[[moments.buttons]]
label = "Нет"
result = "Агент ничего не отправит и спросит завтра."

[[moments]]
at = "14:00"
module = "fitness-kids"
text = """Миша (демо), 10 лет, выходит по возрасту из группы «Дельфины 7–9». В «Акулах 10–12» (вт и чт, 18:00) есть 3 места.

Ребёнок выходит из группы по возрасту — предложить родителю перевод?"""
[[moments.buttons]]
label = "Предложить группу"
result = "Агент подготовил бы родителю сообщение о переводе в «Акулы 10–12»; отправка — после вашего «Да»."
[[moments.buttons]]
label = "Оставить до конца сезона"
result = "Агент отметит решение и вернётся к вопросу в конце сезона."
[[moments.buttons]]
label = "Позвоню сам"
result = "Агент поставит вам задачу позвонить родителю с данными о группах."

