# «Примерочная»: роль «Владелец сети автомоек». Формат и как добавить роль — docs/SCENARIOS.md.
# Сеть, филиалы, имена и все цифры — выдуманный пример.
title = "Владелец сети автомоек"
short = "Несколько моек в городе: цифры по филиалам утром, сезон шин, возврат клиентов, ответы на отзывы."
industries = ["Автомойки и шиномонтаж (сеть)"]
modules = ["carwash-morning", "carwash-tire-season", "carwash-return", "carwash-reviews"]
who = """У вас сеть моек в городе — {{points}} шт. Утром не видно, как сработал каждый филиал: управляющие присылают \
цифры к обеду, каждый в своём формате. Клиенты моются два-три раза и пропадают, а отзывы на картах висят без ответа \
по неделе."""
without = """Цифры по филиалам сводите вечером из сообщений управляющих — отклонение видно на день позже. «Ждём вас \
снова» администратор пишет, когда есть минутка, то есть почти никогда. Ответы на отзывы — раз в неделю, пачкой; запись \
на сезон шин — по звонкам."""
needs = [
    "Выгрузка смен и кассы по филиалам (CSV или XLSX из CRM, кассы или 1С) — раз в день",
    "Клиенты, визиты и согласия на рассылку — выгрузка или официальный API системы записи (если есть)",
    "Отзывы: Google — Business Profile API; Яндекс Карты и 2ГИС — выгрузка, ответ публикуете вы в кабинете",
    "Канал для сообщений клиентам — бот сети в Telegram или почта; нет канала — агент кладёт черновики в outbox/",
]
first_step = """Пришлите выгрузку смен за прошлый месяц по всем филиалам — утренние цифры начнут приходить в 8:00. \
Сезон шин, возврат клиентов и отзывы подключаем по одному."""

[demo]
business = "Сеть автомоек «Пример»"
point = "Центр"

[[timeline_steps]]
at = "08:00"
module = "carwash-morning"
text = """Утренние цифры сети · {{business}} (пример)
Вчера: выручка 182 400 ₽ при плане 196 000 ₽ (−7 %), загрузка постов 68 %, средний чек 1 400 ₽.
Главное отклонение: «{{point}}» — −18 % к плану, загрузка 49 % (вечерняя смена).

Что делаем?"""
[[timeline_steps.decisions]]
label = "Разобрать главное отклонение"
outcome_toast = "Агент пришлёт разбор по «{{point}}»: какие часы и посты простаивали, сравнение с прошлой неделей и 2–3 варианта действий. Ничего не меняет сам."
[[timeline_steps.decisions]]
label = "Подробно по филиалу"
outcome_toast = "Агент покажет таблицу по каждому филиалу: выручка, загрузка, чек, допродажи против плана."
[[timeline_steps.decisions]]
label = "Всё в порядке"
outcome_toast = "Агент запишет, что отклонение принято, и не будет поднимать его до завтрашней сводки."
[[timeline_steps.decisions]]
label = "Позже"
outcome_toast = "Агент напомнит после обеда — с теми же цифрами."

[[timeline_steps]]
at = "10:00"
module = "carwash-tire-season"
text = """Сезон шин: до старта переобувки 3 недели (дату сезона задаёте вы; погоду агент учтёт, если подключить источник прогноза — нужна интеграция).
Пачка 1 — клиенты с хранением шин и согласием на сообщения: 120 человек (пример), слоты поровну по филиалам.
Текст: «Анна, добрый день! Ваши шины хранятся у нас. Записаться на переобувку — по ссылке» (пример).

Отправить пачку из 120?"""
[[timeline_steps.decisions]]
label = "Да"
outcome_toast = "Сообщения ушли бы 120 клиентам с хранением шин — сервисные, по договору хранения, через бот сети или почту. Сейчас ничего не отправлено."
[[timeline_steps.decisions]]
label = "Нет"
outcome_toast = "Пачка останется черновиком в outbox/; агент спросит снова завтра в 10:00."

[[timeline_steps]]
at = "11:00"
module = "carwash-return"
text = """Не были 30–45 дней и дали согласие на рекламные сообщения: 46 клиентов (пример).
Текст: «Олег, добрый день! Давно не видели вас в «{{point}}». Будем рады снова — ответьте, когда удобно. Не хотите таких сообщений — ответьте «стоп»» (пример).

Отправить пачку из 46?"""
[[timeline_steps.decisions]]
label = "Отправить"
outcome_toast = "Сообщения ушли бы 46 клиентам — только с согласием на рекламу (ст. 18 ФЗ «О рекламе»), с отпиской, одному клиенту не чаще раза в 14 дней. Сейчас ничего не отправлено."
[[timeline_steps.decisions]]
label = "Показать первых трёх"
outcome_toast = "Агент покажет: Олег — 38 дней, Анна — 41 день, Павел — 44 дня (пример) — и спросит снова."
[[timeline_steps.decisions]]
label = "Не сейчас"
outcome_toast = "Агент ничего не отправит и спросит завтра."

[[timeline_steps]]
at = "17:00"
module = "carwash-reviews"
text = """Готовы ответы на 12 отзывов по филиалам (пример): Google — 7, Яндекс Карты — 4, 2ГИС — 1.
Первый: «Спасибо, Ирина! Рады, что химчистка салона понравилась — ждём вас снова в «{{point}}»».

Опубликовать 12 ответов?"""
[[timeline_steps.decisions]]
label = "Опубликовать все"
outcome_toast = "7 ответов в Google ушли бы через Business Profile API. Ответ скопирован — опубликуйте в кабинете Яндекс Карт и 2ГИС: публичного API ответов у них нет."
[[timeline_steps.decisions]]
label = "По одному"
outcome_toast = "Агент пришлёт ответы по одному — каждый на «Да» или правку."
[[timeline_steps.decisions]]
label = "Нет"
outcome_toast = "Ответы останутся черновиками; агент спросит вечером снова."

[calculator]
assumptions_disclaimer = """Оценка, не обещание. Доли и минуты — допущения: поправьте их под себя, результат \
пересчитается. Диапазон — ±20 % вокруг допущения. Точные цифры покажет пилот на ваших данных за 4 недели."""

[[calculator.inputs]]
id = "points"
title = "Филиалов"
unit = "шт."
default = 3
min = 1
max = 50
about = "Сколько моек в сети."

[[calculator.inputs]]
id = "clients"
title = "Клиентов в месяц по сети"
unit = "чел."
default = 1500
min = 50
max = 100000
step = 50
about = "Разных клиентов за месяц по всем филиалам (из кассы или CRM)."

[[calculator.inputs]]
id = "avg_check"
title = "Средний чек"
unit = "₽"
default = 1400
min = 100
max = 50000
step = 50
about = "Средний чек мойки по сети."

[[calculator.inputs]]
id = "return_share"
title = "Доля вернувшихся после напоминания"
unit = "%"
default = 2
min = 0.1
max = 20
step = 0.1
assumption = true
about = "Допущение: какая часть месячного числа клиентов вернётся после «ждём вас». Общая оценка для услуг с регулярными визитами — 1–3 %."

[[calculator.inputs]]
id = "minutes"
title = "Минут в день на сводку по филиалу"
unit = "мин"
default = 20
min = 1
max = 120
assumption = true
about = "Допущение: сколько сейчас уходит у управляющего и у вас на сбор и сверку цифр одного филиала."

[[calculator.formulas]]
title = "Время на утренние цифры"
unit = "ч в неделю"
of = ["points", "minutes"]
low = 0.08
high = 0.12
round = 0.5
about = "Филиалы × минуты × 6 дней ÷ 60; агент собирает сводку сам, вы читаете её за минуту."

[[calculator.formulas]]
title = "Вернувшиеся клиенты"
unit = "чел. в месяц"
of = ["clients", "return_share"]
low = 0.008
high = 0.012
round = 1
about = "Клиенты в месяц × доля вернувшихся. Сообщения — только тем, кто дал согласие."

[[calculator.formulas]]
title = "Оборот от вернувшихся"
caption = "оборот, не прибыль"
unit = "₽ в месяц"
of = ["clients", "return_share", "avg_check"]
low = 0.008
high = 0.012
round = 1000
about = "Вернувшиеся × средний чек, по одному визиту. Это выручка, не прибыль: себестоимость мойки не вычтена."
