# Роль «Бухгалтер или юрист на аутсорсе» — формат: docs/SCENARIOS.md. Фирмы и люди выдуманы.
title = "Бухгалтер или юрист на аутсорсе"
short = "Десятки клиентов-фирм: сроки отчётности, первичка из мессенджера, черновики претензий."
industries = ["Бухгалтеры и юристы на аутсорсе"]
offer = []
modules = ["acc-deadlines", "acc-primary", "law-drafts"]
who = """У вас {{clients}} клиентов-фирм. Первичку присылают фотографиями в мессенджер в последний день, сроки \
отчётности у всех разные, а претензию «срочно» просят в пятницу вечером."""
without = """Календарь сроков — в голове и в таблице, которую никто не обновляет; клиенту, у которого нет выписки, \
напоминаете накануне срока. Фото документов разбираете вручную по одному и набиваете в 1С. Претензия — с нуля по \
памяти, с ручным расчётом неустойки."""
needs = [
    "Список клиентов-фирм и что сдаёт каждая (система налогообложения, отчёты) — таблица",
    "Статус работ по клиентам — таблица, которую агент читает и обновляет только после «Да»",
    "Первичка: клиенты шлют фото и сканы в бота или на почту — в папку пространства",
    "Ваши шаблоны договоров и претензий; данные сторон и долгов — выгрузка",
]
first_step = """Пришлите список клиентов с видами отчётности — через неделю в 9:00 будет «что и кому сдать в \
ближайшие 5 рабочих дней» и вопрос «напомнить тем, у кого не готово?»."""

[demo]
business = "Бухгалтерия «Пример»"
point = "Пример-4"

[[moments]]
at = "09:00"
module = "acc-deadlines"
text = """Сроки на ближайшие дни (демо) · {{business}}
До срока декларации по НДС за III квартал осталось 3 рабочих дня, не готово у 4 клиентов: нет банковской выписки у двух, книги покупок — у двух.

Напомнить им?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме 4 клиента получили бы напоминание: что именно нужно прислать и к какому числу."
[[moments.buttons]]
label = "Нет"
result = "Агент ничего не отправит и спросит завтра — срок станет ближе."
[[moments.buttons]]
label = "Показать список"
result = "Агент показал бы 4 клиентов: чего не хватает и когда последний раз присылали документы."

[[moments]]
at = "10:00"
module = "acc-primary"
text = """Разобрал новые документы: 23 файла от 6 клиентов — 19 УПД и актов на 1 284 000 ₽, 3 чека, 1 не распознан уверенно.

Внести 22 документа в реестр и файл для 1С?"""
[[moments.buttons]]
label = "Все"
result = "Агент внёс бы 22 документа в реестр и подготовил файл для загрузки в 1С; загружаете вы."
[[moments.buttons]]
label = "По одному"
result = "Агент показал бы документы по одному: реквизиты, сумма, к какому клиенту."
[[moments.buttons]]
label = "Нет"
result = "Документы останутся в папке входящих до следующего разбора."

[[moments]]
at = "10:05"
module = "acc-primary"
text = """Документ не распознан уверенно: фото_0412.jpg (клиент «{{point}}») — нет ИНН продавца, сумма плохо читается.

Что делаем?"""
[[moments.buttons]]
label = "Внести как есть"
result = "Агент внёс бы документ с пометкой «проверить» в реестре."
[[moments.buttons]]
label = "Попросить у клиента заново"
result = "Агент подготовил бы клиенту просьбу прислать скан получше — после вашего «Да»."
[[moments.buttons]]
label = "Не первичка"
result = "Агент убрал бы файл из реестра и отметил, что это не первичный документ."

[[moments]]
at = "15:20"
module = "law-drafts"
text = """Черновик претензии для ООО «Контрагент» (демо) готов: долг 486 000 ₽ по трём УПД, неустойка по договору 0,1 % в день — 21 870 ₽, срок ответа 10 дней.

Что дальше?"""
[[moments.buttons]]
label = "Передать юристу"
result = "Агент передал бы черновик юристу на проверку; отправка — только после его отметки «проверено» и вашего «Да»."
[[moments.buttons]]
label = "Изменить"
result = "Агент спросил бы, что поправить, и пересчитал неустойку."
[[moments.buttons]]
label = "Оставить черновиком"
result = "Черновик останется в папке клиента."

[[moments]]
at = "16:00"
module = "acc-primary"
text = """Кто не прислал первичку за октябрь (до 5-го числа): 7 клиентов.

Отправить напоминания о первичке 7 клиентам?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме 7 клиентов получили бы напоминание со списком того, что ждём. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Нет"
result = "Агент спросит снова завтра."

[[inputs]]
id = "clients"
title = "Клиентов-фирм"
unit = "шт."
default = 25
min = 1
max = 2000
about = "Фирмы и ИП на обслуживании."

[[inputs]]
id = "docs"
title = "Документов первички в месяц на клиента"
unit = "шт."
default = 40
min = 1
max = 5000
about = "УПД, акты, счета, чеки — в среднем на клиента."

[[inputs]]
id = "rate"
title = "Стоимость часа специалиста"
unit = "₽"
default = 1500
min = 100
max = 50000
step = 100
about = "Сколько стоит вам час бухгалтера (зарплата с налогами на час)."

[[benefit]]
title = "Время на разбор первички"
unit = "ч в месяц"
of = ["clients", "docs"]
low = 0.01
high = 0.02
round = 1
about = "Допущение: агент экономит 0,6–1,2 минуты на документе — распознаёт реквизиты и раскладывает по клиентам; проверяет человек."

[[benefit]]
title = "Время на сроки и напоминания"
unit = "ч в месяц"
of = ["clients"]
low = 0.3
high = 0.6
round = 1
about = "Допущение: 20–35 минут в месяц на клиента — сверить календарь, понять, что не готово, написать напоминание."

[[benefit]]
title = "Стоимость сэкономленного времени на первичке"
unit = "₽ в месяц"
of = ["clients", "docs", "rate"]
low = 0.01
high = 0.02
round = 1000
about = "Время на первичке × стоимость часа."
