# ---------- общие частые вопросы ----------
[[faq]]
id = "agent"
q = "Как подключить агента?"
a = "Агент — это сессия Claude в папке проекта. Готовый агент под задачу: «Новая сессия» → «Из модуля» → выберите модуль → «Создать и открыть сессию». Своя задача: «Новая сессия» → папка → пишите агенту в поле внизу."
actions = ["go:modules", "go:new-session"]
roles = ["owner", "member"]

[[faq]]
id = "agent"
q = "Как подключить агента?"
a = "У наблюдателя доступ только на просмотр: агента подключает владелец или участник. Каталог готовых агентов можно посмотреть в «Из модуля»."
actions = ["go:modules"]
roles = ["viewer"]

[[faq]]
id = "cost"
q = "Сколько стоит?"
a = "Расход считается по журналам Claude Code и ценам API: сумма за сегодня — на главной и в «Настройки» → «Расход и лимиты». С подпиской Pro/Max это оценка, а не счёт. Владелец задаёт лимит на сессию и на день — при превышении сессия встаёт на паузу."
actions = ["go:settings.cost"]
roles = ["owner", "member"]

[[faq]]
id = "cost"
q = "Сколько стоит?"
a = "Расход видит хозяин учётки — владелец или участник со своей учёткой Claude. У наблюдателя расход не показывается."
actions = ["go:settings"]
roles = ["viewer"]

[[faq]]
id = "colors"
q = "Что значат цвета?"
a = "Зелёная мигающая точка — Claude работает; жёлтая — ждёт вашего ответа; серая — свободна; красная — остановлена. Все значки — в «Обозначениях»."
actions = ["go:settings.legend"]
roles = ["owner", "member", "viewer"]

[[faq]]
id = "integr"
q = "Как подключить Notion, Gmail или другой сервис?"
a = "«Интеграции» → выберите сервис → следуйте шагам: откроется claude.ai, там «Подключить». Отметка в панели появится сама. У каждого человека свои интеграции."
actions = ["go:integrations"]
roles = ["owner", "member"]

[[faq]]
id = "people"
q = "Как добавить человека?"
a = "Пусть человек откроет панель и нажмёт «Войти через Telegram» — бот спросит вас, кем его пустить: участник или наблюдатель. Изменить роль или отключить — «Настройки» → «Люди»."
actions = ["go:settings.people"]
roles = ["owner"]

[[faq]]
id = "model"
q = "Как сменить модель?"
a = "В сессии: меню действий → «Модель» — основная или быстрая; «Сменить поставщика» — Claude, OpenRouter, GLM, DeepSeek. Ключи других поставщиков владелец задаёт в «Интеграции» → «Модели»."
actions = ["go:session.model", "go:models"]
roles = ["owner"]

[[faq]]
id = "model"
q = "Как сменить модель?"
a = "В сессии: меню действий → «Модель». Поставщиков и ключи настраивает владелец."
actions = ["go:session.model"]
roles = ["member"]

[[faq]]
id = "country"
q = "Почему сервис недоступен в моей стране?"
a = "Модели доступны только в странах из списков их поставщиков. Пульт смотрит на вашу страну, код номера и страну по IP — доступно то, что разрешено для всех. Проверить или поменять страну — «Настройки» → «Страна»."
actions = ["go:settings.country"]
roles = ["owner", "member", "viewer"]

[[faq]]
id = "answer"
q = "Claude ждёт ответа — что нажать?"
a = "Жёлтая точка — Claude задал вопрос или просит разрешения. Откройте сессию: варианты ответа — кнопками над полем ввода, всё как есть — на «Экране»."
actions = ["go:session.screen", "go:sessions"]
roles = ["owner", "member"]

[[faq]]
id = "tour"
q = "Есть короткий тур?"
a = "Да: «Показать тур по этому экрану» внизу этой шторки — подсветит главное на экране. Весь тур — «Настройки» → «Пройти тур»: для разработчика или для бизнеса. Esc — выйти из тура."
actions = ["go:settings"]
roles = ["owner", "member", "viewer"]

# ---------- панель: вход, условия, страна ----------
[[screen]]
id = "login"
where = "panel"
title = "Вход в пульт"
title_en = "Sign in to the panel"
roles = ["anon"]
purpose = "Вход в панель без пароля — подтверждением в вашем Telegram."
purpose_en = "Sign in to the panel without a password — by confirming in your Telegram."
steps = ["Нажмите «Войти через Telegram».", "В Telegram нажмите «Запустить» (Start), затем «Войти».", "Вернитесь сюда — панель откроется сама."]
steps_en = ["Tap «Sign in with Telegram».", "In Telegram tap «Start», then «Sign in».", "Come back here — the panel opens by itself."]
next = ["go:login", "go:demo"]
chips = ["noaccess", "demo", "email", "passkey", "invite-code"]

[[screen.faq]]
id = "invite-code"
q = "Мне дали код или ссылку-приглашение — как войти?"
a = "Откройте ссылку или нажмите «Есть код приглашения?» и введите код (слово и цифры). Затем напишите, как вас зовут, и нажмите «Войти» — Telegram не нужен. Код работает один раз и 24 часа."
q_en = "I got an invitation code or link — how do I sign in?"
a_en = "Open the link or tap «Have an invitation code?» and enter the code (a word and digits). Then write your name and tap «Sign in» — no Telegram needed. The code works once, for 24 hours."
actions = ["go:login"]

[[screen.faq]]
id = "noaccess"
q = "Нет доступа — что делать?"
a = "Нажмите «Войти через Telegram» и «Запустить» в боте — бот спросит владельца пульта, пустить ли вас. Когда он даст роль, нажмите «Войти через Telegram» ещё раз."
q_en = "No access — what do I do?"
a_en = "Tap «Sign in with Telegram» and «Start» in the bot — the bot will ask the panel owner to let you in. When you get a role, tap «Sign in with Telegram» again."
actions = ["go:login"]

[[screen.faq]]
id = "demo"
q = "Можно посмотреть без входа?"
a = "Да: «Посмотреть демо» — та же панель на примерах, всё можно нажимать, ничего никуда не уходит."
q_en = "Can I look around without signing in?"
a_en = "Yes: «See the demo» is the same panel with examples — tap anything, nothing is sent anywhere."
actions = ["go:demo"]

[[screen.faq]]
id = "passkey"
q = "Можно войти по Face ID?"
a = "Да, если владелец включил ключи входа на пульте: войдите один раз через Telegram, добавьте ключ в «Настройках» → «Ключи входа» (в браузере, не в Telegram), потом — «Войти с Face ID / ключом»."
q_en = "Can I sign in with Face ID?"
a_en = "Yes, if the owner has enabled sign-in keys on the panel: sign in once with Telegram, add a key in «Settings» → «Sign-in keys» (in a browser, not in Telegram), then use «Sign in with Face ID / a key»."
actions = ["go:login"]

[[screen.faq]]
id = "email"
q = "Можно войти по почте?"
a = "Да, если владелец настроил почту на пульте и вы привязали свой адрес в «Настройках» после первого входа через Telegram: «Войти по почте» → адрес → 6 цифр из письма. Код действует 10 минут."
q_en = "Can I sign in with email?"
a_en = "Yes, if the owner has set up email on the panel and you linked your address in «Settings» after the first Telegram sign-in: «Sign in with email» → address → 6 digits from the letter. The code is valid for 10 minutes."
actions = ["go:login"]

[[screen]]
id = "terms"
where = "panel"
title = "Условия использования"
roles = ["owner", "member", "viewer"]
purpose = "Перед работой — условия использования пульта: у каждого свой аккаунт или ключ поставщика, подпиской не делимся, работаем из поддерживаемых стран."
steps = ["Прочитайте пункты.", "Нажмите «Принимаю» — дальше выбор страны."]
next = ["go:settings.country"]
chips = ["why"]

[[screen.faq]]
id = "why"
q = "Зачем принимать условия?"
a = "Модели предоставляют поставщики по своим условиям. Пульт — инструмент: без согласия с условиями он ничего, кроме них, не показывает. Дата согласия хранится на сервере."
actions = ["go:settings.country"]

[[screen]]
id = "country"
where = "panel"
title = "Ваша страна"
roles = ["owner", "member", "viewer"]
purpose = "Выбор страны, из которой вы работаете: модели доступны по спискам стран их поставщиков."
steps = ["Нажмите свою страну или введите код из двух букв.", "Подтвердите номер в боте — «Поделиться номером» (храним только код страны и хеш номера)."]
next = ["go:sessions"]
chips = ["country", "mismatch"]

[[screen.faq]]
id = "mismatch"
q = "«Признаки страны не совпадают» — что это?"
a = "Выбор, код номера и страна по IP указывают на разные страны. Тогда доступны только сервисы, разрешённые для всех этих стран."
actions = ["go:settings.country"]

