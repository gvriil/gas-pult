# Модуль «Сбор первички» — формат файла: docs/MODULES.md
id = "acc-primary"
version = "1.0"
title = "Сбор первички от клиентов"
industry = "Бухгалтеры и юристы на аутсорсе"
sections = ["search", "docs"]
about = "Клиенты шлют фото и сканы — агент раскладывает их в реестр и файл для загрузки в 1С; кто не прислал — напоминание по «Да»."
description = """
Для бухгалтерской фирмы на аутсорсе: клиенты присылают первичку (УПД, акты, счета, накладные, чеки) фото или
сканом — в Telegram-бот фирмы, на почту или в папку inbox/. Агент распознаёт вид, номер, дату, контрагента и
суммы, раскладывает по клиентам и месяцам в registry/ и готовит файл для загрузки в 1С — бухгалтер подтверждает
кнопкой. Сомнительное (не читается, нет ИНН, сумма не сходится) — отдельным вопросом. С 1-го по {{collect_until}}-е
число — кто не прислал ожидаемые документы, и пачка напоминаний после «Да». В 1С агент ничего не проводит сам.
Для клиентов в РФ — российская модель (GigaChat или YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md, data/clients.csv и inbox/ (пример выдуманный). Разбери пример из inbox/ навыком \
primary-intake и покажи, что попадёт в реестр, — в 1С ничего не загружай."""
uses = ["documents", "reminders"]

[settings]
clients = "data/clients.csv"
collect_until = 5

[[integrations]]
id = "telegram-sender"
title = "Telegram-бот фирмы для приёма документов"
why = "Клиенты шлют фото в бот фирмы — файлы попадают в inbox/. Без него — почта или папка inbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота фирмы, сохраняющий вложения в inbox/."
optional = true

[[integrations]]
id = "gmail"
why = "Забирать вложения из писем клиентов в inbox/ и отправлять напоминания."
optional = true

[[integrations]]
id = "onec"
title = "1С клиента: справочники (OData, только чтение)"
why = "Сверить контрагентов и номенклатуру со справочниками 1С. Загрузка документов — файлом, бухгалтером."
how = "Публикация стандартного интерфейса OData базы 1С (its.1c.ru) с пользователем только на чтение справочников."
optional = true

[[data_sources]]
title = "Первичка: фото и сканы от клиентов в inbox/"
kind = "client_export"
about = "клиенты присылают сами — бот фирмы, почта или папка"

[[data_sources]]
title = "Клиенты фирмы и что ждём: data/clients.csv"
kind = "client_export"
about = "из учётной системы бухгалтерской фирмы"

[[data_sources]]
title = "Справочники 1С клиента"
kind = "official_api"
about = "стандартный интерфейс OData платформы 1С:Предприятие — только чтение"

[[schedule]]
at = "10:00"
days = [1, 2, 3, 4, 5]
title = "Разобрать новые документы"
prompt = """Разбери новые файлы в inbox/ (навык primary-intake): реестр, сомнительное — вопросом, затем «Внести N \
документов в реестр и файл для 1С?». В 1С ничего не загружай."""

[[schedule]]
at = "16:00"
days = [1, 2, 3, 4, 5]
title = "Кто не прислал первичку"
prompt = """Если сегодня с 1-го по 5-е число — проверь, кто из клиентов не прислал ожидаемые документы за прошлый \
месяц, и собери пачку напоминаний (навык reminder-batch, шаблон templates/need-primary.md). Без «Да» не отправляй. \
Иначе — ответь одной строкой «не период сбора»."""

[[decisions]]
question = "Внести N документов в реестр и файл для 1С? (по клиентам, сумма, сомнительных K)"
options = ["Все", "По одному", "Нет"]
when = "после разбора inbox/"

[[decisions]]
question = "Документ не распознан уверенно: <файл> — что делаем?"
options = ["Внести как есть", "Попросить у клиента заново", "Не первичка"]
when = "не читается, нет ИНН, сумма не сходится"

[[decisions]]
question = "Отправить напоминания о первичке N клиентам?"
options = ["Да", "Нет"]
when = "с 1-го по 5-е число, если не всё прислано"
