# ---------- общие частые вопросы ----------
[[faq]]
id = "agent"
q = "Как подключить агента?"
a = "Агент — это сессия Claude в папке проекта. Готовый агент под задачу: «Новая сессия» → «Из модуля» → выберите модуль → «Создать и открыть сессию». Своя задача: «Новая сессия» → папка → пишите агенту в поле внизу."
actions = ["go:modules", "go:new-session"]
roles = ["owner", "member"]

[[faq]]
id = "agent"
q = "Как подключить агента?"
a = "У наблюдателя доступ только на просмотр: агента подключает владелец или участник. Каталог готовых агентов можно посмотреть в «Из модуля»."
actions = ["go:modules"]
roles = ["viewer"]

[[faq]]
id = "cost"
q = "Сколько стоит?"
a = "Расход считается по журналам Claude Code и ценам API: сумма за сегодня — на главной и в «Настройки» → «Расход и лимиты». С подпиской Pro/Max это оценка, а не счёт. Владелец задаёт лимит на сессию и на день — при превышении сессия встаёт на паузу."
actions = ["go:settings.cost"]
roles = ["owner", "member"]

[[faq]]
id = "cost"
q = "Сколько стоит?"
a = "Расход видит хозяин учётки — владелец или участник со своей учёткой Claude. У наблюдателя расход не показывается."
actions = ["go:settings"]
roles = ["viewer"]

[[faq]]
id = "colors"
q = "Что значат цвета?"
a = "Зелёная мигающая точка — Claude работает; жёлтая — ждёт вашего ответа; серая — свободна; красная — остановлена. Все значки — в «Обозначениях»."
actions = ["go:settings.legend"]
roles = ["owner", "member", "viewer"]

[[faq]]
id = "integr"
q = "Как подключить Notion, Gmail или другой сервис?"
a = "«Интеграции» → выберите сервис → следуйте шагам: откроется claude.ai, там «Подключить». Отметка в панели появится сама. У каждого человека свои интеграции."
actions = ["go:integrations"]
roles = ["owner", "member"]

[[faq]]
id = "people"
q = "Как добавить человека?"
a = "Пусть человек откроет панель и нажмёт «Войти через Telegram» — бот спросит вас, кем его пустить: участник или наблюдатель. Изменить роль или отключить — «Настройки» → «Люди»."
actions = ["go:settings.people"]
roles = ["owner"]

[[faq]]
id = "model"
q = "Как сменить модель?"
a = "В сессии: меню действий → «Модель» — основная или быстрая; «Сменить поставщика» — Claude, OpenRouter, GLM, DeepSeek. Ключи других поставщиков владелец задаёт в «Интеграции» → «Модели»."
actions = ["go:session.model", "go:models"]
roles = ["owner"]

[[faq]]
id = "model"
q = "Как сменить модель?"
a = "В сессии: меню действий → «Модель». Поставщиков и ключи настраивает владелец."
actions = ["go:session.model"]
roles = ["member"]

[[faq]]
id = "country"
q = "Почему сервис недоступен в моей стране?"
a = "Модели доступны только в странах из списков их поставщиков. Пульт смотрит на вашу страну, код номера и страну по IP — доступно то, что разрешено для всех. Проверить или поменять страну — «Настройки» → «Страна»."
actions = ["go:settings.country"]
roles = ["owner", "member", "viewer"]

[[faq]]
id = "answer"
q = "Claude ждёт ответа — что нажать?"
a = "Жёлтая точка — Claude задал вопрос или просит разрешения. Откройте сессию: варианты ответа — кнопками над полем ввода, всё как есть — на «Экране»."
actions = ["go:session.screen", "go:sessions"]
roles = ["owner", "member"]

# ---------- панель: вход, условия, страна ----------
[[screen]]
id = "login"
where = "panel"
title = "Вход в пульт"
