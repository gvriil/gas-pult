# Модуль «Корпоративные автопарки» (автомойки и шиномонтаж, сеть) — формат файла: docs/MODULES.md
id = "carwash-fleet"
version = "1.0"
title = "Корпоративные автопарки: мойки, счета, дебиторка"
industry = "Автомойки и шиномонтаж (сеть)"
about = "Мойки автопарков по договорам и лимитам, счета и акты в конце месяца, дебиторка и стоп-обслуживание — после «Да»."
description = """
Каждый день агент сверяет мойки корпоративных клиентов по всем филиалам (data/fleet_washes.csv) с договорами
(data/fleet_contracts.csv): госномер из договора, лимит моек в месяц, цена. Сверх лимита или чужой госномер — вопрос
человеку, сам не выставляет. В последний рабочий день месяца — черновики счетов и актов (данных для УПД) по каждому
договору в outbox/docs/: подписывает и отправляет человек. Дебиторка — по выгрузке взаиморасчётов: напоминания по
лестнице, претензия (черновик, проверяет юрист) и стоп-обслуживание по договору — каждое действие только после «Да».
Для клиентов в РФ сессия только на российской модели (GigaChat или YandexGPT, docs/RU-MODELS.md), хранение в РФ.
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Сверь мойки прошлого месяца с договорами скриптом \
fleet_check.py (навык fleet-reconcile) и разбери дебиторку (receivables-check) — ничего не отправляй и стоп не ставь."""
uses = ["documents", "receivables", "deadlines", "reminders"]

[settings]
contracts = "data/fleet_contracts.csv"
washes = "data/fleet_washes.csv"
settlements = "data/settlements.csv"
stop_days = 15             # просрочка, после которой предлагаем стоп-обслуживание (если договор не задаёт иное)
company = "ООО «Пример-Мойка»"

[[integrations]]
id = "onec"
title = "Выгрузка из 1С: взаиморасчёты"
why = "Свежие долги и оплаты автопарков. Без неё — data/settlements.csv вручную."
how = "В 1С — регламентная выгрузка «Ведомость по расчётам с контрагентами» в CSV в data/ к 8:30 (или OData только на чтение). Счета и акты — в 1С файлом для загрузки, не напрямую."
optional = true

[[integrations]]
id = "booking-api"
title = "Касса / CRM автомойки (официальный API)"
why = "Мойки по госномерам автопарков из системы сети. Без неё — выгрузка в data/fleet_washes.csv."
how = "Если у вашей системы есть официальный API — MCP-сервер с ключом сети: панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "gmail"
why = "Счета, акты, напоминания бухгалтериям автопарков. Без него — черновики в outbox/."
optional = true

[[data_sources]]
title = "Договоры автопарков: data/fleet_contracts.csv"
kind = "client_export"
about = "договор, госномера, лимит моек, цена, отсрочка, лимит долга"

[[data_sources]]
title = "Мойки по госномерам: data/fleet_washes.csv"
kind = "client_export"
about = "выгрузка кассы или CRM всех филиалов"

[[data_sources]]
title = "Взаиморасчёты: data/settlements.csv"
kind = "client_export"
about = "выгрузка 1С или банка сети"

[[data_sources]]
title = "Касса / CRM сети"
kind = "official_api"
about = "только официальный API с ключом сети, если подключён"

[[schedule]]
at = "09:00"
days = [1, 2, 3, 4, 5]
title = "Автопарки: сверка и дебиторка"
prompt = """Сверь мойки автопарков за текущий месяц с договорами (навык fleet-reconcile): сверх лимита и чужие номера — \
вопросом. Разбери дебиторку (receivables-check, debt-steps, stop-shipment как стоп-обслуживание). Если сегодня \
последний рабочий день месяца (навык workdays) — черновики счетов и актов по каждому договору (fleet-month-close). \
Без «Да» ничего не отправляй и стоп не ставь."""

[[decisions]]
question = "Сверх лимита по договору <договор>: N моек на <сумма> ₽ — что делаем?"
options = ["Выставить сверх лимита", "Не выставлять", "Спросить клиента"]
when = "мойки сверх лимита договора за месяц"

[[decisions]]
question = "Счета и акты за <месяц> готовы (N договоров, сумма) — что дальше?"
options = ["Отправить", "Изменить", "Оставить черновиком"]
when = "последний рабочий день месяца"

[[decisions]]
question = "Стоп-обслуживание для <контрагент>? Долг, лимит, просрочка, последняя оплата"
options = ["Да", "Нет", "Напомнить и подождать 3 дня"]
when = "просрочка больше 15 дней или долг сверх лимита договора"
