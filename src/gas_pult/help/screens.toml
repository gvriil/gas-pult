chips = ["noaccess", "demo"]

[[screen.faq]]
id = "noaccess"
q = "Нет доступа — что делать?"
a = "Нажмите «Войти через Telegram» и «Запустить» в боте — бот спросит владельца пульта, пустить ли вас. Когда он даст роль, нажмите «Войти через Telegram» ещё раз."
actions = ["go:login"]

[[screen.faq]]
id = "demo"
q = "Можно посмотреть без входа?"
a = "Да: «Посмотреть демо» — та же панель на примерах, всё можно нажимать, ничего никуда не уходит."
actions = ["go:demo"]

[[screen]]
id = "terms"
where = "panel"
title = "Условия использования"
roles = ["owner", "member", "viewer"]
purpose = "Перед работой — условия использования пульта: у каждого свой аккаунт или ключ поставщика, подпиской не делимся, работаем из поддерживаемых стран."
steps = ["Прочитайте пункты.", "Нажмите «Принимаю» — дальше выбор страны."]
