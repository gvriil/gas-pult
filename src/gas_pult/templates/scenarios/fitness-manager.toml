# Роль «Менеджер отдела продаж фитнес-клуба» — формат: docs/SCENARIOS.md. Клуб и люди выдуманы.
title = "Менеджер фитнес-клуба (продажи и продления)"
short = "План по продлениям и новым картам: заявки сразу, «под риском» утром, мягкий возврат пропавших."
industries = ["Фитнес-клубы (семейные)"]
offer = ["fitness"]
modules = ["fitness-leads", "fitness-renewals", "fitness-lapsed"]
who = """Ваш план — продления и новые карты. Список «у кого скоро кончается карта» вы собираете из учётной системы \
вручную, ночные заявки с сайта ждут до утра, а про «пропавших» участников вспоминаете, когда они уже ушли в другой \
клуб."""
without = """Заявку, пришедшую в 23:00, разбирают в 10 утра — к этому времени человек уже записался в соседний клуб. \
Продления — звонками по выгрузке раз в неделю, кто попадёт. Участник, который три недели не ходит, получает первое \
сообщение только когда пишет «хочу вернуть деньги»."""
needs = [
    "Выгрузка карт, посещений и согласий на уведомления из учётной системы клуба (или её официальный API)",
    "Заявки: форма сайта (вебхук или письмо), сообщество ВКонтакте через официальный VK API, бот клуба",
    "Свободные слоты экскурсий и вводных тренировок — выгрузка расписания",
    "Правила клуба: заморозки, разрешённые скидки и семейное продление — их задаёте вы",
]
first_step = """Пришлите выгрузку карт и посещений за 3 месяца — через неделю каждое утро в 9:00 будет список «под \
риском» с причинами, а ночные заявки получат ответ сразу."""

[demo]
business = "Фитнес-клуб «Пример»"
point = "Центр"

[[moments]]
at = "08:30"
module = "fitness-leads"
text = """Тёплый список: 11 заявок за сутки, из них 4 ночью без ответа (сайт — 6, ВКонтакте — 3, Telegram — 2).
Первая: Мария (демо) — пробная тренировка в субботу 10:00, клуб «{{point}}».

Что делаем?"""
[[moments.buttons]]
label = "Раздать администраторам"
result = "Агент разложил бы заявки по администраторам смены с готовыми текстами ответа и свободными слотами."
[[moments.buttons]]
label = "Подробно"
result = "Агент показал бы все 11 заявок: откуда, что спрашивали, на что можно записать."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит через час; ночные заявки останутся первыми в списке."

[[moments]]
at = "09:00"
module = "fitness-renewals"
text = """Под риском 9 участников: карта кончается через 7–30 дней, посещений за месяц меньше четырёх.
Первые: Ирина (демо) — 1 визит за месяц, карта до 15.11; Павел (демо) — семейная карта, 2 визита; Елена (демо) — 0 визитов, жаловалась на расписание.

Под риском 9 участников — что делаем?"""
[[moments.buttons]]
label = "Позвонить"
result = "Агент поставил бы вам 9 звонков с подсказкой к каждому: когда ходил, что любит, что предложить по правилам клуба."
[[moments.buttons]]
label = "Персональное предложение"
result = "Агент подготовил бы черновики предложений в рамках разрешённых условий; отправка — после вашего «Да»."
[[moments.buttons]]
label = "Подробно"
result = "Агент показал бы всех 9: тип карты, посещения по неделям, причину риска."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит после обеда."

[[moments]]
at = "12:00"
module = "fitness-lapsed"
text = """Без посещений 2–3 недели, согласие на уведомления есть: 17 участников.
Пример: «Ирина, добрый день! Давно не видели вас в «{{point}}» — всё ли в порядке? Если неудобно время, ответьте — подберём расписание или тренера».

Отправить пачку из 17?"""
[[moments.buttons]]
label = "Отправить"
result = "В рабочем режиме сообщения ушли бы 17 участникам — сервисные, без акций. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Показать список"
result = "Агент показал бы список: имя, сколько дней без посещений, до какого числа карта."
[[moments.buttons]]
label = "Не сейчас"
result = "Агент ничего не отправит и спросит завтра."

[[moments]]
at = "16:20"
module = "fitness-lapsed"
text = """Сергей (демо) ответил на мягкое сообщение: «хочу уйти, не успеваю ходить». Карта 12 месяцев, по правилам клуба можно заморозить на 30 дней.

Предложить заморозку на 30 дней?"""
[[moments.buttons]]
label = "Предложить заморозку"
result = "Агент отправил бы текст про заморозку по правилам клуба; оформляет администратор. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Передать администратору"
result = "Агент передал бы диалог администратору клуба с кратким пересказом."
[[moments.buttons]]
label = "Ничего"
result = "Агент ничего не сделает: отказ — право участника."

