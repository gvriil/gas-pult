# Роль «Селлер на Wildberries и Ozon» — формат: docs/SCENARIOS.md. Магазин и товары выдуманы.
title = "Селлер на Wildberries и Ozon"
short = "Сотни артикулов на двух площадках: остатки и поставки, цена и маржа в акциях, ответы на отзывы."
industries = ["Селлеры WB и Ozon"]
offer = ["sellers"]
modules = ["wb-ozon-stock", "wb-ozon-prices", "wb-ozon-reviews"]
who = """У вас {{skus}} артикулов на двух площадках. Товар кончается на складе площадки раньше, чем доедет поставка, \
акции площадки уводят цену в минус, а отзывы копятся без ответа и роняют рейтинг."""
without = """Остатки смотрите по отчёту раз в неделю — хиты успевают «обнулиться» на складе площадки, и карточка падает в \
выдаче. О том, что площадка включила товар в акцию с минусовой маржой, узнаёте из отчёта о продажах. Ответы на \
отзывы — вечером, по 50 штук подряд."""
needs = [
    "Ключи продавца Wildberries API и Ozon Seller API — только чтение остатков, цен и отзывов; изменения — после «Да»",
    "Себестоимость и минимальные цены артикулов — таблица (prices.csv)",
    "Остатки своего склада — выгрузка",
    "Факты о товарах для ответов (размеры, материалы, гарантия) — короткий файл facts.md",
]
first_step = """Дайте ключ Wildberries API на чтение — через неделю в 9:00 будет прогноз «сколько дней хватит» по каждому \
артикулу и черновик плана поставки; цены и отзывы подключаем следующими."""

[demo]
business = "Магазин «Пример»"
point = "Wildberries"

[[moments]]
at = "09:00"
module = "wb-ozon-stock"
text = """Остатки на утро (демо) · {{business}}
Wildberries: 112 артикулов, хватит меньше чем на 7 дней — 9. Ozon: 87 артикулов, меньше 7 дней — 4.
План поставки: 13 артикулов, 2 400 шт. на склад площадки (демо).

Создать черновик поставки?"""
[[moments.buttons]]
label = "Создать черновик"
result = "Агент создал бы черновик поставки в кабинете через официальный API — без подтверждения отгрузки."
[[moments.buttons]]
label = "Изменить"
result = "Агент спросил бы, что поменять, и пересчитал план."
[[moments.buttons]]
label = "Не сейчас"
result = "Агент спросит завтра."

[[moments]]
at = "09:30"
module = "wb-ozon-prices"
text = """Термокружка (демо) на Ozon: маржа 6 % (порог — 15 %) — площадка снизила цену со своей стороны.

Изменить цену 1 290 → 1 390 ₽?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме цена изменилась бы через официальный API площадки. Сейчас ничего не изменено."
[[moments.buttons]]
label = "Другая цена"
result = "Агент спросил бы цену и показал маржу при ней."
[[moments.buttons]]
label = "Нет"
result = "Агент оставит цену и напомнит после обеда, если маржа не вырастет."

[[moments]]
at = "10:00"
module = "wb-ozon-reviews"
text = """Готовы 18 ответов: 14 на позитив, 4 на вопросы покупателей.
Первый: «Спасибо за отзыв! Рады, что органайзер подошёл по размеру».

Опубликовать 18 ответов?"""
[[moments.buttons]]
label = "Опубликовать все"
result = "В рабочем режиме 18 ответов опубликовались бы через официальные API площадок."
[[moments.buttons]]
label = "По одному"
result = "Агент прислал бы ответы по одному — каждый на «Да» или правку."
[[moments.buttons]]
label = "Нет"
result = "Ответы останутся черновиками до вечера."

[[moments]]
at = "15:30"
module = "wb-ozon-prices"
text = """Лампа (демо) попала в акцию Wildberries: маржа −3 % при цене акции.

Что делаем?"""
[[moments.buttons]]
label = "Выйти из акции"
result = "Агент вывел бы товар из акции через API — после вашего «Да»."
[[moments.buttons]]
label = "Остаться"
result = "Агент запишет решение и посчитает, сколько стоила акция, в вечерней сводке."
[[moments.buttons]]
label = "Поднять цену до акции"
result = "Агент предложил бы цену до акции, при которой маржа в акции — не ниже порога."

[[moments]]
at = "17:00"
module = "wb-ozon-reviews"
text = """Негативный отзыв ★2: «Кружка протекает, если перевернуть».
Ответ готов: «Здравствуйте! Жаль, что так вышло. Крышку нужно закрыть до щелчка — если всё равно протекает, напишите номер заказа в вопросах, заменим».

Опубликовать ответ?"""
[[moments.buttons]]
label = "Опубликовать"
result = "В рабочем режиме ответ опубликовался бы через API площадки."
[[moments.buttons]]
label = "Изменить"
result = "Агент спросил бы, что поменять, и прислал новый черновик."
[[moments.buttons]]
label = "Не отвечать"
result = "Агент запишет решение и уберёт отзыв из очереди."

