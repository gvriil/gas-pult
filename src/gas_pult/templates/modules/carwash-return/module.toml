# Модуль «Возврат клиентов и допродажа детейлинга» (автомойки и шиномонтаж, сеть) — формат файла: docs/MODULES.md
id = "carwash-return"
version = "1.0"
title = "Возврат клиентов и допродажа детейлинга"
industry = "Автомойки и шиномонтаж (сеть)"
about = "Кто не был 30–45 дней — «ждём вас»; после мойки — предложение детейлинга. Только с согласием и после «Да»."
description = """
Каждый день агент смотрит визиты по филиалам (data/visits.csv) и готовит две пачки. Возврат: клиенты, которые не
были {{return_from}}–{{return_to}} дней, — короткое приглашение в их филиал. Допродажа: кто был на мойке вчера или
сегодня и не брал детейлинг — предложение полировки, химчистки салона, защитного покрытия. Обе пачки — реклама: только
клиентам с согласием на рекламную рассылку (ст. 18 ФЗ «О рекламе»), одному клиенту — не чаще раза в {{min_gap_days}}
дней, отписка — всегда. Уходит только после «Отправить пачку из N?» — «Да»; без «Да» — черновики в outbox/. Для
клиентов в РФ сессия только на российской модели (GigaChat или YandexGPT, docs/RU-MODELS.md), хранение в РФ (152-ФЗ).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Отбери клиентов для возврата и допродажи (навык return-segment) \
и покажи, кому написали бы сегодня и почему остальных нет, — ничего не отправляй."""
uses = ["reminders"]

[settings]
visits = "data/visits.csv"
clients = "data/clients.csv"
return_from = 30          # дней без визита — начинаем приглашать
return_to = 45            # дней без визита — дальше не пишем (клиент ушёл — решает человек)
min_gap_days = 14         # одному клиенту — не чаще раза в N дней (любые наши рекламные сообщения)
upsell_hours = 30         # допродажа — в течение N часов после мойки
batch_max = 50

[[integrations]]
id = "booking-api"
title = "Система записи / CRM автомойки (официальный API)"
why = "Визиты и согласия напрямую. Без неё — выгрузки в data/visits.csv и data/clients.csv."
how = "Если у вашей системы есть официальный API (например, YCLIENTS REST API) — MCP-сервер с ключом сети: панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "telegram-sender"
title = "Бот или SMS-шлюз сети для сообщений клиентам"
why = "Отправить одобренную пачку. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота или SMS-шлюза сети."
optional = true

[[data_sources]]
title = "Визиты по филиалам: data/visits.csv"
kind = "client_export"
about = "выгрузка кассы или системы записи: дата, клиент, филиал, услуги"

[[data_sources]]
title = "Клиенты и согласия: data/clients.csv"
kind = "client_export"
about = "из CRM сети; согласие на рекламу — отдельным полем"

[[data_sources]]
title = "Система записи / CRM сети"
kind = "official_api"
about = "только официальный API с ключом сети, если подключён"

[[schedule]]
at = "11:00"
title = "Возврат и допродажа"
prompt = """Отбери клиентов для возврата ({{return_from}}–{{return_to}} дней без визита) и допродажи детейлинга после \
мойки (навык return-segment), собери две пачки (reminder-batch) и спроси «Отправить пачку из N?» о каждой. \
Без «Да» не отправляй; нет кандидатов — одна строка."""

[[decisions]]
question = "Отправить пачку из N? (возврат или детейлинг, филиалы, первые три имени)"
options = ["Да", "Нет"]
when = "каждый день, если есть кандидаты"

[[decisions]]
question = "Клиенты дольше 45 дней без визита — что делаем?"
options = ["Оставить", "Особое предложение", "Позже"]
when = "раз в неделю, если таких больше 10; предложение со скидкой — только по решению человека"

# Демо для страницы предложения и «Попробовать в Telegram» (docs/OFFERS.md): данные выдуманные, ничего не отправляется.
