# Модуль «Утренние цифры против плана» — формат файла: docs/MODULES.md
id = "morning-numbers"
version = "1.0"
title = "Утренние цифры против плана"
industry = "Общие"
about = "В 8:00 — план, факт и отклонения за вчера и с начала месяца, топ-3 отклонения и вопрос «что делаем»."
description = """
Источник — CSV, Google Таблицы или выгрузка из 1С (CSV/XLSX в папке data/). Каждое утро в {{time}} агент берёт
свежие данные, считает план, факт и отклонение по каждому показателю за вчера и с начала месяца, выбирает три
самых заметных отклонения (порог — {{threshold}} %) и спрашивает «Что делаем?» с 2–4 вариантами кнопками.
Полная сводка — в SUMMARY.md, история — в history/.
"""
start = """Прочитай CLAUDE.md этой папки. Посмотри, что лежит в data/, и спроси меня через вопрос с вариантами, \
откуда брать цифры: «CSV в data/», «Google Таблица», «Выгрузка 1С». Потом сделай пробную сводку по примеру \
данных, чтобы я увидел, как она будет выглядеть."""

[settings]
time = "8:00"
threshold = 5            # % — отклонение меньше порога не попадает в топ
source = "data/"         # CSV и выгрузки 1С; Google Таблица — ссылкой в SOURCE.md

[[integrations]]
id = "gdrive"
title = "Google Таблицы (через Google Диск)"
why = "Если план и факт ведёте в Google Таблицах — агент читает их сам. Не нужен, если данные лежат в data/."
optional = true

[[integrations]]
id = "onec"
title = "Выгрузка из 1С"
why = "Отчёт 1С (продажи, план продаж) сохраняется в CSV или XLSX в папку data/ этого пространства."
how = "В 1С — регламентная выгрузка отчёта в файл в общую папку или на почту; файл кладётся в data/ к 7:50."
optional = true

[[data_sources]]
title = "План и факт: CSV или выгрузка из 1С в data/"
kind = "client_export"

[[data_sources]]
title = "Google Таблицы"
kind = "official_api"
about = "через коннектор Google Диска claude.ai"

[[schedule]]
at = "08:00"
title = "Сводка план/факт"
prompt = """{{time}} — утренние цифры. Возьми свежие данные по источнику из SOURCE.md, посчитай план, факт \
и отклонение за вчера и с начала месяца (навык plan-fact), запиши SUMMARY.md и задай вопрос «Что делаем?» \
с 2–4 вариантами — кратко сводка прямо в тексте вопроса."""

[[decisions]]
question = "Что делаем? (сводка план/факт и топ-3 отклонения в тексте вопроса)"
options = ["Разобрать главное отклонение", "Подробно по показателю", "Всё в порядке", "Позже"]
when = "каждое утро после сводки; варианты агент подбирает под цифры дня"
