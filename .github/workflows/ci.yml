name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # раз в сутки — полная матрица, с macOS
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в PR отменяет прежний прогон этого PR. На main и по расписанию — своя группа у каждого прогона: иначе
# слияния подряд отменяют друг друга (даже без cancel-in-progress GitHub держит в группе один ожидающий прогон).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# macOS — только на main, раз в сутки и вручную: раннеров macOS arm64 у GitHub не хватает, задание по 15 минут ждёт
# в очереди и отменяется без шагов («The job was not acquired by Runner of type hosted even after multiple attempts»).
# В PR обязательная проверка — ubuntu. Отменённое без шагов перезапускает ci-retry.yml — один раз.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - name: shellcheck install.sh, bin/pult-tenant-setup
        run: shellcheck install.sh bin/pult-tenant-setup

  # «4 правила» (docs/FOUR-RULES.md): ключевые тесты, сверка API, деньги без float. ПРЕДУПРЕЖДЕНИЕ — ход работ, не
  # ломает; ОШИБКА — правило нарушено, задание красное.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python tools/four_rules.py

  # Контракт API (docs/openapi.json): схема — по стандарту OpenAPI 3.1 и совпадает с кодом (api_spec --check). В PR —
  # ломающие изменения против базовой ветки, как oasdiff в TGI: в /api/v1 (1С, CRM — внешний контракт) — ошибка,
  # остальное API панели — предупреждение (его меняем вместе с панелью). oasdiff — с проверкой контрольной суммы.
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_VERSION: "1.37.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e . "openapi-spec-validator==0.7.2"
      - name: docs/openapi.json совпадает с кодом
        run: python -m gas_pult.api_spec --check
      - name: Схема — OpenAPI 3.1
        run: python -m openapi_spec_validator docs/openapi.json
      - name: oasdiff (сверка контрольной суммы)
        if: github.event_name == 'pull_request'
        run: |
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          name="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/$name" "$base/$name"
          curl -fsSL -o /tmp/checksums.txt "$base/checksums.txt"
          (cd /tmp && grep " $name\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$name" -C /tmp oasdiff
          /tmp/oasdiff --version
      - name: Ломающие изменения /api/v1 — против базовой ветки
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:docs/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "docs/openapi.json нет в ${BASE_REF} — сравнивать не с чем"; exit 0
          fi
          /tmp/oasdiff breaking /tmp/base-openapi.json docs/openapi.json --match-path '^/api/v1/' --fail-on ERR \
            || { echo "::error::Ломающее изменение /api/v1 (контракт 1С и CRM): верните прежнее поведение или добавьте новый путь"; exit 1; }
      - name: Остальное API панели — предупреждение
        if: github.event_name == 'pull_request'
        run: |
          [ -s /tmp/base-openapi.json ] || exit 0
          /tmp/oasdiff breaking /tmp/base-openapi.json docs/openapi.json --fail-on ERR \
            || echo "::warning::Ломающее изменение внутреннего API панели — проверьте, что панель и мост обновлены вместе"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: gas-pult --version

  # Вход по ключу (passkeys.py) — необязательная зависимость webauthn: в обычной задаче её тесты пропускаются,
  # здесь пакет стоит и пропусков быть не должно.
  passkeys:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,passkeys]"
      - run: pip show webauthn | head -2
      - name: тесты ключей входа — без пропусков
        run: |
          set -o pipefail
          pytest -q -rs tests/test_passkeys.py | tee passkeys.log
          ! grep -q SKIPPED passkeys.log
      - run: pytest -q

  # Браузерные тесты панели (Playwright + Chromium): в задании «test» их нет (playwright не ставится) — здесь
  # он стоит, и ни один тест не должен пропуститься из-за браузера. Плюс замер покрытия Python (отчёт в логе).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40                 # 20.11: 30 мин кончились на 93 % — тестов больше, ни один не упал
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,browser]"
      # 22.11: фокус-ссылка на нескольких устройствах — три движка (tests/e2e/focus_devices_live.py): chromium (он же
      # Chrome и Edge), firefox, webkit (Safari, iPhone). Установка firefox и webkit — около минуты, проверка — секунды
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: все тесты, браузерные — без пропусков
        # pipefail: без него код шага — код tee (0), и упавшие тесты не валили задание (16.11: 35 упавших — «зелёный»)
        run: |
          set -o pipefail
          pytest -q -rs --cov=gas_pult --cov-report=term:skip-covered | tee browser.log
          ! grep -E "SKIPPED.*(playwright|браузер|chromium|firefox|webkit)" browser.log

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, rules, test, passkeys, browser]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
