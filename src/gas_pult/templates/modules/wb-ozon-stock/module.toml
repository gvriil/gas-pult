# Модуль «Остатки и поставки WB и Ozon» — формат файла: docs/MODULES.md
id = "wb-ozon-stock"
version = "1.0"
title = "Остатки и поставки WB и Ozon"
industry = "Селлеры WB и Ozon"
sections = ["analytics"]
about = "Сколько дней хватит остатков на складах площадок и что везти в следующую поставку — черновик, решаете вы."
description = """
Каждое утро по будням агент берёт остатки, товары в пути и заказы за 28 дней — через официальный API Wildberries
и Ozon Seller API или из выгрузки в data/stock.csv — и считает по каждому артикулу и складу, на сколько дней хватит
товара. Всё, что кончится раньше, чем доедет новая поставка ({{lead_days}} дн. + запас {{safety_days}} дн.), — в план
поставки с количеством, кратным коробу, и с учётом того, что есть на вашем складе (data/warehouse.csv).
План — в SUPPLY.md; «Создать черновик поставки?» — решаете вы. Сам агент поставки не создаёт и не отменяет.
"""
start = """Прочитай CLAUDE.md, data/stock.csv и data/warehouse.csv (пример выдуманный). Посчитай прогноз остатков \
(навык stock-forecast), сделай SUPPLY.md и покажи главное — ничего в кабинетах не создавай."""

[settings]
stock = "data/stock.csv"
warehouse = "data/warehouse.csv"
lead_days = 10
safety_days = 7
cover_days = 28

[[integrations]]
id = "wb-api"
title = "Wildberries API — статистика и аналитика"
why = "Остатки по складам WB и заказы — сами, без выгрузки. Без него — data/stock.csv из кабинета."
how = "Кабинет продавца WB → доступ к API → токен «только чтение» с категориями «Статистика» и «Аналитика». MCP-сервер — панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "ozon-seller-api"
title = "Ozon Seller API — остатки и аналитика"
why = "Остатки FBO по складам Ozon и заказы. Без него — выгрузка из кабинета в data/stock.csv."
how = "Кабинет продавца Ozon → Seller API: Client-Id и API-ключ с правами только на чтение; MCP-сервер — «Свой сервер (адрес)»."
optional = true

[[data_sources]]
title = "Остатки и заказы Wildberries"
kind = "official_api"
about = "API статистики и аналитики, dev.wildberries.ru — ключ продавца «только чтение»"

[[data_sources]]
title = "Остатки и заказы Ozon"
kind = "official_api"
about = "Ozon Seller API (docs.ozon.ru/api/seller) — Client-Id и API-ключ продавца"

[[data_sources]]
title = "Остатки, заказы и свой склад: data/stock.csv, data/warehouse.csv"
kind = "client_export"
about = "отчёты из кабинетов площадок и остатки своего склада (1С, таблица)"

[[schedule]]
at = "09:00"
days = [1, 2, 3, 4, 5]
title = "Прогноз остатков и план поставки"
prompt = """Обнови прогноз остатков (навык stock-forecast): свежие данные из API или data/, SUPPLY.md, затем вопрос \
«Создать черновик поставки?» с вариантами. В кабинетах ничего не создавай без ответа «Создать»."""

[[decisions]]
question = "План поставки: N артикулов, M шт. на <склад>. Создать черновик поставки?"
options = ["Создать черновик", "Изменить", "Не сейчас"]
when = "каждое утро, если что-то кончится раньше, чем доедет поставка"

[[decisions]]
question = "На своём складе не хватает <артикул> для поставки — что делаем?"
options = ["Везти сколько есть", "Заказать у поставщика", "Пропустить"]
when = "когда план больше остатка своего склада"

# Демо для страницы предложения и «Попробовать в Telegram» (docs/OFFERS.md): данные выдуманные, ничего не отправляется.
[demo]
kind = "summary"

[[demo.telegram]]
text = """📥 Новый заказ-рекорд (демо) · {{business}}
Термокружка (демо): 64 заказа за сутки на {{point}} — в 3 раза больше среднего. Остатка хватит на 4 дня."""
buttons = ["Добавить в поставку", "Наблюдать"]
replies = ["В рабочем режиме агент добавил бы артикул в черновик поставки — сам черновик вы подтверждаете.", "Агент проверит завтра и напишет, если спрос держится."]

[[demo.telegram]]
text = """💬 Сообщение поставщику (демо)
«Добрый день! Нужна допоставка: термокружка — 300 шт., органайзер — 150 шт. к 12.11. Подтвердите, пожалуйста, сроки».

Артикулов, которым не хватит остатков на 14 дней: {{n}}. Отправить запрос поставщику по {{n}}?"""
buttons = ["Отправить", "Показать список", "Не сейчас"]
replies = ["В рабочем режиме письмо ушло бы поставщику от вашего имени. Сейчас ничего не отправлено.", "Агент показал бы артикулы: остаток, продажи в день, на сколько дней хватит.", "Агент спросит завтра."]

[[demo.telegram]]
text = """📊 Остатки на утро (демо) · {{business}}
Wildberries: 112 артикулов, хватит меньше чем на 7 дней — 9. Ozon: 87 артикулов, меньше 7 дней — 4.
Заказы вчера: 1 230 шт. (+8 % к среднему)."""
buttons = []
replies = []

[[demo.telegram]]
text = """❓ Вопрос агента (демо)
План поставки: 13 артикулов, 2 400 шт. на склад площадки (демо). Создать черновик поставки?"""
buttons = ["Создать черновик", "Изменить", "Не сейчас"]
replies = ["Агент создал бы черновик поставки в кабинете через официальный API — без подтверждения отгрузки.", "Агент спросил бы, что поменять, и пересчитал план.", "Агент спросит завтра."]
