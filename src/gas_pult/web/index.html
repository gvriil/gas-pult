<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gas-pult · пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --accent: var(--tg-theme-button-color, #2a7ae2);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e53935);
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --idle: #34c759; --busy: #0a84ff; --dialog: #ff9f0a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg2); color: var(--text);
         font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  header { position: sticky; top: 0; z-index: 3; background: var(--bg2); padding: 12px 16px 8px; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--hint); font-size: 13px; }
  main { padding: 0 12px 24px; }
  #detail { padding-bottom: 150px; }
  .card { display: block; width: 100%; text-align: left; border: 0; margin: 0 0 8px; padding: 12px 14px;
          background: var(--bg); border-radius: 12px; }
  .card.active { box-shadow: inset 0 0 0 2px var(--accent); }
  .card.new { color: var(--accent); font-weight: 600; text-align: center; }
  .row { display: flex; align-items: center; gap: 8px; }
  .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--idle); }
  .busy .dot { background: var(--busy); animation: pulse 1.2s infinite; } .dialog .dot { background: var(--dialog); }
  @keyframes pulse { 50% { opacity: .35; } }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--accent); color: var(--accent-text); }
  .meta { color: var(--hint); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx { height: 4px; border-radius: 2px; background: var(--sep); margin-top: 8px; overflow: hidden; }
  .ctx i { display: block; height: 100%; background: var(--accent); }
  .tabs { display: flex; gap: 4px; padding: 3px; margin: 0 0 8px; background: var(--sep); border-radius: 10px; }
  .tabs button { flex: 1; border: 0; padding: 6px; border-radius: 8px; background: transparent; font-size: 14px; }
  .tabs button.on { background: var(--bg); font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; scrollbar-width: none; }
  .chips button { flex: none; border: 0; padding: 7px 12px; border-radius: 16px; background: var(--bg); font-size: 14px; }
  .keys button { min-width: 44px; font-weight: 600; }
  .panel { background: var(--bg); border-radius: 12px; padding: 12px 14px; overflow-x: auto; }
  .md { font-size: 15px; } .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--sep); padding: 4px 6px; vertical-align: top; }
  .md pre, .screen { background: var(--bg2); border-radius: 8px; padding: 8px; overflow-x: auto; font-size: 12px; }
  .md code { font-size: 13px; } .md a { color: var(--link); }
  .screen { margin: 0; white-space: pre; font-family: ui-monospace, Menlo, monospace; }
  .empty { color: var(--hint); text-align: center; padding: 32px 16px; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; gap: 8px; align-items: flex-end;
              padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--sep); }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--sep); border-radius: 18px; padding: 8px 14px;
                       background: var(--bg2); color: var(--text); font: inherit; max-height: 160px; outline: none; }
  .round { width: 40px; height: 40px; border: 0; border-radius: 50%; flex: none; font-size: 18px; background: var(--bg2); }
  .round.send { background: var(--accent); color: var(--accent-text); }
  .round.rec { background: var(--danger); color: #fff; animation: pulse 1s infinite; }
  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 75vh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
           padding: 8px 0 calc(12px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 8px 16px; font-size: 15px; color: var(--hint); font-weight: 600; }
  .sheet button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 12px 16px; font-size: 16px; }
  .sheet button.danger { color: var(--danger); }
  .toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 20; background: var(--text); color: var(--bg);
           padding: 8px 14px; border-radius: 10px; font-size: 14px; max-width: 90vw; }
  audio { width: 100%; margin: 0 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 id="title">Сессии</h1>
  <div class="sub" id="subtitle">загружаю…</div>
</header>
<main>
  <section id="list"></section>
  <section id="detail" hidden>
    <div class="tabs"><button data-tab="last" class="on">Ответ</button><button data-tab="screen">Экран</button></div>
    <div class="chips" id="actions">
      <button data-act="say">🔊 Кратко</button><button data-act="sayfull">🔊 Целиком</button>
      <button data-act="commands">⚡ Команды</button><button data-act="models">🧠 Модель</button>
      <button data-act="more">⋯</button>
    </div>
    <div class="chips keys" id="keys" hidden></div>
    <audio id="player" controls hidden></audio>
    <div class="panel" id="content"></div>
  </section>
</main>
<div class="composer" id="composer" hidden>
  <button class="round" id="mic" title="Голосовое">🎙</button>
  <textarea id="input" rows="1" placeholder="Сообщение… (или диктовка клавиатуры)"></textarea>
  <button class="round send" id="send" title="Отправить">➤</button>
</div>
<script>
const tg = window.Telegram?.WebApp;
const STATUS = { idle: "свободна", busy: "работает", dialog: "ждёт выбора" };
let sessions = [], meta = null, current = null, tab = "last", lastStatus = null, rec = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const folder = (p) => p.split("/").filter(Boolean).pop() || "~";
const cur = () => sessions.find((x) => x.id === current);

function toast(text, ms = 2500) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  document.body.append(t); setTimeout(() => t.remove(), ms);
}

async function api(path, body, raw) {
  const headers = { "X-Telegram-Init-Data": tg?.initData || "" };
  if (body && !raw) headers["Content-Type"] = "application/json";
  if (raw) headers["Content-Type"] = raw;
  const r = await fetch(path, { method: body ? "POST" : "GET", headers, body: body ? (raw ? body : JSON.stringify(body)) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return (r.headers.get("Content-Type") || "").startsWith("application/json") ? r.json() : r.blob();
}

function sheet(title, items) {        // items: [{label, run, danger}]
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3>${items.map((it, i) =>
    `<button data-i="${i}" class="${it.danger ? "danger" : ""}">${esc(it.label)}</button>`).join("")}</div>`;
  bg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); bg.remove();
    if (b) items[+b.dataset.i].run();
  });
  document.body.append(bg);
}

// ---------- список ----------
function card(s) {
  const ctx = s.context == null ? "" : `<div class="ctx"><i style="width:${100 - s.context}%"></i></div>`;
  return `<button class="card ${s.status}${s.active ? " active" : ""}" data-id="${esc(s.id)}">
    <div class="row"><span class="dot"></span><span class="name">${esc(s.name)}</span>${s.active ? '<span class="badge">активная</span>' : ""}</div>
    <div class="meta">${STATUS[s.status]} · ${esc(folder(s.path))}${s.branch ? " · " + esc(s.branch) : ""}${s.context == null ? "" : " · контекст свободен " + s.context + "%"}${s.channel ? " · 📡" : ""}</div>
    ${ctx}</button>`;
}

async function refresh() {
  try {
    const d = await api("/api/sessions");
    sessions = d.sessions;
    if (!current) {
      $("subtitle").textContent = `${d.host} · ${sessions.length} в работе · обновляется сама`;
      $("list").innerHTML = '<button class="card new" data-new>＋ Новая сессия</button>' +
        (sessions.length ? sessions.map(card).join("") : '<div class="empty">Сессий с Claude нет — откройте новую.</div>');
      return;
    }
    const s = cur();
    if (!s) { toast("Сессия закрыта"); return back(); }
    $("subtitle").textContent = `${STATUS[s.status]} · ${folder(s.path)}${s.branch ? " · " + s.branch : ""}${s.context == null ? "" : " · контекст " + s.context + "%"}`;
    $("keys").hidden = !(s.status === "dialog" || tab === "screen");
    if (lastStatus === "busy" && s.status !== "busy") { setTab(s.status === "dialog" ? "screen" : "last"); tg?.HapticFeedback.notificationOccurred("success"); }
    else if (tab === "screen") loadContent();
    lastStatus = s.status;
  } catch (e) {
    $("subtitle").textContent = "нет связи: " + e.message;
  }
}

// ---------- сессия ----------
async function loadContent() {
  if (!current) return;
  try {
    if (tab === "last") {
      const d = await api("/api/last?w=" + encodeURIComponent(current));
      $("content").innerHTML = d.text ? `<div class="md">${DOMPurify.sanitize(marked.parse(d.text))}</div>` : '<div class="empty">Ответов пока нет.</div>';
    } else showScreen((await api("/api/screen?w=" + encodeURIComponent(current))).lines);
  } catch (e) { $("content").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
const showScreen = (lines) => { $("content").innerHTML = `<pre class="screen">${esc(lines.join("\n"))}</pre>`; };

function setTab(t) {
  tab = t;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  $("keys").hidden = !(t === "screen" || cur()?.status === "dialog");
  loadContent();
}

function open(id) {
  current = id; lastStatus = cur()?.status;
  $("title").textContent = cur()?.name || "Сессия";
  $("list").hidden = true; $("detail").hidden = false; $("composer").hidden = false; $("player").hidden = true;
  $("content").innerHTML = '<div class="empty">загружаю…</div>';
  tg?.BackButton.show(); setTab(cur()?.status === "dialog" ? "screen" : "last"); refresh();
  tg?.HapticFeedback.selectionChanged();
}

function back() {
  current = null; $("title").textContent = "Сессии";
  $("detail").hidden = true; $("composer").hidden = true; $("list").hidden = false;
  $("player").pause(); tg?.BackButton.hide(); refresh();
}

async function act(path, body, okText) {
  try {
    const d = await api(path, { w: current, ...body });
    if (d.lines) { setTab("screen"); showScreen(d.lines); }
    if (okText) toast(okText);
    tg?.HapticFeedback.impactOccurred("light");
    return d;
  } catch (e) { toast("Не вышло: " + e.message, 4000); }
}

async function say(full) {
  toast(full ? "Готовлю озвучку целиком…" : "Готовлю озвучку…", 4000);
  try {
    const blob = await api(`/api/tts?w=${encodeURIComponent(current)}&full=${full ? 1 : 0}`);
    const p = $("player"); p.src = URL.createObjectURL(blob); p.hidden = false; p.play().catch(() => toast("Нажмите ▶ на плеере"));
  } catch (e) { toast("Озвучка: " + e.message, 4000); }
}

const ACTIONS = {
  say: () => say(false),
  sayfull: () => say(true),
  commands: () => sheet("⚡ Команды", meta.commands.map((label, i) => ({
    label, run: async () => { const d = await act("/api/command", { i }, null); if (d?.models) ACTIONS.models(); else if (d?.sent) { toast("Отправлено"); setTab("screen"); } },
  }))),
  models: () => sheet("🧠 Модель", [...meta.models.map((m) => ({ label: m, run: () => act("/api/model", { name: m }, "Модель: " + m) })),
                                    { label: "Меню выбора /model", run: () => act("/api/model", { name: "" }) }]),
  more: () => sheet(cur()?.name || "Сессия", [
    { label: "✅ Сделать активной (ответы в чате бота — от неё)", run: () => act("/api/active", {}, "Активная").then(refresh) },
    { label: "⛔ Закрыть сессию", danger: true, run: () => tg ? tg.showConfirm("Закрыть сессию? Claude выйдет штатно.", (ok) => ok && closeSession()) : closeSession() },
  ]),
};
async function closeSession() { const d = await act("/api/close", {}); if (d) { toast("Закрытие: " + d.result, 4000); if (d.result === "закрыто") back(); } }

// ---------- ввод: текст, диктовка, голосовое ----------
async function sendText() {
  const text = $("input").value.trim();
  if (!text || !current) return;
  $("send").disabled = true;
  try {
    await api("/api/send", { w: current, text });
    $("input").value = ""; grow(); toast("Отправлено в «" + (cur()?.name || "") + "»");
    lastStatus = "busy"; setTab("screen"); tg?.HapticFeedback.notificationOccurred("success");
  } catch (e) { toast("Не отправлено: " + e.message, 4000); }
  $("send").disabled = false;
}

async function toggleMic() {
  if (rec) { rec.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    return toast("Запись недоступна в этом Telegram — диктуйте микрофоном клавиатуры", 4500);
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    const chunks = []; rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop()); $("mic").classList.remove("rec"); rec = null;
      const blob = new Blob(chunks, { type: (type || "audio/webm").split(";")[0] });
      toast("Распознаю…", 6000);
      try {
        const d = await api("/api/stt", blob, blob.type);
        $("input").value = ($("input").value + " " + d.text).trim(); grow(); $("input").focus();
        toast("Проверьте текст и нажмите ➤");
      } catch (e) { toast("Не распознал: " + e.message, 4000); }
    };
    rec.start(); $("mic").classList.add("rec"); tg?.HapticFeedback.impactOccurred("medium");
    toast("Говорите… нажмите 🎙 ещё раз, чтобы закончить", 3000);
  } catch (e) { toast("Нет доступа к микрофону: " + e.message, 4500); }
}

function grow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

// ---------- события ----------
$("list").addEventListener("click", (e) => {
  if (e.target.closest("[data-new]")) {
    return sheet("Новая сессия — в какой папке?", meta.projects.map((label, i) => ({
      label, run: async () => {
        try { const d = await api("/api/new", { i }); toast("Сессия открывается…", 3000); await refresh(); open(d.id); }
        catch (err) { toast("Не вышло: " + err.message, 4000); }
      },
    })));
  }
  const c = e.target.closest(".card"); if (c) open(c.dataset.id);
});
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
$("actions").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) ACTIONS[b.dataset.act](); });
$("keys").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) act("/api/key", { key: b.dataset.key }); });
$("send").addEventListener("click", sendText);
$("mic").addEventListener("click", toggleMic);
$("input").addEventListener("input", grow);

(async () => {
  if (!tg?.initData) { $("subtitle").textContent = "Откройте панель из Telegram — кнопкой «📱 Панель» в меню бота."; return; }
  tg.ready(); tg.expand(); tg.BackButton.onClick(back);
  try {
    meta = await api("/api/meta");
    $("keys").innerHTML = meta.keys.map((k) => `<button data-key="${esc(k.key)}">${esc(k.label)}</button>`).join("");
    if (!meta.voices.length) document.querySelectorAll("[data-act^=say]").forEach((b) => (b.hidden = true));
  } catch (e) { $("subtitle").textContent = "нет связи: " + e.message; return; }
  await refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
