[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gas-pult"
dynamic = ["version"]
description = "Telegram-пульт для сессий Claude Code в tmux: ответы, диалоги, голос и команды — с телефона"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [{ name = "gvriil" }]
keywords = ["claude-code", "telegram-bot", "tmux", "remote-control", "tts", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
]
# Ядро — только стандартная библиотека. Голос — по желанию.
dependencies = []

[project.optional-dependencies]
voice = ["piper-tts>=1.3", "faster-whisper>=1.1", "imageio-ffmpeg>=0.5", "numpy>=1.26"]
silero = ["torch>=2.4", "numpy>=1.26", "scipy>=1.13"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
gas-pult = "gas_pult.cli:main"

[project.urls]
Homepage = "https://github.com/gvriil/gas-pult"
Issues = "https://github.com/gvriil/gas-pult/issues"
Changelog = "https://github.com/gvriil/gas-pult/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/gas_pult/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gas_pult"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE.md", "CHANGELOG.md", "install.sh", "config.example.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]   # кириллица в строках — норма для русского интерфейса

[tool.pytest.ini_options]
testpaths = ["tests"]
