# Модуль «Утренняя сводка директора УК» (пакет «УК-старт») — формат файла: docs/MODULES.md
id = "uk-morning"
version = "1.0"
title = "Утренняя сводка директора УК"
industry = "Управляющие компании — «УК-старт»"
about = "В 8:00 — обращения со сроком сегодня и просроченные, аварии за сутки и где не уложились в 30 минут, плановые работы — и вопрос «что делаем»."
description = """
Каждое утро кроме воскресенья агент собирает сводку для директора управляющей организации: обращения жителей
(срок сегодня и завтра, просроченные — из реестра модуля «Сроки обращений»), аварийные заявки за сутки (сколько,
где локализация дольше 30 минут, что не устранено — из журнала модуля «Аварийная диспетчерская»), плановые работы
и отключения на сегодня (data/works.csv). Полностью — SUMMARY.md, в Telegram — до шести строк и вопрос «Что делаем?»
с вариантами. Сессия — только на российской модели (GigaChat или YandexGPT, docs/RU-MODELS.md); в сводке — без ФИО
и телефонов жителей.
"""
start = """Прочитай CLAUDE.md и данные (пример выдуманный в data/; если рядом есть папки uk-requests и \
uk-emergency — их реестры). Собери пробную сводку навыком director-summary и покажи её."""
uses = ["deadlines"]

[settings]
requests = "../uk-requests/data/requests.csv"
emergency = "../uk-emergency/data/emergency.csv"
works = "data/works.csv"
region = "РФ"

[[data_sources]]
title = "Реестр обращений и журнал АДС"
kind = "client_export"
about = "файлы модулей «Сроки обращений» и «Аварийная диспетчерская» или выгрузки УК в data/"

[[data_sources]]
title = "Плановые работы и отключения: data/works.csv"
kind = "client_export"
about = "план работ УК и уведомления ресурсоснабжающих организаций"

[[schedule]]
at = "08:00"
days = [1, 2, 3, 4, 5, 6]
title = "Сводка директора"
prompt = """Собери утреннюю сводку директора (навык director-summary): SUMMARY.md и вопрос «Что делаем?» с 2–4 \
вариантами под ситуацию дня."""

[[decisions]]
question = "Что делаем? (обращения: просрочено/сегодня; аварии за сутки: всего/дольше 30 мин; работы)"
options = ["Разобрать просроченные", "Подробно по авариям", "Всё в порядке", "Позже"]
when = "каждое утро после сводки; варианты агент подбирает под день"
