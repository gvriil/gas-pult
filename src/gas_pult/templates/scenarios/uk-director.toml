# Роль «Директор управляющей компании» — формат: docs/SCENARIOS.md. УК, дома и люди выдуманы.
title = "Директор управляющей компании"
short = "Сводка утром, сроки ответов жителям, предписания жилинспекции, долги и раскрытие в ГИС ЖКХ."
industries = ["Управляющие компании — «УК-старт»"]
offer = ["uk"]
modules = ["uk-morning", "uk-gis-disclosure", "uk-inspections", "uk-debts", "uk-requests"]
who = """У вас в управлении многоквартирные дома — {{houses}} шт. Жилинспекция штрафует за просроченные ответы жителям и неисполненные \
предписания, долги растут, а раскрытие в ГИС ЖКХ кто-то «вроде размещал». О проблемах вы узнаёте из жалоб, а не \
заранее."""
without = """Сроки ответов жителям считают в календарных днях вместо рабочих — и ошибаются. Пункт предписания \
вспоминают за день до проверки. Должник, которому полгода назад надо было отправить претензию, всё ещё на ступени \
«напомнить». Что не размещено в ГИС ЖКХ, выясняется из акта проверки."""
needs = [
    "Реестр обращений жителей и журнал аварийной службы — выгрузка (CSV, XLSX) из вашей системы или таблицы",
    "Начисления, оплаты и список должников — выгрузка из биллинга; статусы дел вносит человек (открытого API нет)",
    "Предписания жилинспекции (PDF, скан, текст) и фото или акты по пунктам — в папку пространства",
    "Выгрузка размещённого в ГИС ЖКХ — только ваша выгрузка, без входа агента в кабинет",
]
first_step = """Пришлите реестр обращений за последний месяц — через неделю сроки по Правилам № 416 и № 354 в рабочих \
днях будут в сводке в 8:00, с сигналом за день до срока. Долги, предписания и ГИС ЖКХ — по одному модулю дальше."""

[demo]
business = "УК «Пример»"
point = "Примерная, 1"

[[moments]]
at = "08:00"
module = "uk-morning"
text = """Сводка директора (демо) · {{business}}
Обращения: просрочено 1, срок сегодня 3, новых за сутки 17.
Аварии за сутки: 2, дольше 30 минут без отметки о локализации — 1 (дом «{{point}}», ХВС).
Плановые работы: отключение ГВС, Тестовая, 12, 10:00–16:00.

Что делаем?"""
[[moments.buttons]]
label = "Разобрать просроченные"
result = "Агент прислал бы просроченное обращение с историей, сроком по правилам и черновиком ответа жителю."
[[moments.buttons]]
label = "Подробно по авариям"
result = "Агент показал бы обе аварии: время звонка, локализации, кто выезжал, где не уложились в 30 минут."
[[moments.buttons]]
label = "Всё в порядке"
result = "Агент запишет, что сводка просмотрена, и не будет беспокоить до сигнала по сроку."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит через час."

[[moments]]
at = "09:00"
day = "1-й рабочий день месяца"
module = "uk-gis-disclosure"
text = """Сверка раскрытия в ГИС ЖКХ по чек-листу и вашей выгрузке: не размещено 4 (первое: отчёт об исполнении договора управления, дом «{{point}}», срок был 31.03), с опозданием — 2.

Поручить?"""
[[moments.buttons]]
label = "Поручить всё ответственному"
result = "Агент поставил бы ответственному задачу со списком из 4 пунктов и сроками."
[[moments.buttons]]
label = "Поручить по пунктам"
result = "Агент спросил бы по каждому пункту, кому поручить."
[[moments.buttons]]
label = "Уже размещено — обновлю выгрузку"
result = "Агент дождётся новой выгрузки и сверит снова."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит завтра."

[[moments]]
at = "09:10"
module = "uk-inspections"
text = """Пункт 3 предписания № 41-П (демо): ремонт отмостки, дом «{{point}}». До срока 2 рабочих дня, фото и актов нет.

Просить продление?"""
[[moments.buttons]]
label = "Просить продление"
result = "Агент подготовил бы черновик ходатайства об отсрочке с обоснованием; подписываете и отправляете вы."
[[moments.buttons]]
label = "Успеем — напомнить исполнителю"
result = "Агент напомнил бы исполнителю о сроке и о том, какие фото и акты нужны для отчёта."
[[moments.buttons]]
label = "Позже"
result = "Агент спросит снова завтра — срок станет 1 рабочий день."

[[moments]]
at = "09:30"
module = "uk-debts"
text = """ЛС-000-01 (демо): долг 38 400 ₽ за 7 месяцев, пени 2 160 ₽ (по ч. 14 ст. 155 ЖК РФ). Напоминания были дважды, оплат нет.

Перевести на «претензию»?"""
[[moments.buttons]]
label = "Да"
result = "Агент подготовил бы черновик претензии с расчётом пеней; подписывает юрист, отправляете вы."
[[moments.buttons]]
label = "Нет"
result = "Должник останется на ступени «напоминание»."
[[moments.buttons]]
label = "Отложить на 14 дней"
result = "Агент вернётся к должнику через 14 дней с новым расчётом."
[[moments.buttons]]
label = "Рассрочка"
result = "Агент подготовил бы черновик соглашения о рассрочке — условия задаёте вы."

[[moments]]
at = "14:00"
module = "uk-requests"
text = """Готовы черновики ответов жителям, срок которых истекает завтра: 5.
Пример: «Добрый день! По вашему обращению № 418 о перерасчёте: перерасчёт за октябрь будет в квитанции за ноябрь».

Отправить пачку из 5?"""
[[moments.buttons]]
label = "Отправить"
result = "В рабочем режиме ответы ушли бы 5 жителям через канал УК. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Показать черновики"
result = "Агент показал бы все черновики по одному — каждый на «Да» или правку."
[[moments.buttons]]
label = "Не сейчас"
result = "Агент напомнит перед концом дня: срок — завтра."

[[inputs]]
id = "houses"
title = "Домов в управлении"
unit = "шт."
default = 30
min = 1
max = 2000
offer = "points"
about = "Многоквартирные дома в управлении."

[[inputs]]
id = "requests"
title = "Обращений жителей в месяц"
unit = "шт."
default = 400
min = 1
max = 50000
step = 10
about = "Все письменные и устные обращения в реестре."

[[inputs]]
id = "debtors"
title = "Должников дольше 3 месяцев"
unit = "лицевых счетов"
default = 120
min = 1
max = 50000
about = "Лицевые счета с долгом дольше трёх месяцев."

[[inputs]]
id = "avg_debt"
title = "Средний долг"
unit = "₽"
default = 25000
min = 1000
max = 1000000
step = 1000
about = "Средний долг по этим лицевым счетам."

[[benefit]]
title = "Ответы жителям, ушедшие в срок"
unit = "ответов в месяц"
of = ["requests"]
low = 0.02
high = 0.05
round = 1
about = "Допущение: без учёта рабочих дней и сигнала заранее 2–5 % ответов уходят с опозданием; агент считает сроки по правилам и предупреждает за день."

[[benefit]]
title = "Собранные долги сверх обычного"
unit = "₽ в месяц"
of = ["debtors", "avg_debt"]
low = 0.01
high = 0.03
round = 1000
about = "Допущение: ступени (напоминание → претензия → судебный приказ) без пропусков возвращают дополнительно 1–3 % просроченного долга в месяц. Проверим на пилоте."

[[benefit]]
title = "Время юриста и бухгалтера на документы по долгам"
unit = "ч в месяц"
of = ["debtors"]
low = 0.05
high = 0.1
round = 1
about = "Допущение: 3–6 минут на должника в месяц на расчёт пеней и черновики; агент считает, юрист только проверяет и подписывает."
