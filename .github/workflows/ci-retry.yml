name: CI retry

# Задания CI, отменённые без единого шага (не нашлось раннера — у GitHub не хватает macOS arm64), перезапускаются
# один раз. Отмена из-за нового пуша (в прогоне PR есть более свежий коммит) — не перезапускаем: тот прогон уже идёт.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.run_attempt == 1 && contains(fromJSON('["cancelled", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: отменённые без шагов — перезапустить один раз
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # отменены без шагов — раннер так и не взял задание; настоящие падения тестов не перезапускаем
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .id')
          if [ -z "$jobs" ]; then echo "нечего перезапускать"; exit 0; fi
          # после этого прогона в ветку пришёл новый коммит — его прогон уже идёт, этот не нужен
          head=$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha 2>/dev/null || echo "$SHA")
          if [ "$head" != "$SHA" ]; then echo "в ветке новый коммит — не перезапускаю"; exit 0; fi
          for j in $jobs; do
            echo "перезапускаю задание $j (отменено без шагов)"
            gh run rerun --job "$j" --repo "$REPO"
          done
