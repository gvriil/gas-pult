# Модуль «Заказ из мессенджера» — формат файла: docs/MODULES.md
id = "horeca-orders"
version = "1.0"
title = "Заказ из мессенджера"
industry = "Поставщики HoReCa"
sections = ["analytics", "docs"]
about = "Сообщение шефа «на завтра базилик 2 кг, руккола 3…» → позиции по прайсу; подтвердить или предложить замену — кнопкой."
description = """
Для поставщика свежей продукции ресторанам: шеф пишет заказ как привык — в мессенджер, на почту, голосом
(расшифровка) — сообщение попадает в inbox/ или в сессию. Агент находит позиции в прайсе data/price.csv (с учётом
синонимов и единиц), считает сумму, проверяет наличие (data/stock.csv), минимальную партию и стоп-лист должников, и
спрашивает: «Подтвердить», «Предложить замену», «Изменить», «Отклонить». Ответ шефу и счёт — черновиком, уходят
после «Да». В 18:00 — лист сборки на завтра.
"""
start = """Прочитай CLAUDE.md, data/price.csv, data/customers.csv и пример заказа в inbox/ (всё выдуманное). Разбери \
заказ навыком order-parse и задай вопрос о подтверждении — шефу ничего не отправляй."""
uses = ["reminders", "documents"]

[settings]
price = "data/price.csv"
customers = "data/customers.csv"
stock = "data/stock.csv"
stop_list = "data/stop-list.csv"
cutoff = "20:00"

[[integrations]]
id = "telegram-sender"
title = "Бот приёма заказов (Telegram)"
why = "Заказы шефов из бота компании — сразу в inbox/, ответы шефам после «Да». Без него — пересылаете сообщение в сессию сами."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота компании."
optional = true

[[integrations]]
id = "gmail"
why = "Заказы, присланные письмом, и отправка счёта. Без него — inbox/ и outbox/."
optional = true

[[data_sources]]
title = "Прайс, остатки, рестораны: data/price.csv, data/stock.csv, data/customers.csv"
kind = "client_export"
about = "из учёта поставщика (1С, таблица)"

[[data_sources]]
title = "Сообщения с заказами: inbox/"
kind = "client_export"
about = "что шефы прислали поставщику — бот компании, почта или пересылка"

[[schedule]]
at = "18:00"
title = "Лист сборки на завтра"
prompt = """Собери подтверждённые заказы на завтра в лист сборки (навык order-parse, раздел «Лист сборки»): \
позиции итогом, по ресторанам, чего не хватает по остаткам. Неподтверждённые — списком с вопросом."""

[[decisions]]
question = "Заказ <ресторан> на <дата>: N позиций, <сумма> ₽. <чего нет — замена?>"
options = ["Подтвердить", "Предложить замену", "Изменить", "Отклонить"]
when = "на каждый новый заказ"

[[decisions]]
question = "<ресторан> в стоп-листе по долгу — принять заказ?"
options = ["Принять", "Принять по предоплате", "Отказать вежливо"]
when = "заказ от ресторана из стоп-листа"
