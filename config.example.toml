# gas-pult — все настройки. Файл: ~/.config/gas-pult/config.toml
# `gas-pult init` создаёт его сам; здесь — что можно поменять. После правки перезапустите службу.

# Кто может управлять пультом — Telegram ID (узнать: `gas-pult init` или @userinfobot).
# Ответы Claude приходят всем владельцам; активное окно у всех общее.
owners = [123456789]

# Сессия tmux, окна которой видит пульт (новые окна открываются в ней же).
session = "main"

# Подпись машины на кнопке «▶️ Выполнить на …». По умолчанию — имя хоста.
# host = "my-server"

# Чем запускать Claude Code в новом окне. Можно с флагами: "claude --model sonnet".
claude = "claude"

# Где искать папки проектов для 🆕 Новая (первая — куда создаётся 📁 новая папка).
project_roots = ["~/projects", "~/worktrees"]

# Голос по умолчанию: irina, dmitri, denis, ruslan (Piper) или xenia, baya, kseniya, aidar, eugene (Silero).
voice = "irina"

# Модель распознавания голосовых: tiny, base, small, medium (точнее — медленнее).
whisper_model = "small"

# Модели в ⚡ Команды → 🧠 Модель.
models = ["opus", "sonnet", "haiku"]

# sudo, которое можно выполнить кнопкой ▶️ (регулярные выражения после «sudo »).
# Работает, только если вы сами настроили sudo без пароля для этих команд. [] — sudo только вручную.
sudo_allow = ['apt(-get)?\s+(install|update|upgrade)\b', 'systemctl\s+(restart|reload|start|stop|status|enable|disable|daemon-reload)\b']

# Команды, которые относятся к другой машине — придут без кнопки ▶️, только для копирования.
foreign = ['\bssh\s+prod\b']

# Номер задачи трекера: такое сообщение откроет сессию по задаче.
task_pattern = '[A-Z]{2,10}-\d+'
task_prompt = "Возьми задачу {task} из трекера: прочитай описание и комментарии, составь план и приступай."

# Свои кнопки в ⚡ Команды: ["подпись", "текст"]. Текст с «/» — слэш-команда, иначе — сообщение Claude.
commands = [
  ["🧪 Тесты", "Запусти тесты проекта и кратко доложи результат."],
  ["📝 Коммит", "Покажи diff и предложи сообщение коммита."],
]

# Утренняя сводка «ждёт владельца»: PR старше 2 дней или с красным CI, окна с вопросом Claude, «Ждут «да»» из
# HANDOFF.md штабов. Время — ЧЧ:ММ по часам сервера ("" — выключить); пусто — бот молчит. /digest — сводка сейчас.
digest_at = "09:00"
# Чьи репозитории смотреть на GitHub (нужен вход в gh: gh auth login). Пусто — сводка без PR.
digest_github = ""

# Страна сервера (две буквы, ISO 3166-1): по ней пульт решает, каким поставщикам моделей можно слать запросы.
# Запасной поставщик (см. «Интеграции» → «Модели» → «Запасные») не из списка поддерживаемых стран не выбирается.
# Пусто — разрешено всё, что явно не запрещено (Россия запрещена для всех).
region = "NL"
