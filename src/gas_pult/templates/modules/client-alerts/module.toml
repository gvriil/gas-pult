# Модуль «Оповещения клиентов» — формат файла: docs/MODULES.md
id = "client-alerts"
version = "1.0"
title = "Оповещения клиентов"
industry = "Общие"
sections = ["comms"]
about = "Напоминания и рассылки по шаблонам: агент готовит пачку, человек одобряет кнопкой. Без одобрения — ни одного письма."
description = """
Шаблоны напоминаний (запись, оплата, продление) и рассылок — в templates/, клиенты — в data/clients.csv.
Агент отбирает получателей по согласию, заполняет шаблоны и показывает пачку: «Отправить пачку из N?» — «Да» / «Нет».
Отправляет только после «Да» и только ту пачку, которую показал. Пока канал отправки (почта, Telegram) не подключён —
только черновики в outbox/. Пачка — не больше {{batch_max}} сообщений, тихие часы — с {{quiet_from}} до {{quiet_to}}.
"""
start = """Прочитай CLAUDE.md, шаблоны в templates/ и data/clients.csv (пример выдуманный). Коротко скажи, какие \
напоминания можно отправить сегодня по примеру, и подготовь пробную пачку черновиками в outbox/ — без отправки."""
uses = ["reminders"]

[settings]
batch_max = 50
quiet_from = "21:00"
quiet_to = "09:00"
clients = "data/clients.csv"

[[integrations]]
id = "gmail"
why = "Канал отправки писем. Без него — только черновики в outbox/, отправляете сами."
optional = true

[[integrations]]
id = "telegram-sender"
title = "Telegram-бот для рассылок"
why = "Канал отправки в Telegram — отдельный бот компании (MCP-сервер). Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер вашего бота рассылок."
optional = true

[[data_sources]]
title = "Клиенты и согласия: data/clients.csv"
kind = "client_export"
about = "выгрузка из CRM или учётной системы клиента"

[[schedule]]
at = "10:00"
days = [1, 2, 3, 4, 5]
title = "Пачка напоминаний на сегодня"
prompt = """Подготовь пачку напоминаний на сегодня (навык alert-batch): черновики в outbox/, затем вопрос \
«Отправить пачку из N?» с вариантами «Да» и «Нет». Без «Да» ничего не отправляй."""

[[decisions]]
question = "Отправить пачку из N? (шаблон, число получателей, первые три имени)"
options = ["Да", "Нет"]
when = "каждый раз перед отправкой; «Нет» — пачка остаётся черновиком"
