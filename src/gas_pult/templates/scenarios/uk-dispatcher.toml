[[moments]]
at = "14:00"
module = "uk-requests"
text = """ПРОСРОЧЕНО: обращение № 402 (дом «{{point}}», уборка подъезда), срок был вчера.

Что делаем?"""
[[moments.buttons]]
label = "Ответить сегодня"
