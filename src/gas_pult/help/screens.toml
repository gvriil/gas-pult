chips = ["why"]

[[screen.faq]]
id = "why"
q = "Зачем принимать условия?"
a = "Модели предоставляют поставщики по своим условиям. Пульт — инструмент: без согласия с условиями он ничего, кроме них, не показывает. Дата согласия хранится на сервере."
actions = ["go:settings.country"]

[[screen]]
id = "country"
where = "panel"
title = "Ваша страна"
roles = ["owner", "member", "viewer"]
purpose = "Выбор страны, из которой вы работаете: модели доступны по спискам стран их поставщиков."
steps = ["Нажмите свою страну или введите код из двух букв.", "Подтвердите номер в боте — «Поделиться номером» (храним только код страны и хеш номера)."]
