# Роль «Диспетчер УК» — формат: docs/SCENARIOS.md. УК, дома и люди выдуманы.
title = "Диспетчер УК"
short = "Смена в аварийной службе: таймер 30 минут по каждой аварии, сроки обращений, черновики ответов."
industries = ["Управляющие компании — «УК-старт»"]
offer = ["uk"]
modules = ["uk-requests", "uk-emergency"]
who = """Вы на смене принимаете звонки и заявки: протечки, лифты, отключения. По правилам на локализацию аварии — 30 \
минут, сообщить жителю срок — тоже 30 минут. Когда звонков много, отметки в журнале ставятся задним числом, а \
нарушение видно только при проверке."""
without = """Таймер аварии — в голове диспетчера, а голова одна на десяток звонков. Отметку о локализации ставят \
«потом», жителю срок не сообщают. Вид обращения и срок ответа определяют на глаз, и просрочку обнаруживают, когда \
житель пишет жалобу в жилинспекцию."""
needs = [
    "Журнал аварийных заявок — выгрузка или общая таблица, куда диспетчер ставит отметки",
    "Реестр обращений жителей и список домов — выгрузка (CSV, XLSX)",
    "Telegram диспетчера смены — сигналы приходят ему, а не только директору",
]
first_step = """Ведите журнал аварийных заявок в общей таблице неделю — агент начнёт проверять его каждые 10 минут и \
предупреждать за 10 минут до нарушения."""

[demo]
business = "УК «Пример»"
point = "Примерная, 3"

[[moments]]
at = "08:30"
module = "uk-requests"
text = """Обращение жителя (демо) · {{business}}
Дом «{{point}}», кв. 12: протечка с потолка в ванной. Вид — аварийное; срок по правилам — сегодня."""
[[moments.buttons]]
label = "Передать аварийной службе"
result = "В рабочем режиме агент отправил бы заявку в аварийную службу УК и записал время. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Позвонить жителю"
result = "Агент поставил бы задачу диспетчеру с номером обращения и сроком."

[[moments]]
at = "08:52"
module = "uk-emergency"
text = """АВАРИЯ: заявка № 1187 (дом «{{point}}», ГВС) — 20 мин без отметки о локализации. До нарушения норматива — 10 минут.

Что сделать?"""
[[moments.buttons]]
