# Модуль «Входящие ЭДО» — формат файла: docs/MODULES.md
id = "acc-edo"
version = "1.0"
title = "Входящие ЭДО: реестр и сверка"
industry = "Бухгалтеры и юристы на аутсорсе"
sections = ["docs", "search"]
about = "Входящие из Диадока (Контур), СБИС и других операторов — в реестр, сверка с первичкой и файл для 1С; подписывает КЭП только человек."
description = """
Для бухгалтерской фирмы на аутсорсе: входящие документы клиентов из операторов ЭДО (Контур.Диадок, СБИС и другие) —
выгрузкой файлами из кабинета оператора в папку inbox/ или, если подключено, через API оператора только на
чтение. Агент разбирает, что положили (УПД, счёт-фактура, акт, накладная, корректировочный УПД), ведёт реестр
входящих в registry/, сверяет каждый документ с первичкой модуля «Сбор первички» ({{primary}}) и готовит файл
для загрузки в 1С — бухгалтер подтверждает кнопкой. Расхождения — отдельным вопросом. Подписать квалифицированной
электронной подписью (КЭП), отказать в подписи, отправить — только человек в кабинете оператора: агент не
подписывает и не отправляет ничего, а спрашивает решение «Да / Нет» по конкретному документу. Документ ждёт
решения дольше {{remind_after}} рабочих дней — напоминание бухгалтеру. Для клиентов в РФ — российская модель
(GigaChat или YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md и data/clients.csv (пример выдуманный). Разбери пример выгрузки data/edo-example/ \
навыком edo-intake так, как если бы его положили в inbox/, сверь с первичкой навыком edo-match (если рядом нет папки acc-primary — с data/primary-example/) и покажи, что попадёт в \
реестр, — в 1С ничего не загружай, ничего не подписывай и не отправляй."""
uses = ["documents"]

[settings]
clients = "data/clients.csv"
primary = "../acc-primary/registry"
primary_example = "data/primary-example"
remind_after = 3

[[integrations]]
id = "diadoc"
title = "Контур.Диадок: входящие, только чтение"
why = "Забирать список и файлы входящих документов без ручной выгрузки. Без него — выгрузка файлами в inbox/."
how = "API Диадока (developer.kontur.ru) через MCP-сервер фирмы только с методами чтения: список входящих и скачивание файлов. Методов подписания и отправки в сервере нет; пользователь — с правами на просмотр. Панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "sbis"
title = "СБИС: входящие, только чтение"
why = "То же для клиентов на СБИС. Без него — выгрузка из кабинета СБИС файлами в inbox/."
how = "API СБИС через MCP-сервер фирмы только с методами чтения: список входящих и скачивание файлов. Методов подписания и отправки в сервере нет; пользователь — с правами на просмотр. Панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "edo-other"
title = "Другой оператор ЭДО: входящие, только чтение"
why = "Если клиент получает документы через другого оператора. Без него — выгрузка файлами в inbox/."
how = "API оператора через MCP-сервер фирмы только с методами чтения; подписания и отправки в сервере нет. Панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "onec"
title = "1С клиента: справочники (OData, только чтение)"
why = "Сверить контрагентов и номенклатуру со справочниками 1С. Загрузка документов — файлом, бухгалтером."
how = "Публикация стандартного интерфейса OData базы 1С (its.1c.ru) с пользователем только на чтение справочников."
optional = true

[[data_sources]]
title = "Входящие ЭДО: выгрузка файлами из кабинета оператора в inbox/"
kind = "client_export"
about = "XML формата ФНС (УПД, счёт-фактура, акт) и PDF-образы; выгружает бухгалтер или клиент"

[[data_sources]]
title = "API операторов ЭДО (Диадок, СБИС, Контур)"
kind = "official_api"
about = "только методы чтения, ключ — клиента или фирмы с правами на просмотр"

[[data_sources]]
title = "Первичка из модуля «Сбор первички»: реестр acc-primary"
kind = "client_export"
about = "файлы соседней папки ../acc-primary/registry/ или выгрузка в data/primary-example/"

[[data_sources]]
title = "Клиенты фирмы и их ящики ЭДО: data/clients.csv"
kind = "client_export"
about = "из учётной системы бухгалтерской фирмы"

[[schedule]]
at = "09:30"
days = [1, 2, 3, 4, 5]
title = "Разобрать входящие ЭДО"
prompt = """Разбери новые файлы в inbox/ (навык edo-intake) и, если подключён API оператора, новые входящие — только \
чтением. Сверь с первичкой (навык edo-match), затем «Внести N входящих в реестр и файл для 1С?». Расхождения — \
отдельным вопросом. Ничего не подписывай и не отправляй, в 1С ничего не загружай."""

[[schedule]]
at = "15:00"
days = [1, 2, 3, 4, 5]
title = "Что ждёт подписи человека"
prompt = """По registry/ найди входящие, которые ждут решения о подписи дольше {{remind_after}} рабочих дней, и \
спроси по каждому «Подписываете КЭП в кабинете оператора?». Если таких нет — ответь одной строкой «подписи никто \
не ждёт»."""

[[decisions]]
question = "Внести N входящих ЭДО в реестр и файл для 1С? (по клиентам, сумма, расхождений K)"
options = ["Все", "По одному", "Нет"]
when = "после разбора inbox/ и сверки с первичкой"

[[decisions]]
question = "Расхождение с первичкой: <вид № от, контрагент> — что делаем?"
options = ["Принять как в ЭДО", "Черновик запроса исправления", "Отложить"]
when = "сумма, НДС, номер или дата не совпадают, документа нет в первичке или он дублируется"

[[decisions]]
question = "Подписание КЭП — только вы, в кабинете оператора: <вид № от, контрагент, сумма> — подписываете?"
options = ["Да", "Нет"]
when = "по каждому входящему, которое требует подписи; агент сам не подписывает и не отправляет"
