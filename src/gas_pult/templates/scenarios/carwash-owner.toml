# Роль «Владелец сети автомоек» — формат и как добавить роль: docs/SCENARIOS.md. Компания и люди выдуманы.
title = "Владелец сети автомоек"
short = "Несколько моек в городе: цифры по филиалам утром, возврат клиентов, отзывы и сезон шин."
industries = ["Автомойки и шиномонтаж (сеть)"]
offer = ["carwash"]
modules = ["carwash-morning", "carwash-tire-season", "carwash-return", "carwash-reviews"]
who = """У вас сеть моек в городе — {{points}} шт. Утром не видно, как сработал каждый филиал: управляющие присылают цифры \
к обеду, каждый в своём формате. Клиенты моются два-три раза и пропадают, а отзывы на картах висят без ответа по \
неделе."""
without = """Цифры по филиалам сводите вечером из сообщений управляющих — отклонение видно на день позже. «Ждём вас \
снова» администратор пишет, когда есть минутка, то есть почти никогда. Ответы на отзывы — раз в неделю, пачкой; \
запись на сезон шин — по звонкам, и в пиковые выходные часть клиентов уезжает к соседям."""
needs = [
    "Выгрузка смен и кассы по филиалам (CSV или XLSX из CRM, кассы или 1С) — раз в день, автоматически или вручную",
    "Клиенты, визиты и согласия на рассылку — выгрузка или официальный API системы записи (если есть)",
    "Отзывы: Google — доступ к Business Profile API; Яндекс Карты и 2ГИС — выгрузка, ответ публикует человек",
    "Канал для сообщений клиентам (бот сети, SMS-шлюз или почта) — подключаете вы, отправка только после «Да»",
]
first_step = """Пришлите выгрузку смен за прошлый месяц по всем филиалам — через неделю утренние цифры будут \
приходить в 8:00. Возврат клиентов, отзывы и сезон шин подключаем по одному."""

[demo]
business = "Сеть автомоек «Пример»"
point = "Центр"

[[moments]]
at = "08:00"
module = "carwash-morning"
text = """Утренние цифры сети (демо) · {{business}}
Вчера: выручка 182 400 ₽ при плане 196 000 ₽ (−7 %), загрузка постов 68 %, средний чек {{avg_check}} ₽, допродажи 11 %.
Главное отклонение: «{{point}}» — −18 % к плану, загрузка 49 % (вечерняя смена).

Что делаем?"""
[[moments.buttons]]
label = "Разобрать главное отклонение"
result = "Агент прислал бы разбор по «{{point}}»: какие часы и посты простаивали, сравнение с прошлой неделей и 2–3 варианта — например, акция на вечер будней. Без внешних действий."
[[moments.buttons]]
label = "Подробно по филиалу"
result = "Агент показал бы таблицу по каждому филиалу: выручка, загрузка, чек, доля допродаж против плана."
[[moments.buttons]]
label = "Всё в порядке"
result = "Агент запишет, что отклонение принято, и не будет поднимать его до завтрашней сводки."
[[moments.buttons]]
label = "Позже"
result = "Агент напомнит после обеда — с теми же цифрами."

[[moments]]
at = "10:00"
module = "carwash-tire-season"
text = """Сезон шин: до старта переобувки 3 недели. Пачка 1 — клиенты с хранением шин: 120 человек, слоты поровну по филиалам, пик «{{point}}» — 82 %.
Пример: «Анна, добрый день! Ваши шины хранятся у нас. Записаться на переобувку можно на 21–23 ноября — выберите время по ссылке».

Отправить пачку из 120?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме сообщения ушли бы 120 клиентам с хранением шин — сервисные, по договору хранения, через канал сети. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Нет"
result = "Пачка останется черновиком; агент спросит снова завтра в 10:00."

[[moments]]
at = "11:00"
module = "carwash-return"
text = """Не были 30–45 дней и дали согласие на рассылку: 46 клиентов.
Пример: «Олег, добрый день! Давно не видели вас в «{{point}}». Будем рады снова помыть машину — ответьте, когда удобно. Не хотите таких сообщений — ответьте «стоп»».

Отправить пачку из 46?"""
[[moments.buttons]]
label = "Отправить"
result = "В рабочем режиме сообщения ушли бы 46 клиентам — только с согласием на рассылку, одному клиенту не чаще раза в 14 дней. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Показать первых трёх"
result = "Агент показал бы: Олег (демо) — 38 дней, Анна (демо) — 41 день, Павел (демо) — 44 дня; и спросил бы снова."
[[moments.buttons]]
label = "Не сейчас"
result = "Агент ничего не отправит и спросит завтра."

[[moments]]
at = "17:00"
module = "carwash-reviews"
text = """Готовы ответы на 12 отзывов по всем филиалам: Google — 7, Яндекс Карты — 4, 2ГИС — 1.
Первый: «Спасибо, Ирина! Рады, что химчистка салона понравилась — ждём вас снова в «{{point}}»».
Негатив по «Север» уже ушёл управляющему филиала.

Опубликовать 12 ответов?"""
[[moments.buttons]]
label = "Опубликовать все"
result = "В рабочем режиме ответы в Google опубликовались бы через официальный API; для Яндекс Карт и 2ГИС агент дал бы готовые тексты — их вставляет человек."
[[moments.buttons]]
label = "По одному"
result = "Агент прислал бы ответы по одному — каждый на «Да» или правку."
[[moments.buttons]]
label = "Нет"
result = "Ответы останутся черновиками; агент спросит вечером снова."

[[inputs]]
id = "points"
title = "Филиалов"
unit = "шт."
default = 3
min = 1
max = 50
offer = "points"
about = "Сколько моек в сети."

[[inputs]]
id = "clients"
title = "Клиентов в месяц по сети"
unit = "чел."
default = 1500
min = 50
max = 100000
step = 50
offer = "clients"
about = "Разных клиентов за месяц по всем филиалам (из кассы или CRM)."

[[inputs]]
id = "avg_check"
title = "Средний чек"
unit = "₽"
default = 1400
min = 100
max = 50000
step = 50
offer = "avg_check"
about = "Средний чек мойки по сети."

[[benefit]]
title = "Время на утренние цифры"
unit = "ч в неделю"
of = ["points"]
low = 1.5
high = 3
round = 0.5
about = "Допущение: сбор и сверка цифр — 15–30 минут в день на филиал у управляющего и у вас, 6 дней в неделю; агент собирает сам, вы читаете сводку за минуту."

[[benefit]]
title = "Вернувшиеся клиенты"
unit = "чел. в месяц"
of = ["clients"]
low = 0.01
high = 0.03
round = 1
about = "Допущение: напоминание «ждём вас» возвращает 1–3 % месячного числа клиентов — общая рыночная оценка для услуг с регулярными визитами; проверим на пилоте."

[[benefit]]
title = "Выручка от вернувшихся"
unit = "₽ в месяц"
of = ["clients", "avg_check"]
low = 0.01
high = 0.03
round = 1000
about = "Вернувшиеся клиенты × средний чек, по одному визиту; повторные визиты и допродажа детейлинга не учтены."

[[benefit]]
title = "Время на ответы на отзывы"
unit = "ч в неделю"
of = ["points"]
low = 0.5
high = 1
round = 0.5
about = "Допущение: 10–20 отзывов в неделю на филиал по 3 минуты на ответ; агент готовит черновик, человек нажимает «Опубликовать»."
