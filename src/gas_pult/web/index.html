<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>gas-pult · пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  /* Палитра в духе Anthropic: тёплая бумага, терракотовый акцент; тёмная — в тон. */
  :root, :root[data-theme="light"] {
    --bg: #f5f4ee; --surface: #ffffff; --surface2: #faf9f5; --code: #f0eee6;
    --text: #141413; --muted: #6b6a64; --line: #e6e4da;
    --accent: #d97757; --accent-strong: #c15f3c; --on-accent: #ffffff;
    --ok: #5a8f5c; --warn: #c98a2b; --danger: #b8463a;
    --shadow: 0 1px 2px rgba(20,20,19,.06), 0 1px 1px rgba(20,20,19,.04);
  }
  :root[data-theme="dark"] {
    --bg: #1f1e1d; --surface: #2a2927; --surface2: #30302e; --code: #262624;
    --text: #f5f4ee; --muted: #a3a199; --line: #3b3a36;
    --accent: #d97757; --accent-strong: #e08b6e; --on-accent: #ffffff;
    --ok: #7fb07f; --warn: #e0a84a; --danger: #e07a6e;
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: none;
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .55; cursor: default; }
  .serif { font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif; }

  /* верхняя панель — прячется при прокрутке вниз */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px 8px;
         display: flex; align-items: center; gap: 8px; transition: transform .2s ease; border-bottom: 1px solid transparent; }
  .top.hide { transform: translateY(-110%); }
  .top.edge { border-bottom-color: var(--line); }
  .top .titles { flex: 1; min-width: 0; }
  .top h1 { margin: 0; font-size: 21px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 18px; flex: none; }
  .icon:active { background: var(--line); }

  main { padding: 4px 12px 24px; }
  .seg { display: flex; gap: 2px; padding: 3px; background: var(--line); border-radius: 10px; margin: 0 0 10px; }
  .seg button { flex: 1; border: 0; padding: 7px 4px; border-radius: 8px; background: transparent; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

  .card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); margin: 0 0 8px; padding: 12px 14px;
          background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
  .card.active { border-color: var(--accent); }
  .card.cta { text-align: center; color: var(--accent-strong); font-weight: 600; border-style: dashed; background: transparent; box-shadow: none; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ok); }
  .busy .dot { background: var(--accent); animation: pulse 1.2s infinite; } .dialog .dot { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .3; } }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent-strong); white-space: nowrap; }
  .pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .pill.bad { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx { height: 3px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .ctx i { display: block; height: 100%; background: var(--accent); }
  .section { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 16px 4px 8px; }
  .note { color: var(--muted); font-size: 13px; margin: 4px 4px 12px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
  .md { font-size: 15px; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3 { font-family: ui-serif, "Iowan Old Style", Georgia, serif; font-weight: 600; margin: 14px 0 6px; line-height: 1.25; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md p { margin: 6px 0; } .md ul, .md ol { padding-left: 20px; margin: 6px 0; }
  .md .tbl { overflow-x: auto; margin: 8px 0; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
  .md th { background: var(--code); }
  .md pre { background: var(--code); border-radius: 8px; padding: 8px; overflow-x: auto; font-size: 12.5px; }
  .md code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--code); padding: 0 3px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }
  .md a { color: var(--accent-strong); }
  .md blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .screen { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--text); }
  .empty { color: var(--muted); text-align: center; padding: 28px 12px; }

  /* диалог Claude — крупные кнопки вариантов */
  .ask { background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line));
         border-radius: 12px; padding: 12px; margin: 0 0 10px; }
  .ask .q { font-weight: 600; margin: 0 0 8px; }
  .ask button.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
                    border-radius: 10px; padding: 10px 12px; margin: 0 0 6px; }
  .ask button.opt.sel { border-color: var(--accent); }
  .ask button.opt b { color: var(--accent-strong); margin-right: 6px; }
  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 0 0 10px; }
  .keys button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 0; font-weight: 600; }

  /* нижняя часть сессии: действия + поле ввода */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
          padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--line); padding: 6px 11px; border-radius: 16px; background: var(--surface); font-size: 13.5px; }
  .compose { display: flex; gap: 8px; align-items: flex-end; }
  textarea, input { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  .compose textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px;
                      background: var(--surface); max-height: 140px; outline: none; }
  .compose textarea:focus, .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .round { width: 42px; height: 42px; border: 0; border-radius: 50%; flex: none; font-size: 18px; background: var(--surface); border: 1px solid var(--line); }
  .round.send { background: var(--accent); color: var(--on-accent); border: 0; }
  .round.rec { background: var(--danger); color: #fff; border: 0; animation: pulse 1s infinite; }
  #session { padding-bottom: 110px; }
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 2px 0 8px; }
  .menu button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px; font-size: 13px; }
  .menu button span { display: block; font-size: 20px; margin-bottom: 2px; }
  .menu button.danger { color: var(--danger); }
  .attach { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 6px; scrollbar-width: none; }
  .attach span { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 70vw; border: 1px solid var(--line);
                 background: var(--surface); border-radius: 14px; padding: 4px 4px 4px 10px; font-size: 13px; }
  .attach span em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach span button { border: 0; background: none; color: var(--muted); padding: 0 6px; }
  .playerbox { display: flex; align-items: center; gap: 6px; padding: 0 0 6px; }
  .playerbox audio { flex: 1; min-width: 0; margin: 0; height: 36px; }
  .chat .msg { margin: 0 0 12px; }
  .chat .bubble { border-radius: 14px; padding: 10px 12px; overflow-wrap: anywhere; }
  .chat .me { display: flex; flex-direction: column; align-items: flex-end; }
  .chat .me .bubble { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); max-width: 88%; white-space: pre-wrap; }
  .chat .ai .bubble { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .chat .when { color: var(--muted); font-size: 12px; margin: 3px 4px 0; }
  .chat .acts { display: flex; gap: 6px; align-items: center; margin: 5px 2px 0; flex-wrap: wrap; }
  .chat .acts button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 4px 10px; font-size: 13px; }
  .card { cursor: pointer; }
  .card .end { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 3px 9px; font-size: 13px; color: var(--danger); flex: none; }

  /* формы */
  .field { margin: 0 0 14px; }
  .field label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 4px; }
  .field .opt { color: var(--muted); font-weight: 400; }
  .field .inp { display: flex; gap: 6px; }
  .field input, .field textarea { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
                                  background: var(--surface); outline: none; }
  .field .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 12px; font-weight: 600; background: var(--accent); color: var(--on-accent); margin: 8px 0; }
  .btn.ghost { background: transparent; color: var(--accent-strong); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .result { border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .result.ok { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
  .result.bad { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
  .cmd { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 8px 0; background: var(--surface); }
  .cmd pre { margin: 0 0 6px; background: var(--code); border-radius: 8px; padding: 8px; font: 12.5px/1.4 ui-monospace, Menlo, monospace;
             white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmd .btn { margin: 0; padding: 9px; }
  .cmd .out { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, Menlo, monospace; max-height: 260px; overflow-y: auto; }
  select { width: 100%; font: 16px/1.3 -apple-system, system-ui, sans-serif; color: var(--text); background: var(--surface);
           border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }
  .steps { counter-reset: st; margin: 6px 0 0; padding: 0; list-style: none; }
  .steps li { position: relative; padding: 0 0 12px 34px; }
  .steps li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%;
                      background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .update { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 25; }
  .code-input { letter-spacing: .4em; text-align: center; font-size: 24px !important; }

  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(20,20,19,.4); display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 78vh; overflow-y: auto; background: var(--surface); border-radius: 16px 16px 0 0;
           padding: 6px 0 calc(12px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 10px 16px 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sheet button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 16px; font-size: 16px; }
  .sheet button small { display: block; color: var(--muted); font-size: 13px; }
  .sheet button.on { color: var(--accent-strong); font-weight: 600; }
  .sheet button.danger { color: var(--danger); }
  .toast { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30;
           background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; max-width: 92vw; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .demo { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--accent-strong); font-size: 12px; text-align: center; padding: 4px; }
  audio { width: 100%; margin: 0 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<button class="btn update" id="updateBar" hidden>Панель обновилась — нажмите, чтобы загрузить новую версию</button>
<div class="demo" id="demoBar" hidden>Демо-данные — так панель выглядит; ваши сессии не затронуты</div>
<div class="top" id="top">
  <button class="icon" id="backBtn" hidden aria-label="Назад">‹</button>
  <div class="titles"><h1 class="serif" id="title">Пульт</h1><div class="sub" id="subtitle">загружаю…</div></div>
  <button class="icon" id="switchBtn" hidden aria-label="Другая сессия">⇅</button>
  <button class="icon" id="settingsBtn" aria-label="Настройки">⚙︎</button>
</div>

<main>
  <!-- вход из браузера -->
  <section id="login" hidden>
    <div class="panel">
      <h2 class="serif" style="margin:4px 0 6px;font-size:20px">Вход в пульт</h2>
      <p class="note" style="margin:0 0 12px">Пароль не нужен: мы пришлём одноразовый код в Telegram владельцу бота. Код действует 5 минут.</p>
      <div id="loginStep1">
        <button class="btn" id="getCode">Получить код в Telegram</button>
      </div>
      <div id="loginStep2" hidden>
        <div class="field">
          <label for="code">Код из Telegram</label>
          <input id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
          <div class="hint">Откройте чат с ботом — там сообщение «🔐 Вход в панель» с 6 цифрами.</div>
        </div>
        <button class="btn" id="enter">Войти</button>
        <button class="btn ghost" id="resend">Прислать новый код</button>
      </div>
      <div id="loginResult"></div>
    </div>
  </section>

  <!-- главная: сессии и интеграции -->
  <section id="home" hidden>
    <div class="seg" id="homeSeg"><button data-v="sessions" class="on">Сессии</button><button data-v="integrations">Интеграции</button></div>
    <div id="sessionsView"></div>
    <div id="integrationsView" hidden></div>
  </section>

  <!-- одна сессия -->
  <section id="session" hidden>
    <div class="seg" id="tabs"><button data-tab="chat" class="on">Переписка</button><button data-tab="screen">Экран</button></div>
    <div id="ask"></div>
    <div class="keys" id="keys" hidden></div>
    <div id="content"></div>
  </section>

  <!-- форма добавления MCP -->
  <section id="mcpForm" hidden></section>
</main>

<div class="dock" id="dock" hidden>
  <div class="playerbox" id="playerBox" hidden><audio id="player" controls></audio><button class="icon" id="playerClose" aria-label="Закрыть плеер">✕</button></div>
  <div class="menu" id="menu" hidden>
    <button data-act="say"><span>🔊</span>Последний кратко</button><button data-act="sayfull"><span>📢</span>Последний целиком</button>
    <button data-act="commands"><span>⚡</span>Команды</button><button data-act="models"><span>🧠</span>Модель</button>
    <button data-act="switch"><span>⇅</span>Другая сессия</button><button data-act="active"><span>✅</span>Сделать активной</button>
    <button data-act="refresh"><span>↻</span>Обновить</button><button data-act="top"><span>⤒</span>В начало</button>
    <button data-act="close" class="danger"><span>⏻</span>Завершить</button>
  </div>
  <div class="attach" id="attach" hidden></div>
  <div class="compose">
    <button class="round" id="menuBtn" aria-label="Меню действий">☰</button>
    <button class="round" id="plus" aria-label="Прикрепить фото или файл">＋</button>
    <textarea id="input" rows="1" placeholder="Сообщение для Claude…"></textarea>
    <button class="round" id="mic" aria-label="Голосовое">🎙</button>
    <button class="round send" id="send" aria-label="Отправить" hidden>➤</button>
  </div>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fPhoto" accept="image/*,video/*" multiple hidden>
  <input type="file" id="fFile" multiple hidden>
</div>

<script>
const tg = window.Telegram?.WebApp;
const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
const STATUS = { idle: "свободна", busy: "работает", dialog: "ждёт вашего выбора" };
let BUILD = null, sessions = [], meta = null, current = null, tab = "chat", files = [], hist = [], histMore = false, lastStatus = null, rec = null, view = "home", homeView = "sessions", loginId = null, mcpData = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const folder = (p) => p.split("/").filter(Boolean).pop() || "~";
const cur = () => sessions.find((x) => x.id === current);
const haptic = (kind, v) => { try { tg?.HapticFeedback?.[kind]?.(v); } catch (e) {} };

// ---------- тема ----------
function applyTheme() {
  let mode = params.get("theme") || store("theme") || "auto";
  const dark = mode === "dark" || (mode === "auto" && (tg?.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try { tg?.setHeaderColor?.(bg); tg?.setBackgroundColor?.(bg); tg?.setBottomBarColor?.(bg); } catch (e) {}
}
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function toast(text, ms = 2600) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  document.body.append(t); setTimeout(() => t.remove(), ms);
}

// ---------- сеть ----------
async function api(path, body, raw, extra) {
  if (DEMO) return demoApi(path, body);
  const headers = { "X-Telegram-Init-Data": tg?.initData || "", ...(extra || {}) };
  if (body && !raw) headers["Content-Type"] = "application/json";
  if (raw) headers["Content-Type"] = raw;
  const r = await fetch(path, { method: body ? "POST" : "GET", headers, credentials: "same-origin",
                                body: body ? (raw ? body : JSON.stringify(body)) : undefined });
  if (r.status === 403 && !path.startsWith("/api/login")) { showLogin(); throw new Error("нужен вход"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "ошибка " + r.status);
  return (r.headers.get("Content-Type") || "").startsWith("application/json") ? r.json() : r.blob();
}

async function busy(btn, text, fn) {      // кнопка показывает, что работает, и не нажимается дважды
  const old = btn.textContent; btn.disabled = true; btn.textContent = text;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}

function sheet(title, items) {             // [{label, sub, run, danger, on}]
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3>${items.map((it, i) =>
    `<button data-i="${i}" class="${it.danger ? "danger" : ""} ${it.on ? "on" : ""}">${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</button>`).join("")}
    <button data-close style="text-align:center;color:var(--muted)">Отмена</button></div>`;
  bg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (e.target === bg || b) bg.remove();
    if (b && b.dataset.i) items[+b.dataset.i].run();
  });
  document.body.append(bg);
}

// ---------- навигация ----------
function show(v) {
  view = v;
  for (const id of ["login", "home", "session", "mcpForm"]) $(id).hidden = id !== v;
  $("dock").hidden = v !== "session";
  $("backBtn").hidden = !(v === "session" || v === "mcpForm");
  $("switchBtn").hidden = v !== "session";
  $("settingsBtn").hidden = v === "login";
  if (tg) (v === "session" || v === "mcpForm") ? tg.BackButton.show() : tg.BackButton.hide();
  $("top").classList.remove("hide"); window.scrollTo(0, 0);
}
function back() {
  if (view === "mcpForm") { show("home"); return setHome("integrations"); }
  current = null; stopPlayer(); closeMenu(); files = []; renderFiles(); show("home"); setHome("sessions");
}

let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY;
  $("top").classList.toggle("edge", y > 4);
  if (y > lastY + 6 && y > 70) $("top").classList.add("hide");
  else if (y < lastY - 6 || y < 30) $("top").classList.remove("hide");
  lastY = y;
}, { passive: true });

// ---------- вход ----------
function showLogin() {
  show("login"); $("title").textContent = "Пульт"; $("subtitle").textContent = "вход по коду из Telegram";
}
$("getCode").onclick = (e) => requestCode(e.target);
$("resend").onclick = (e) => requestCode(e.target);
async function requestCode(btn) {
  await busy(btn, "Отправляю…", async () => {
    try {
      loginId = (await api("/api/login/start", {})).id;
      $("loginStep1").hidden = true; $("loginStep2").hidden = false; $("code").value = ""; $("code").focus();
      $("loginResult").innerHTML = '<div class="result ok">Код отправлен в Telegram.</div>';
    } catch (e) { $("loginResult").innerHTML = `<div class="result bad">${esc(e.message)}</div>`; }
  });
}
$("code").addEventListener("input", () => { $("code").value = $("code").value.replace(/\D/g, "").slice(0, 6); if ($("code").value.length === 6) $("enter").click(); });
$("enter").onclick = (e) => busy(e.target, "Проверяю…", async () => {
  try { await api("/api/login/verify", { id: loginId, code: $("code").value }); $("loginResult").innerHTML = ""; await start(); }
  catch (err) { $("loginResult").innerHTML = `<div class="result bad">${esc(err.message)}</div>`; }
});

// ---------- главная ----------
function setHome(v) {
  homeView = v;
  document.querySelectorAll("#homeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  $("sessionsView").hidden = v !== "sessions"; $("integrationsView").hidden = v !== "integrations";
  $("title").textContent = "Пульт";
  if (v === "integrations") loadMcp(); else refresh();
}
$("homeSeg").onclick = (e) => { const b = e.target.closest("button"); if (b) setHome(b.dataset.v); };

function card(s) {
  return `<div class="card ${s.status}${s.active ? " active" : ""}" data-id="${esc(s.id)}" role="button" tabindex="0">
    <div class="row"><span class="dot"></span><span class="name">${esc(s.name)}</span>${s.active ? '<span class="pill">активная</span>' : ""}
      <button class="end" data-end="${esc(s.id)}" aria-label="Завершить сессию">⏻ Завершить</button></div>
    <div class="meta">${STATUS[s.status]} · ${esc(folder(s.path))}${s.branch ? " · " + esc(s.branch) : ""}</div>
    ${s.context == null ? "" : `<div class="ctx" title="контекст свободен ${s.context}%"><i style="width:${100 - s.context}%"></i></div>`}</div>`;
}

async function refresh() {
  try {
    const d = await api("/api/sessions");
    sessions = d.sessions;
    if (BUILD && d.build && d.build !== BUILD) $("updateBar").hidden = false;
    if (view === "home") {
      $("subtitle").textContent = `${d.host} · сессий: ${sessions.length}`;
      if (homeView === "sessions") $("sessionsView").innerHTML =
        '<button class="card cta" data-new>＋ Новая сессия</button>' +
        (sessions.length ? sessions.map(card).join("") : '<div class="empty">Сессий с Claude пока нет.</div>') +
        '<p class="note">🟢 свободна · 🟠 работает · 🟡 ждёт выбора. Полоска — сколько контекста занято.</p>';
      return;
    }
    if (view !== "session") return;
    const s = cur();
    if (!s) { toast("Сессия закрыта"); return back(); }
    $("title").textContent = s.name;
    $("subtitle").textContent = `${STATUS[s.status]} · ${folder(s.path)}${s.branch ? " · " + s.branch : ""}${s.context == null ? "" : " · контекст " + s.context + "%"}`;
    if (lastStatus === "busy" && s.status !== "busy") { haptic("notificationOccurred", "success"); setTab(s.status === "dialog" ? "screen" : "chat"); }
    else if (tab === "screen" || s.status === "dialog") loadContent();
    lastStatus = s.status;
  } catch (e) { if (view !== "login") $("subtitle").textContent = "нет связи: " + e.message; }
}

$("sessionsView").addEventListener("click", (e) => {
  if (e.target.closest("[data-new]")) {
    return sheet("Новая сессия — в какой папке?", meta.projects.map((label, i) => ({
      label, run: async () => {
        toast("Запускаю Claude…", 3000);
        try { const d = await api("/api/new", { i }); await refresh(); open(d.id); }
        catch (err) { toast("Не вышло: " + err.message, 4500); }
      },
    })));
  }
  const end = e.target.closest("[data-end]");
  if (end) return confirmClose(end.dataset.end);
  const c = e.target.closest(".card[data-id]"); if (c) open(c.dataset.id);
});
function confirmClose(id) {
  const s = sessions.find((x) => x.id === id), t = `Завершить «${s?.name || "сессию"}»? Claude выйдет штатно, переписка сохранится.`;
  tg?.showConfirm ? tg.showConfirm(t, (ok) => ok && closeSession(id)) : confirm(t) && closeSession(id);
}

// ---------- сессия ----------
async function open(id) {
  current = id; show("session");
  if (!cur()) await refresh();
  lastStatus = cur()?.status;
  $("title").textContent = cur()?.name || "Сессия"; $("player").hidden = true;
  $("content").innerHTML = '<div class="empty">загружаю…</div>';
  hist = []; setTab(cur()?.status === "dialog" ? "screen" : "chat"); refresh(); haptic("selectionChanged"); padDock();
}
function setTab(t) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  loadContent();
}
$("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); };

async function loadContent() {
  if (!current) return;
  try {
    const [h, scr] = await Promise.all([
      tab === "chat" ? api("/api/history?w=" + encodeURIComponent(current)) : null,
      api("/api/screen?w=" + encodeURIComponent(current)),
    ]);
    renderAsk(scr.lines, scr.auth);
    $("keys").hidden = tab !== "screen" && cur()?.status !== "dialog";
    if (tab === "chat") {
      const grew = !hist.length || h.items.at(-1)?.i !== hist.at(-1)?.i || h.items.at(-1)?.text.length !== hist.at(-1)?.text.length;
      if (!hist.length || grew) { hist = h.items; histMore = h.more; renderChat(true); }
    } else { $("content").className = "panel"; $("content").innerHTML = `<pre class="screen">${esc(scr.lines.join("\n"))}</pre>`; }
  } catch (e) { $("content").className = "panel"; $("content").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// Переписка: все сообщения сессии; у ответа Claude — озвучка кратко/целиком и копирование.
function renderChat(toBottom) {
  const box = $("content"); box.className = "chat";
  if (!hist.length) { box.innerHTML = '<div class="panel"><div class="empty">Сообщений пока нет — напишите Claude внизу.</div></div>'; return; }
  box.innerHTML = (histMore ? '<button class="btn ghost" id="older">Показать ранее</button>' : "") + hist.map((m) => m.role === "user"
    ? `<div class="msg me"><div class="bubble">${esc(m.text)}</div><div class="when">${esc(m.ts)}</div></div>`
    : `<div class="msg ai"><div class="bubble md">${DOMPurify.sanitize(marked.parse(m.text))}</div>
        <div class="acts"><button data-say="${m.i}">🔊 Кратко</button><button data-sayfull="${m.i}">📢 Целиком</button><button data-copy="${m.i}">⧉ Копировать</button><span class="when">${esc(m.ts)}</span></div></div>`).join("");
  box.querySelectorAll("table").forEach((t) => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.append(t); });
  if (!meta?.voices?.length && !prov?.keys?.elevenlabs) box.querySelectorAll("[data-say],[data-sayfull]").forEach((b) => (b.hidden = true));
  if (hist.at(-1)?.role === "assistant") renderCmds();
  if (toBottom && !params.has("noscroll")) requestAnimationFrame(() => scrollTo(0, document.body.scrollHeight));
}
$("content").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "older") return busy(b, "Загружаю…", async () => {
    const h = await api(`/api/history?w=${encodeURIComponent(current)}&before=${hist[0].i}`);
    const y = document.body.scrollHeight - scrollY; hist = [...h.items, ...hist]; histMore = h.more; renderChat(false);
    scrollTo(0, document.body.scrollHeight - y);
  });
  if (b.dataset.say) return say(false, b, +b.dataset.say);
  if (b.dataset.sayfull) return say(true, b, +b.dataset.sayfull);
  if (b.dataset.copy) {
    const m = hist.find((x) => x.i === +b.dataset.copy);
    try { await navigator.clipboard.writeText(m.text); toast("Скопировано"); } catch (err) { toast("Не удалось скопировать"); }
  }
});

// ▶️ Команды из последнего ответа: сервер берёт их из ответа сам, браузер шлёт только номер и отпечаток.
async function renderCmds() {
  const d = await api("/api/cmds?w=" + encodeURIComponent(current)).catch(() => null);
  if (!d?.cmds?.length || tab !== "chat") return;
  const box = document.createElement("div");
  box.innerHTML = `<div class="section" style="margin-top:14px">Команды из ответа</div>` + d.cmds.map((c) => `<div class="cmd" data-i="${c.i}">
    <pre>${esc(c.cmd)}</pre>${c.kind === "local"
      ? `<button class="btn${c.danger ? " danger" : ""}" data-run="${c.i}" data-sha="${c.sha}">${c.danger ? "⚠️ " : "▶️ "}Выполнить на ${esc(d.host)}</button>`
      : `<div class="note" style="margin:0">${c.kind === "sudo" ? "🔐 sudo вне разрешённого списка — выполните вручную в терминале" : "💻 команда для другой машины — скопируйте и выполните там"}</div>`}
    <div class="out-wrap"></div></div>`).join("");
  $("content").append(box);
}
$("content").addEventListener("click", (e) => {
  const b = e.target.closest("[data-run]"); if (!b) return;
  const cmd = b.closest(".cmd").querySelector("pre").textContent;
  const go = (confirmed) => busy(b, "⏳ Выполняю…", async () => {
    const outBox = b.closest(".cmd").querySelector(".out-wrap");
    try {
      const r = await api("/api/run", { w: current, i: +b.dataset.run, sha: b.dataset.sha, confirmed });
      if (r.confirm) return ask();
      outBox.innerHTML = `<div class="result ${r.code === 0 ? "ok" : "bad"}">${r.code === 0 ? "✅" : "❌"} код ${esc(r.code)} · ${r.seconds} с${r.cut ? " · показан конец вывода" : ""}
        ${r.out ? `<pre class="out">${esc(r.out)}</pre>` : " · вывода нет"}</div>`;
      haptic("notificationOccurred", r.code === 0 ? "success" : "error");
    } catch (err) { outBox.innerHTML = `<div class="result bad">${esc(err.message)}</div>`; }
  });
  const ask = () => { const t = "Команда меняет или удаляет данные:\n\n" + cmd.slice(0, 600) + "\n\nВыполнить?";
    tg?.showConfirm ? tg.showConfirm(t, (ok) => ok && go(true)) : confirm(t) && go(true); };
  b.classList.contains("danger") ? ask() : go(false);
});

// Вход в MCP-сервис (ссылка на экране Claude Code) — карточка из трёх шагов; адрес после входа уходит в сессию.
function authCard(a, name, w) {
  return `<div class="ask"><p class="q">🔑 Вход в ${esc(a.service)}</p><ol class="steps">
    <li><button class="btn" data-openauth="${esc(a.url)}" style="margin:0">Открыть страницу входа ${esc(a.service)}</button></li>
    <li>Войдите как обычно — почтой, через Google или паролем ${esc(a.service)}. Это делается на сайте сервиса, панель пароль не видит.</li>
    <li>После входа откроется страница, которая <b>не загружается</b> (адрес начинается с http://localhost) — так и должно быть.
      Скопируйте адрес этой страницы целиком и вставьте сюда:
      <div class="field" style="margin:8px 0 0"><textarea id="authUrl" rows="3" placeholder="http://localhost:…/callback?code=…"></textarea></div>
      <button class="btn" data-finish="${esc(name || "")}" data-w="${esc(w || current)}">Завершить вход</button><div id="authResult"></div></li></ol></div>`;
}
document.addEventListener("click", async (e) => {
  const o = e.target.closest("[data-openauth]");
  if (o) { tg?.openLink ? tg.openLink(o.dataset.openauth) : window.open(o.dataset.openauth, "_blank"); return; }
  const f = e.target.closest("[data-finish]"); if (!f) return;
  const url = $("authUrl").value.trim();
  if (!url) return toast("Вставьте адрес страницы после входа");
  await busy(f, "Завершаю вход…", async () => {
    try {
      const d = await api("/api/mcp/finish", { w: f.dataset.w, url, name: f.dataset.finish || guessName() });
      $("authResult").innerHTML = `<div class="result ${d.result.startsWith("✔") ? "ok" : "bad"}">${esc(d.result)}</div>`;
      haptic("notificationOccurred", d.result.startsWith("✔") ? "success" : "error");
    } catch (err) { $("authResult").innerHTML = `<div class="result bad">${esc(err.message)}</div>`; }
  });
});
const guessName = () => (document.querySelector(".ask .q")?.textContent || "").replace("🔑 Вход в ", "").trim();

// Диалог Claude на экране → вопрос и варианты кнопками: с номером — цифрой, без номера — сервер дойдёт стрелками.
function renderAsk(lines, auth) {
  if (auth?.paste) { if (!$("authUrl")) $("ask").innerHTML = authCard(auth); return; }
  const opts = [], re = /^\s*(❯)?\s*(\d+)\.\s+(.+?)\s*$/;
  let end = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    const m = lines[i].match(re);
    if (m) { opts.unshift({ n: m[2], text: m[3], sel: !!m[1] }); end = end < 0 ? i : end; }
    else if (opts.length) break;
  }
  const asking = cur()?.status === "dialog" || lines.slice(Math.max(0, end - 12), end + 1).some((l) => /\?\s*$/.test(l));
  if (!asking || opts.length < 2) { $("ask").innerHTML = plainOptions(lines); return; }
  const qi = lines.findLastIndex((l, i) => i < end - opts.length + 1 && /\?\s*$/.test(l));
  const q = qi >= 0 ? lines[qi].trim() : "Claude ждёт выбора";
  $("ask").innerHTML = `<div class="ask"><p class="q">${esc(q)}</p>${opts.map((o) =>
    `<button class="opt ${o.sel ? "sel" : ""}" data-key="${o.n}"><b>${o.n}</b>${esc(o.text)}</button>`).join("")}</div>`;
}
$("ask").onclick = (e) => {
  const b = e.target.closest("button[data-key]"); if (b) return press(b.dataset.key);
  const t = e.target.closest("button[data-pick]"); if (t) pick(t.dataset.pick, t);
};
// Меню без номеров (доверие к папке, /mcp): строки над подсказкой «… to navigate / Enter to confirm», одна с ❯.
function plainOptions(lines) {
  const foot = lines.findLastIndex((l) => /to navigate|Enter to confirm|Enter to select/.test(l));
  const sel = lines.findLastIndex((l, i) => i < foot && l.includes("❯"));
  if (foot < 0 || sel < 0 || /^\s*❯\s*\d+\./.test(lines[sel])) return "";
  let a = sel, z = sel;
  while (a > 0 && lines[a - 1].trim() && /^\s{2,}/.test(lines[a - 1]) && !/[:?]\s*$/.test(lines[a - 1])) a--;
  while (z < foot - 1 && lines[z + 1].trim() && /^\s{2,}/.test(lines[z + 1]) && !/^\s*(※|https?:)/.test(lines[z + 1])) z++;
  let opts = lines.slice(a, z + 1).map((l) => ({ text: l.replace("❯", "").trim(), sel: l.includes("❯") })).filter((o) => o.text);
  if (opts.some((o) => /^[✔✘⚠]/.test(o.text))) opts = opts.filter((o) => /^[✔✘⚠]/.test(o.text));
  if (opts.length < 2) return "";
  const q = lines.slice(Math.max(0, a - 6), a).reverse().find((l) => /\?\s*$/.test(l) || /^\s*\S.*(servers|MCP)/.test(l)) || "Выберите пункт";
  return `<div class="ask"><p class="q">${esc(q.trim())}</p>${opts.map((o) =>
    `<button class="opt ${o.sel ? "sel" : ""}" data-pick="${esc(o.text.replace(/^[✔✘⚠]\s*/, "").split(/\s{2,}/)[0])}">${esc(o.text)}</button>`).join("")}</div>`;
}
async function pick(text, btn) {
  await busy(btn, "Выбираю…", async () => {
    try { const d = await api("/api/select", { w: current, text }); setTab("screen"); renderAsk(d.lines); }
    catch (e) { toast(e.message, 4500); }
  });
}
$("keys").onclick = (e) => { const b = e.target.closest("button[data-key]"); if (b) press(b.dataset.key); };
async function press(key) {
  haptic("impactOccurred", "light");
  try { const d = await api("/api/key", { w: current, key }); renderAsk(d.lines); if (tab === "screen") $("content").innerHTML = `<pre class="screen">${esc(d.lines.join("\n"))}</pre>`; setTimeout(refresh, 800); }
  catch (e) { toast("Не вышло: " + e.message, 4000); }
}

async function act(path, body, okText) {
  try {
    const d = await api(path, { w: current, ...body });
    if (d.lines) { setTab("screen"); }
    if (okText) toast(okText);
    haptic("impactOccurred", "light");
    return d;
  } catch (e) { toast("Не вышло: " + e.message, 4500); }
}

async function say(full, btn, msg) {
  await busy(btn, "⏳ Готовлю…", async () => {
    try {
      const blob = await api(`/api/tts?w=${encodeURIComponent(current)}&full=${full ? 1 : 0}${msg == null ? "" : "&msg=" + msg}`);
      const p = $("player"); p.src = URL.createObjectURL(blob); $("playerBox").hidden = false; padDock();
      p.play().catch(() => toast("Нажмите ▶ на плеере"));
    } catch (e) { toast("Озвучка: " + e.message, 4500); }
  });
}
function stopPlayer() { $("player").pause(); $("playerBox").hidden = true; padDock(); }
$("playerClose").onclick = stopPlayer;
function padDock() { requestAnimationFrame(() => { $("session").style.paddingBottom = ($("dock").offsetHeight + 16) + "px"; }); }
function closeMenu() { $("menu").hidden = true; $("menuBtn").textContent = "☰"; padDock(); }
$("menuBtn").onclick = () => { const open = $("menu").hidden; $("menu").hidden = !open; $("menuBtn").textContent = open ? "✕" : "☰"; padDock(); };

const ACTIONS = {
  say: (b) => say(false, b),
  sayfull: (b) => say(true, b),
  commands: () => sheet("Команды Claude", meta.commands.map((label, i) => ({
    label, run: async () => { const d = await act("/api/command", { i }); if (d?.models) ACTIONS.models(); else if (d?.sent) { toast("Отправлено"); lastStatus = "busy"; setTab("screen"); } },
  }))),
  models: () => sheet("Модель для этой сессии", [
    ...meta.models.map((m) => ({ label: m, sub: { opus: "самая сильная", sonnet: "баланс скорости и качества", haiku: "самая быстрая" }[m], run: () => act("/api/model", { name: m }, "Модель: " + m) })),
    { label: "Открыть меню /model", sub: "все варианты Claude Code", run: () => act("/api/model", { name: "" }) }]),
  switch: () => $("switchBtn").onclick(),
  active: () => act("/api/active", {}, "Теперь ответы в чате бота — от этой сессии").then(refresh),
  refresh: () => { hist = []; loadContent(); toast("Обновлено"); },
  top: () => scrollTo(0, 0),
  close: () => confirmClose(current),
};
$("menu").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; closeMenu(); ACTIONS[b.dataset.act](b); };
async function closeSession(id = current) {
  try {
    const d = await api("/api/close", { w: id }); toast("Завершение: " + d.result, 4500);
    if (d.result === "закрыто") { if (id === current) back(); else refresh(); }
  } catch (e) { toast("Не вышло: " + e.message, 4500); }
}

$("switchBtn").onclick = () => sheet("Перейти в сессию", sessions.map((s) => ({
  label: s.name, sub: `${STATUS[s.status]} · ${folder(s.path)}`, on: s.id === current, run: () => open(s.id) })));

// ---------- ввод ----------
async function sendText() {
  if (files.some((f) => !f.path)) return toast("Подождите — файл ещё загружается");
  const typed = $("input").value.trim();
  if (!typed && !files.length) return toast("Напишите, надиктуйте или прикрепите файл");
  const text = (typed || "Посмотри файл.") + (files.length ? "\n\n" + files.map((f) => "Файл из панели: " + f.path).join("\n") : "");
  await busy($("send"), "…", async () => {
    try {
      await api("/api/send", { w: current, text });
      $("input").value = ""; files = []; renderFiles(); grow(); toast("Отправлено в «" + (cur()?.name || "") + "»");
      lastStatus = "busy"; haptic("notificationOccurred", "success"); setTimeout(() => { hist = []; loadContent(); }, 1500);
    } catch (e) { toast("Не отправлено: " + e.message, 4500); }
  });
}

// Вложения: фото с камеры, из галереи, любой файл → загрузка в inbox пульта → путь уходит Claude вместе с сообщением.
$("plus").onclick = () => sheet("Прикрепить", [
  { label: "📷 Сфотографировать", run: () => $("fCam").click() },
  { label: "🖼 Фото или видео из галереи", run: () => $("fPhoto").click() },

]);
for (const id of ["fCam", "fPhoto", "fFile"]) $(id).onchange = (e) => { [...e.target.files].forEach(upload); e.target.value = ""; };
async function upload(f) {
  if (f.size > 50 * 1024 * 1024) return toast(`«${f.name}» больше 50 МБ`, 4000);
  const item = { name: f.name || "photo.jpg", path: null }; files.push(item); renderFiles();
  try { item.path = (await api("/api/upload", f, f.type || "application/octet-stream", { "X-File-Name": encodeURIComponent(item.name) })).path; }
  catch (e) { files = files.filter((x) => x !== item); toast(`«${item.name}» не загрузился: ${e.message}`, 4500); }
  renderFiles();
}
function renderFiles() {
  $("attach").hidden = !files.length;
  $("attach").innerHTML = files.map((f, i) => `<span>${f.path ? "📎" : "⏳"} <em>${esc(f.name)}</em><button data-rmf="${i}" aria-label="Убрать">✕</button></span>`).join("");
  sync(); padDock();
}
$("attach").onclick = (e) => { const b = e.target.closest("[data-rmf]"); if (b) { files.splice(+b.dataset.rmf, 1); renderFiles(); } };
// 🎙 и ➤ на одном месте, как в Telegram: есть текст или файл — ➤, нет — 🎙.
function sync() { const has = !!$("input").value.trim() || files.length > 0; $("send").hidden = !has; $("mic").hidden = has && !rec; }
async function toggleMic() {
  if (rec) return rec.stop();
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder)
    return toast("Этот Telegram не даёт панели микрофон — диктуйте кнопкой микрофона на клавиатуре", 5000);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    const chunks = []; rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop()); $("mic").classList.remove("rec"); $("mic").textContent = "🎙"; rec = null;
      const blob = new Blob(chunks, { type: (type || "audio/webm").split(";")[0] });
      toast("Распознаю…", 8000);
      try {
        const d = await api("/api/stt", blob, blob.type);
        $("input").value = ($("input").value + " " + d.text).trim(); grow(); $("input").focus();
        toast("Проверьте текст и нажмите ➤", 3500);
      } catch (e) { toast("Не распознал: " + e.message, 4500); }
    };
    rec.start(); $("mic").classList.add("rec"); $("mic").textContent = "■"; haptic("impactOccurred", "medium");
    toast("Говорите. Нажмите ■, чтобы закончить", 3000);
  } catch (e) { toast("Нет доступа к микрофону: " + e.message, 5000); }
}
function grow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; sync(); padDock(); }
$("send").onclick = sendText; $("mic").onclick = toggleMic; $("input").oninput = grow;

    try { const d = await api("/api/keys", { provider: "elevenlabs", key: $("elKey").value });
          prov = await api("/api/providers"); renderVoice();

    tg?.showConfirm ? tg.showConfirm("Удалить ключ ElevenLabs?", (ok) => ok && go()) : confirm("Удалить ключ ElevenLabs?") && go();

$("integrationsView").addEventListener("change", async (e) => {

function renderMcp() {
  const srv = mcpData.servers;
  $("mcpBox").innerHTML = `
    <div class="section">MCP — инструменты Claude</div>
    <p class="note">MCP-сервер даёт Claude доступ к сервису: задачам, документам, умному дому. Подключение действует во всех сессиях; уже открытые увидят его после перезапуска.</p>
    ${srv.length ? srv.map((s, i) => `<div class="card"><div class="row"><span class="name">${esc(s.name)}</span>
        <span class="pill ${s.ok ? "ok" : "bad"}">${s.ok ? "работает" : /auth/i.test(s.state) ? "нужен вход" : "не подключается"}</span></div>
        <div class="meta">${esc(s.target)}</div>${s.ok ? "" : `<div class="meta" style="white-space:normal">${/auth/i.test(s.state)
          ? "Сервису нужен ваш вход — нажмите «Войти» ниже" : esc(s.state)}</div>`}

$("integrationsView").addEventListener("click", (e) => {
  const rm = e.target.closest("[data-rm]"), p = e.target.closest("[data-p]"), lg = e.target.closest("[data-login]");
  if (lg) return startLogin(lg.dataset.login, lg);
  if (e.target.id === "mcpRefresh") return busy(e.target, "Проверяю…", () => loadMcp(true));
  if (rm) {
    const s = mcpData.servers[+rm.dataset.rm];
    const go = () => busy(rm, "Отключаю…", async () => { try { await api("/api/mcp/remove", { name: s.name }); toast("«" + s.name + "» отключён"); loadMcp(true); } catch (err) { toast(err.message, 4500); } });
    return tg?.showConfirm ? tg.showConfirm(`Отключить «${s.name}»?`, (ok) => ok && go()) : confirm(`Отключить «${s.name}»?`) && go();
  }
  if (p) mcpForm(mcpData.presets[+p.dataset.p]);
});

// Вход в MCP-сервис целиком из панели: сервер сам открывает /mcp в свободной сессии и достаёт ссылку входа.
async function startLogin(name, btn) {
  await busy(btn, "Готовлю вход… (до 20 секунд)", async () => {
    try {
      const a = await api("/api/mcp/login", { name });
      const box = document.createElement("div"); box.innerHTML = authCard(a, name, a.w) +
        `<p class="note">Вход идёт через сессию «${esc(a.session)}». Ссылка действует несколько минут.</p>`;
      btn.replaceWith(box); box.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { toast(e.message, 5000); }
  });
}

function mcpForm(p) {
  show("mcpForm"); $("title").textContent = p.title; $("subtitle").textContent = "подключение MCP";
  const fields = p.fields.map((f) => `<div class="field"><label for="f_${f.key}">${esc(f.label)}${f.optional ? ' <span class="opt">— необязательно</span>' : ""}</label>
      <div class="inp">${f.multiline ? `<textarea id="f_${f.key}" rows="3" placeholder="${esc(f.placeholder || "")}"></textarea>`
        : `<input id="f_${f.key}" type="${f.secret ? "password" : "text"}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(f.placeholder || "")}">`}
      ${f.secret && !f.multiline ? `<button class="icon" type="button" data-eye="f_${f.key}" aria-label="Показать">👁</button>` : ""}</div>
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`).join("");
  $("mcpForm").innerHTML = `<div class="panel">
      <p style="margin:0 0 12px">${esc(p.about)}</p>
      ${p.id === "http" || p.id === "stdio" ? `<div class="field"><label for="f__name">Короткое название (латиницей)</label><input id="f__name" placeholder="например: crm" autocapitalize="off" spellcheck="false">
        <div class="hint">Как этот инструмент будет называться у Claude. Это не логин — логин и пароль здесь не нужны.</div></div>` : `<input id="f__name" type="hidden" value="${esc(p.id)}">`}
      ${!p.fields.length ? `<div class="result ok">Ключ не нужен. Нажмите «Подключить», затем «Войти» — откроется страница ${esc(p.title)}, где вы войдёте как обычно.</div>` : ""}
      ${fields}
      ${p.after ? `<div class="result ok">После подключения: ${esc(p.after)}</div>` : ""}
      <button class="btn" id="mcpAdd">Подключить</button>
      <div id="mcpResult"></div>
      <p class="note">Ключи сохраняются только на вашем сервере (настройки Claude Code) и в панели больше не показываются.</p></div>`;
  $("mcpForm").querySelectorAll("[data-eye]").forEach((b) => b.onclick = () => { const i = $(b.dataset.eye); i.type = i.type === "password" ? "text" : "password"; });
  $("mcpAdd").onclick = (e) => busy(e.target, "Подключаю и проверяю…", async () => {
    const values = Object.fromEntries(p.fields.map((f) => [f.key, $("f_" + f.key).value]));
    try {
      const d = await api("/api/mcp/add", { preset: p.id, name: $("f__name").value.trim(), values });
      const needLogin = /не отвечает|вход/i.test(d.result);
      $("mcpResult").innerHTML = `<div class="result ok">${esc(d.result.split(". Если")[0].split(". Вход")[0])}</div>` +
        (needLogin ? `<button class="btn" data-login="${esc($("f__name").value.trim())}">🔑 Войти в ${esc(p.title)}</button>` : "") +
        `<button class="btn ghost" id="mcpDone">Готово — к списку</button>`;
      $("mcpDone").onclick = back; haptic("notificationOccurred", "success");
      $("mcpResult").querySelector("[data-login]")?.addEventListener("click", (ev) => startLogin(ev.target.dataset.login, ev.target));
    } catch (err) { $("mcpResult").innerHTML = `<div class="result bad">${esc(err.message)}</div>`; haptic("notificationOccurred", "error"); }
  });
}
