# Модуль «Дебиторка и стоп-отгрузка» — формат файла: docs/MODULES.md
id = "horeca-receivables"
version = "1.0"
title = "Дебиторка и стоп-отгрузка"
industry = "Поставщики HoReCa"
about = "Кто из ресторанов сколько должен и сколько дней просрочки; напоминания, претензия и стоп-отгрузка — по вашему решению."
description = """
Каждое утро кроме воскресенья агент разбирает взаиморасчёты с ресторанами (выгрузка 1С или банка в
data/settlements.csv): долг, просрочка по корзинам, кто сверх лимита (data/customers.csv). Дальше — лестница:
напоминания по сроку, звонок менеджера, претензия (черновик, проверяет юрист) и стоп-отгрузка, если просрочка
больше {{stop_days}} дн. или долг сверх лимита. Каждое действие наружу — только после «Да»; стоп-лист — файл
outbox/stop-list.csv для модуля заказов и склада.
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Разбери дебиторку (навык receivables-check), покажи \
кандидатов на стоп-отгрузку — ничего не отправляй и стоп не ставь."""
uses = ["receivables", "reminders", "documents"]

[settings]
settlements = "data/settlements.csv"
customers = "data/customers.csv"
stop_days = 14

[[integrations]]
id = "onec"
title = "Выгрузка взаиморасчётов из 1С"
why = "Свежие долги и оплаты каждое утро. Без неё — data/settlements.csv вручную."
how = "В 1С — регламентная выгрузка «Ведомость по расчётам с контрагентами» в CSV в data/ к 8:30 (или OData только на чтение)."
optional = true

[[integrations]]
id = "gmail"
why = "Напоминания и претензии ресторанам по почте. Без него — черновики в outbox/."
optional = true

[[data_sources]]
title = "Взаиморасчёты: data/settlements.csv"
kind = "client_export"
about = "выгрузка 1С или банка поставщика"

[[data_sources]]
title = "Рестораны, лимиты и отсрочки: data/customers.csv"
kind = "client_export"
about = "из учёта поставщика"

[[schedule]]
at = "09:00"
days = [1, 2, 3, 4, 5, 6]
title = "Дебиторка и стоп-лист"
prompt = """Разбери дебиторку ресторанов (навык receivables-check): RECEIVABLES.md, следующий шаг по каждому \
(debt-steps), кандидаты на стоп-отгрузку (stop-shipment). Вопросы кнопками; без «Да» ничего не отправляй и стоп не ставь."""

[[decisions]]
question = "Что делаем с просрочкой? (всего, >30 дней, сверх лимита, топ-3)"
options = ["Напомнить по лестнице", "Только >30 дней", "Ничего сегодня"]
when = "каждое утро, если есть просрочка"

[[decisions]]
question = "Стоп-отгрузка для <ресторан>? Долг, лимит, просрочка, последняя оплата"
options = ["Да", "Нет", "Напомнить и подождать 3 дня"]
when = "просрочка больше 14 дней или долг сверх лимита"

[[decisions]]
question = "Оплата пришла — снять стоп-отгрузку для <ресторан>?"
options = ["Да", "Нет"]
when = "по свежей выгрузке долг в пределах лимита"
