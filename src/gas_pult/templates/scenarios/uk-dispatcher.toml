[[moments.buttons]]
label = "Сообщить сейчас"
result = "Агент подготовил бы короткий текст жителю о сроке; отправляет диспетчер."
[[moments.buttons]]
label = "Передать руководителю"
result = "Агент передал бы руководителю: жителю не сообщили срок в норматив."

[[moments]]
at = "11:10"
module = "uk-requests"
text = """Не могу определить вид обращения № 1203: «после ремонта трубы во дворе не восстановили газон и бордюр».

Какой срок?"""
[[moments.buttons]]
label = "3 рабочих дня"
result = "Агент поставил бы срок ответа — 3 рабочих дня по календарю РФ."
[[moments.buttons]]
label = "10 рабочих дней"
result = "Агент поставил бы срок ответа — 10 рабочих дней и запомнил выбор для похожих обращений."
[[moments.buttons]]
label = "Следующий день"
result = "Агент поставил бы срок — следующий рабочий день."
[[moments.buttons]]
