# Модуль «Повторный заказ по циклу» — формат файла: docs/MODULES.md
id = "horeca-reorder"
version = "1.0"
title = "Повторный заказ по циклу"
industry = "Поставщики HoReCa"
sections = ["analytics", "docs"]
about = "Видит обычный цикл заказов каждого ресторана и напоминает шефу вовремя — «как обычно?» — пачкой после вашего «Да»."
description = """
По истории заказов (data/orders.csv) агент считает для каждого ресторана обычный интервал между заказами и обычный
набор. Каждый день в 11:00 — кому пора заказывать (по циклу заказ ожидался, а его нет), и черновик напоминания
шефу с его обычным набором: «Добрый день! Завтра доставка — повторить как в прошлый раз?». Уходит только пачкой
после «Да», только с согласия на уведомления и не в тихие часы. Рекламы в напоминаниях нет.
"""
start = """Прочитай CLAUDE.md и data/orders.csv, data/customers.csv (пример выдуманный). Посчитай циклы ресторанов \
(навык reorder-cycle) и покажи, кому напомнили бы сегодня, — без отправки."""
uses = ["reminders"]

[settings]
orders = "data/orders.csv"
customers = "data/customers.csv"
min_orders = 3

[[integrations]]
id = "telegram-sender"
title = "Бот компании для сообщений шефам"
why = "Отправить одобренные напоминания в Telegram. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота компании."
optional = true

[[data_sources]]
title = "История заказов и рестораны: data/orders.csv, data/customers.csv"
kind = "client_export"
about = "из учёта поставщика или модуля «Заказ из мессенджера» (orders/)"

[[schedule]]
at = "11:00"
title = "Кому пора заказывать"
prompt = """Посчитай, кому из ресторанов пора заказывать по циклу (навык reorder-cycle), подготовь пачку напоминаний \
(reminder-batch, шаблон templates/reorder.md) и спроси «Отправить пачку из N?». Без «Да» не отправляй."""

[[decisions]]
question = "Напомнить N шефам о заказе? (первые три ресторана, их обычный набор)"
options = ["Да", "Нет"]
when = "каждый день, если по циклу кто-то не заказал"
