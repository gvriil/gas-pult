text = """📥 Заявка (демо) · {{business}}
Комплекс + химчистка салона, {{point}}, завтра 11:00. Клиент: Ольга (демо), пишет в Telegram."""
buttons = ["Подтвердить", "Предложить 13:00"]
replies = ["В рабочем режиме агент подтвердил бы запись клиенту и поставил её в расписание филиала. Сейчас ничего не отправлено.", "Агент предложил бы клиенту 13:00 и дождался ответа — без вашего участия, если так настроено."]

