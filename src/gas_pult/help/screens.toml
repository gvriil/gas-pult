roles = ["owner", "member"]
purpose = "Сессия со своей папкой: её файлы и разговор хранятся отдельно и находятся по имени."
steps = ["Назовите сессию понятно — например, «Сверка актов за октябрь».", "«Создать» — агент запустится в новой папке.", "Первый раз агент спросит, доверять ли папке, — ответьте «Да»."]
next = ["go:sessions"]

