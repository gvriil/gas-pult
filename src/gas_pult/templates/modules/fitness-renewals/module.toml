# Модуль «Продления карт» (фитнес-клубы, семейные) — формат файла: docs/MODULES.md
id = "fitness-renewals"
version = "1.0"
title = "Продления клубных карт"
industry = "Фитнес-клубы (семейные)"
sections = ["analytics", "comms"]
about = "Точки 60/30/7 дней до конца карты, семейное продление; утром — «под риском»."
description = """
Каждое утро агент смотрит карты участников (data/members.csv) и посещения (data/visits.csv). Менеджеру в
{{risk_at}} — список «под риском»: посещаемость упала, карта скоро кончится или уже кончилась, на сообщения не
отвечают (оценка — скрипт renewal_risk.py). Участникам — точки касания за 60, 30 и 7 дней до конца карты (настройка points):
напоминание о сроке (сервисное, по согласию на уведомления) и персональное предложение по истории посещений и типу
карты (только с согласием на рекламу, ст. 18 ФЗ «О рекламе»). Если у семьи (общий family_id) карты кончаются рядом —
одно семейное продление плательщику. Скидки и спецусловия — только разрешённые в настройках, иначе вопрос человеку.
Пачка уходит только после «Отправить пачку из N?» — «Да»; без «Да» — черновики в outbox/. Для клиентов в РФ сессия
только на российской модели (GigaChat или YandexGPT, docs/RU-MODELS.md), хранение в РФ (152-ФЗ).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Запусти renewal_risk.py на 2026-11-02 (навык renewal-risk) \
и покажи список «под риском» и кому написали бы сегодня, — ничего не отправляй."""
uses = ["reminders"]

[settings]
members = "data/members.csv"
visits = "data/visits.csv"
points = "60,30,7"             # за сколько дней до конца карты точки касания
family_window = 30             # карты семьи кончаются в пределах N дней друг от друга — одно семейное продление
allowed_discount = "нет"       # разрешённая скидка на продление, например «5 % при продлении за 30 дней»; «нет» — без скидок
family_offer = "нет"           # разрешённое семейное условие, например «вторая карта −10 %»; «нет» — без условий
risk_at = "9:00"
batch_max = 50

[[integrations]]
id = "club-crm"
title = "Учётная система клуба / CRM (официальный API)"
why = "Карты, посещения и согласия напрямую. Без неё — выгрузки в data/members.csv и data/visits.csv."
how = "Если у вашей системы учёта клуба есть официальный API — MCP-сервер с ключом клуба: панель → Интеграции → «Свой сервер (адрес)». Иначе — ежедневная выгрузка CSV или XLSX в data/."
optional = true

[[integrations]]
id = "club-sender"
title = "Бот или SMS-шлюз клуба для сообщений участникам"
why = "Отправить одобренную пачку. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота или SMS-шлюза клуба."
optional = true

[[data_sources]]
title = "Карты и согласия: data/members.csv"
kind = "client_export"
about = "выгрузка учётной системы клуба: тип карты, дата окончания, family_id, согласия — отдельными полями"

[[data_sources]]
title = "Посещения: data/visits.csv"
kind = "client_export"
about = "выгрузка турникета или учётной системы: дата, участник, филиал"

[[data_sources]]
title = "Учётная система клуба"
kind = "official_api"
about = "только официальный API с ключом клуба, если подключён"

[[schedule]]
at = "09:00"
title = "Под риском — менеджеру"
prompt = """Список «под риском» на сегодня (навык renewal-risk): у кого падает посещаемость, кончается или кончилась \
карта, нет ответа. RISK.md и вопрос менеджеру «Что делаем с N под риском?»; нет таких — одна строка."""

[[schedule]]
at = "11:00"
days = [1, 2, 3, 4, 5, 6]
title = "Точки касания до конца карты"
prompt = """Точки касания за {{points}} дней до конца карты (навык renewal-risk), семейные — одним сообщением \
плательщику. Собери пачки (reminder-batch) и спроси «Отправить пачку из N?» о каждой. Без «Да» не отправляй."""

[[decisions]]
question = "Под риском N участников — что делаем? (первые три имени, причины)"
options = ["Позвонить", "Персональное предложение", "Подробно", "Позже"]
when = "каждое утро, если есть участники с риском «высокий» или «средний»"

[[decisions]]
question = "Отправить пачку из N? (точка 60/30/7, семейные, первые три имени)"
options = ["Да", "Нет"]
when = "каждый день, если есть кому писать"

[[decisions]]
question = "Нужна скидка или спецусловие, которых нет в настройках, — что предлагаем?"
options = ["Без скидки", "Разрешаю один раз", "Позвоню сам"]
when = "когда участник просит условие вне прайса и разрешённого в [settings]"
