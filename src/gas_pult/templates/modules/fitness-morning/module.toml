# Модуль «Утренние цифры клуба» (фитнес-клубы, семейные) — формат файла: docs/MODULES.md
id = "fitness-morning"
version = "1.0"
title = "Утренние цифры клуба"
industry = "Фитнес-клубы (семейные)"
sections = ["analytics"]
about = "В 8:00 — продажи и продления против плана, загрузка групповых занятий."
description = """
Каждое утро в 8:00 агент берёт вчерашние продажи (data/sales.csv: новые карты и продления), план месяца
(data/plan.csv) и записи на групповые занятия (data/classes.csv) и считает по каждому филиалу: новые карты, продления
и выручку — за вчера и с начала месяца против плана; загрузку групповых занятий (записано / вместимость), полные
(от {{high}} %) и пустые (меньше {{low}} %) занятия. Топ-3 отклонения (порог {{threshold}} %) — в вопрос «Что
делаем?» с 2–4 вариантами кнопками; полностью — SUMMARY.md, история — history/. Персональных данных в сводке нет;
для клуба в РФ — российская модель (GigaChat или YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Собери пробную сводку за 2026-11-01 навыком club-kpi \
и покажи её с вопросом «Что делаем?»."""

[settings]
sales = "data/sales.csv"
plan = "data/plan.csv"
classes = "data/classes.csv"
threshold = 10
low = 40
high = 95

[[integrations]]
id = "club-crm"
title = "Учётная система клуба / касса (официальный API)"
why = "Продажи, продления и записи на занятия — напрямую. Без неё — выгрузки в data/ к 7:50."
how = "Если у вашей системы учёта клуба есть официальный API — MCP-сервер с ключом клуба: панель → Интеграции → «Свой сервер (адрес)». Иначе — регламентная выгрузка отчётов в data/."
optional = true

[[integrations]]
id = "gdrive"
title = "Google Таблицы (через Google Диск)"
why = "Если план по филиалам ведёте в Google Таблице."
optional = true

[[data_sources]]
title = "Продажи и продления: data/sales.csv"
kind = "client_export"
about = "выгрузка кассы или учётной системы: дата, филиал, вид (новая | продление), карт, сумма"

[[data_sources]]
title = "План и групповые занятия: data/plan.csv, data/classes.csv"
kind = "client_export"
about = "план месяца по филиалам; расписание с записью и вместимостью"

[[data_sources]]
title = "Учётная система клуба или Google Таблицы"
kind = "official_api"
about = "только официальный API с ключом клуба или коннектор Google Диска, если подключены"

[[schedule]]
at = "08:00"
title = "Утренние цифры клуба"
prompt = """Утренние цифры за вчера по филиалам (навык club-kpi): новые карты, продления, выручка против плана за \
вчера и с начала месяца, загрузка групповых занятий. SUMMARY.md и вопрос «Что делаем?» с 2–4 вариантами."""

[[decisions]]
question = "Что делаем? (по филиалам: новые карты, продления, выручка; загрузка групп; топ-3 отклонения)"
options = ["Разобрать главное отклонение", "Подробно по филиалу", "Всё в порядке", "Позже"]
when = "каждое утро после сводки; варианты агент подбирает под цифры дня"
