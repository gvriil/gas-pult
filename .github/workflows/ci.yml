name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - name: shellcheck install.sh, bin/pult-tenant-setup
        run: shellcheck install.sh bin/pult-tenant-setup

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: gas-pult --version

  # Вход по ключу (passkeys.py) — необязательная зависимость webauthn: в обычной задаче её тесты пропускаются,
  # здесь пакет стоит и пропусков быть не должно.
  passkeys:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,passkeys]"
      - run: pip show webauthn | head -2
      - name: тесты ключей входа — без пропусков
        run: |
          pytest -q -rs tests/test_passkeys.py | tee passkeys.log
          ! grep -q SKIPPED passkeys.log
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, passkeys]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
