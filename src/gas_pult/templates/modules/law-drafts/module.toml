# Модуль «Черновик договора или претензии» — формат файла: docs/MODULES.md
id = "law-drafts"
version = "1.0"
title = "Черновик договора или претензии"
industry = "Бухгалтеры и юристы на аутсорсе"
about = "По просьбе клиента — черновик договора или претензии по шаблону юриста, с расчётом долга; проверяет и отправляет юрист."
description = """
Для юриста или бухгалтерской фирмы на аутсорсе: клиент пишет «нужен договор поставки с ООО …» или «контрагент
не платит» — агент собирает данные из data/ и сообщения, выбирает шаблон юриста из templates/, заполняет поля,
считает долг по документам и выдаёт черновик с пометкой «ЧЕРНОВИК — проверяет юрист» и списком «что уточнить».
Отправка контрагенту — только после проверки юристом и «Да». Юридических заключений агент не даёт. Для клиентов в
РФ — российская модель (GigaChat или YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md, шаблоны в templates/ и data/ (пример выдуманный). Подготовь пробный черновик \
претензии по data/debts.csv (навык claim-draft) — ничего не отправляй."""
uses = ["documents", "receivables"]

[settings]
parties = "data/parties.csv"
debts = "data/debts.csv"

[[integrations]]
id = "gdrive"
why = "Если шаблоны юриста и документы клиента лежат в Google Диске — агент читает их сам."
optional = true

[[integrations]]
id = "gmail"
why = "Отправить черновик юристу или одобренную претензию контрагенту. Без него — файлы в outbox/docs/."
optional = true

[[data_sources]]
title = "Стороны, договоры, документы отгрузки и оплаты: data/"
kind = "client_export"
about = "от клиента: реквизиты, договор, УПД/акты, выписка оплат"

[[data_sources]]
title = "Шаблоны договоров и претензий: templates/"
kind = "client_export"
about = "шаблоны юриста (примеры в модуле — заменить своими)"

[[decisions]]
question = "Черновик <договора/претензии> для <контрагент> готов. Что дальше?"
options = ["Передать юристу", "Изменить", "Оставить черновиком"]
when = "после каждого черновика"

[[decisions]]
question = "Юрист проверил претензию <контрагент> на <сумма> ₽ — отправить?"
options = ["Да", "Нет"]
when = "только после отметки юриста «проверено»"
