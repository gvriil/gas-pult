# «Примерочная»: роль «Директор управляющей компании». Формат — docs/SCENARIOS.md.
# УК, дома, адреса, лицевые счета и все цифры — выдуманный пример.
title = "Директор управляющей компании"
short = "Сводка утром, раскрытие в ГИС ЖКХ, предписания жилинспекции, долги, сроки ответов жителям."
industries = ["Управляющие компании — «УК-старт»"]
modules = ["uk-morning", "uk-gis-disclosure", "uk-inspections", "uk-debts", "uk-requests"]
who = """У вас в управлении несколько десятков многоквартирных домов. Жилинспекция штрафует за просроченные ответы \
жителям и неисполненные предписания, долги растут, а раскрытие в ГИС ЖКХ кто-то «вроде размещал». О проблемах вы \
узнаёте из жалоб, а не заранее."""
without = """Сроки ответов жителям считают в календарных днях вместо рабочих — и ошибаются. Пункт предписания \
вспоминают за день до проверки. Должник, которому полгода назад надо было отправить претензию, всё ещё на ступени \
«напомнить». Что не размещено в ГИС ЖКХ, выясняется из акта проверки."""
needs = [
    "Реестр обращений жителей и журнал аварийной службы — выгрузка (CSV, XLSX) из вашей системы или таблицы",
    "Начисления, оплаты и список должников — выгрузка из биллинга; статусы дел вносит человек (открытого API нет)",
    "Предписания жилинспекции (PDF, скан, текст) и фото или акты по пунктам — в папку пространства",
    "Выгрузка размещённого в ГИС ЖКХ — ваша выгрузка, агент в кабинет не входит",
    "Канал ответов жителям — Telegram или почта УК; SMS-канала в пульте нет, без канала — черновики в outbox/",
]
first_step = """Пришлите реестр обращений за последний месяц — сроки по Правилам № 416 и № 354 в рабочих днях появятся \
в сводке в 8:00, с сигналом за день до срока. Долги, предписания и ГИС ЖКХ — по одному модулю дальше."""

[demo]
business = "УК «Пример»"
point = "Примерная, 1"

[[timeline_steps]]
at = "08:00"
module = "uk-morning"
text = """Сводка директора · {{business}} (пример)
Обращения: просрочено 1, срок сегодня 3, новых за сутки 17.
Аварии за сутки: 2, дольше 30 минут без отметки о локализации — 1 (дом «{{point}}», ХВС).
Плановые работы: отключение ГВС, Тестовая, 12, 10:00–16:00.

Что делаем?"""
[[timeline_steps.decisions]]
label = "Разобрать просроченные"
outcome_toast = "Агент пришлёт просроченное обращение с историей, сроком по правилам и черновиком ответа жителю."
[[timeline_steps.decisions]]
label = "Подробно по авариям"
outcome_toast = "Агент покажет обе аварии по журналу: время звонка, отметка о локализации, где не уложились в 30 минут."
[[timeline_steps.decisions]]
label = "Всё в порядке"
outcome_toast = "Агент запишет, что сводка просмотрена, и не будет беспокоить до сигнала по сроку."
[[timeline_steps.decisions]]
label = "Позже"
outcome_toast = "Агент напомнит через час."

[[timeline_steps]]
at = "09:00"
day = "1-й рабочий день месяца"
module = "uk-gis-disclosure"
text = """Сверка раскрытия в ГИС ЖКХ по чек-листу и вашей выгрузке (пример): не размещено 4 — первое: отчёт об исполнении договора управления, дом «{{point}}», срок был 31.03; с опозданием — 2.

Поручить?"""
[[timeline_steps.decisions]]
label = "Поручить всё ответственному"
outcome_toast = "Агент поставит ответственному задачу со списком из 4 пунктов и сроками. Размещает в ГИС ЖКХ человек."
[[timeline_steps.decisions]]
label = "Поручить по пунктам"
outcome_toast = "Агент спросит по каждому пункту, кому поручить."
[[timeline_steps.decisions]]
label = "Уже размещено — обновлю выгрузку"
outcome_toast = "Агент дождётся новой выгрузки и сверит снова."
[[timeline_steps.decisions]]
label = "Позже"
outcome_toast = "Агент напомнит завтра."

[[timeline_steps]]
at = "09:10"
module = "uk-inspections"
text = """Пункт 3 предписания № 41-П (пример): ремонт отмостки, дом «{{point}}». До срока 2 рабочих дня, фото и актов в папке пункта нет.

Просить продление?"""
[[timeline_steps.decisions]]
label = "Просить продление"
outcome_toast = "Агент подготовит черновик ходатайства об отсрочке с обоснованием; подписываете и отправляете вы."
[[timeline_steps.decisions]]
label = "Успеем — напомнить исполнителю"
outcome_toast = "Агент напомнит исполнителю о сроке и о том, какие фото и акты нужны для отчёта."
[[timeline_steps.decisions]]
label = "Позже"
outcome_toast = "Агент спросит снова завтра — до срока останется 1 рабочий день."

[[timeline_steps]]
at = "09:30"
module = "uk-debts"
text = """ЛС-000-01 (пример): долг 38 400 ₽ за 7 месяцев, пени 2 160 ₽ (расчёт по ч. 14 ст. 155 ЖК РФ). Напоминания были дважды, оплат нет.

Перевести на «претензию»?"""
[[timeline_steps.decisions]]
label = "Да"
outcome_toast = "Агент подготовит черновик претензии с расчётом пеней; подписывает юрист, отправляете вы."
[[timeline_steps.decisions]]
label = "Нет"
outcome_toast = "Должник останется на ступени «напоминание»."
[[timeline_steps.decisions]]
label = "Отложить на 14 дней"
outcome_toast = "Агент вернётся к должнику через 14 дней с новым расчётом."
[[timeline_steps.decisions]]
label = "Рассрочка"
outcome_toast = "Агент подготовит черновик соглашения о рассрочке — условия задаёте вы."

[[timeline_steps]]
at = "14:00"
module = "uk-requests"
text = """Готовы черновики ответов жителям, срок которых истекает завтра: 5 (пример).
Первый: «Добрый день! По вашему обращению № 418 о перерасчёте: перерасчёт за октябрь будет в квитанции за ноябрь».

Отправить пачку из 5?"""
[[timeline_steps.decisions]]
label = "Отправить"
outcome_toast = "Ответы ушли бы 5 жителям — в Telegram или на почту УК; у кого нет канала — черновик в outbox/ для печати. Сейчас ничего не отправлено."
[[timeline_steps.decisions]]
label = "Показать черновики"
outcome_toast = "Агент покажет черновики по одному — каждый на «Да» или правку."
[[timeline_steps.decisions]]
label = "Не сейчас"
outcome_toast = "Агент напомнит перед концом дня: срок — завтра."

[calculator]
assumptions_disclaimer = """Оценка, не обещание. Доли и минуты — допущения: поправьте их под себя, результат \
пересчитается. Диапазон — ±20 % вокруг допущения. Деньги по долгам — ускорение сбора того, что вам и так должны, \
а не дополнительный доход. Точные цифры покажет пилот на ваших данных."""

[[calculator.inputs]]
id = "requests"
title = "Обращений жителей в месяц"
unit = "шт."
default = 400
min = 1
max = 50000
step = 10
about = "Все обращения в реестре."

[[calculator.inputs]]
id = "late_share"
title = "Доля ответов, уходящих с опозданием"
unit = "%"
default = 3
min = 0.1
max = 50
step = 0.1
assumption = true
about = "Допущение: какая часть ответов сейчас опаздывает из-за подсчёта сроков вручную."

[[calculator.inputs]]
id = "debt"
title = "Просроченный долг жителей"
unit = "₽"
default = 3000000
min = 10000
max = 1000000000
step = 10000
about = "Сумма долгов дольше трёх месяцев по всем лицевым счетам."

[[calculator.inputs]]
id = "speed_share"
title = "Доля долга, собранная раньше за месяц"
unit = "%"
default = 2
min = 0.1
max = 30
step = 0.1
assumption = true
about = "Допущение: какую часть долга ступени без пропусков (напоминание → претензия → приказ) собирают раньше обычного."

[[calculator.formulas]]
title = "Ответы жителям, ушедшие в срок"
unit = "ответов в месяц"
of = ["requests", "late_share"]
low = 0.008
high = 0.012
round = 1
about = "Обращения × доля опаздывающих: агент считает сроки по правилам в рабочих днях и предупреждает за день."

[[calculator.formulas]]
title = "Ускорение сбора долгов"
caption = "ускорение сбора, не доп. доход"
unit = "₽ в месяц"
of = ["debt", "speed_share"]
low = 0.008
high = 0.012
round = 1000
about = "Долг × доля, собранная раньше. Эти деньги вам и так должны — агент помогает получить их раньше."
