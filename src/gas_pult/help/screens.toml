[[screen.faq]]
id = "s-ask"
q = "Агент спрашивает разрешение — что нажать?"
a = "Прочитайте вопрос над кнопками. «Да» — разрешить один раз, «Нет» — отказаться и написать, как иначе. Не уверены — «Показать подробности»."
q_en = "The agent asks for permission — what should I tap?"
a_en = "Read the question above the buttons. «Yes» allows once, «No» declines so you can write what to do instead. Not sure? Tap «Show details»."
actions = ["go:simple.chat"]

[[screen.faq]]
id = "s-yes"
q = "Что за карточки «Ждут вашего Да»?"
a = "Другие ваши агенты ждут решения. «Да» — разрешить один раз, если вопрос понятен из строки на карточке. Не уверены — «Открыть»: там видно подробности и все варианты."
q_en = "What are the «Waiting for your Yes» cards?"
a_en = "Your other agents are waiting for a decision. «Yes» allows once if the line on the card is clear. Not sure — «Open» shows details and all options."
actions = ["go:simple.chat"]

[[screen.faq]]
id = "s-secs"
q = "Зачем Поиск, Цифры, Бумаги и Общение?"
a = "Это фильтры: нажмите раздел — останутся агенты этого раздела и появятся примеры просьб. Нажмите ещё раз — снова все."
q_en = "What are Search, Numbers, Papers and Messages for?"
a_en = "They are filters: tap a section to keep only its agents and see example requests. Tap again to show all."
actions = ["go:simple.chat"]

[[screen.faq]]
id = "s-safe"
q = "Что значит «больше не спрашивать»?"
a = "Агент запомнит разрешение и дальше будет делать такие действия сам. Такие варианты спрятаны в «Другие варианты» — выбирайте, только если уверены."
q_en = "What does «don't ask again» mean?"
a_en = "The agent remembers the permission and will do such actions on its own. These options are under «More options» — choose them only if you are sure."
actions = ["go:simple.chat"]

[[screen.faq]]
id = "s-lang"
q = "Как сменить язык?"
a = "Откройте «Настройки» и выберите язык. Чтобы агент тоже отвечал на нём, нажмите там «Попросить агента отвечать…»."
q_en = "How do I change the language?"
a_en = "Open «Settings» and pick a language. To make the agent reply in it too, tap «Ask the agent to reply…» there."
actions = ["go:simple.settings"]

