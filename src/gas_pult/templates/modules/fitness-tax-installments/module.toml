# Модуль «Налоговый вычет и рассрочки» (фитнес-клубы, семейные) — формат файла: docs/MODULES.md
id = "fitness-tax-installments"
version = "1.0"
title = "Вычет за фитнес и рассрочки"
industry = "Фитнес-клубы (семейные)"
about = "Справки для налогового вычета; рассрочки: графики, напоминания, просрочки."
description = """
Налоговый вычет (пп. 7 п. 1 ст. 219 НК РФ, сверено 02.11.2026 — сверять ежегодно): агент собирает заявки на
справку об оплате физкультурно-оздоровительных услуг (ФИО и ИНН плательщика, год, за кого — сам, ребёнок,
подопечный, родитель-пенсионер с 2026 года), проверяет их скриптом tax_check.py — в том числе, что клуб в перечне
организаций за этот год (ставит человек: {{in_list_years}}), — и готовит черновик данных для справки (форма по
приказу ФНС № ЕД-7-11/756@). Выдачу подтверждает человек. Рассрочки: графики платежей (data/installments.csv),
напоминание за {{remind_days}} дня до срока и в день срока, просрочки по корзинам — мягко и только после «Да»;
никаких блокировок прохода и штрафов без пункта договора и решения человека. Для клиентов в РФ — российская модель
(GigaChat или YandexGPT, docs/RU-MODELS.md), хранение в РФ (152-ФЗ).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Проверь заявки на справку (навык tax-certificate) и \
рассрочки на 2026-11-02 (навык installments) и покажи, что готово, что нет и почему, — ничего не отправляй."""
uses = ["documents", "receivables", "deadlines", "reminders"]

[settings]
requests = "data/tax_requests.csv"
payments = "data/payments.csv"
installments = "data/installments.csv"
in_list_years = "2025,2026"    # годы, за которые клуб в перечне организаций — проверяет и ставит человек (пример)
issue_workdays = 10            # внутренний срок клуба на справку, рабочих дней (не закон; пример)
remind_days = 3                # напоминание о платеже за N дней до срока
signer = "уполномоченное лицо клуба"

[[integrations]]
id = "club-crm"
title = "Учётная система клуба / касса (официальный API)"
why = "Оплаты, договоры рассрочки и графики напрямую. Без неё — выгрузки в data/."
how = "Если у вашей учётной системы или кассы есть официальный API — MCP-сервер с ключом клуба: панель → Интеграции → «Свой сервер (адрес)». Иначе — выгрузка CSV или XLSX в data/ (например, из 1С)."
optional = true

[[integrations]]
id = "club-sender"
title = "Бот, почта или SMS-шлюз клуба"
why = "Отправить одобренные напоминания о платежах и сообщить, что справка готова. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота или SMS-шлюза клуба; почта — коннектор Gmail."
optional = true

[[data_sources]]
title = "Заявки на справку: data/tax_requests.csv"
kind = "client_export"
about = "из формы на сайте, у стойки администратора или в боте клуба; минимум полей для справки"

[[data_sources]]
title = "Оплаты и рассрочки: data/payments.csv, data/installments.csv"
kind = "client_export"
about = "выгрузка кассы или учётной системы клуба: оплаты по плательщикам, графики платежей"

[[data_sources]]
title = "Учётная система клуба / касса"
kind = "official_api"
about = "только официальный API с ключом клуба, если подключён"

[[schedule]]
at = "10:00"
days = [1, 2, 3, 4, 5]
title = "Справки и рассрочки"
prompt = """Новые заявки на справку (навык tax-certificate): проверка, черновики данных для справки, сроки \
(workdays, {{issue_workdays}} рабочих дней). Рассрочки (навык installments): скоро, сегодня, просрочено — пачки \
напоминаний (reminder-batch) и вопрос о каждой. Нет ничего — одна строка."""

[[decisions]]
question = "Справки готовы: N черновиков — выдать?"
options = ["Выдать", "Проверю сам", "Позже"]
when = "черновики данных для справки собраны; выдаёт и подписывает человек"

[[decisions]]
question = "Клуба нет в перечне за год или заявка не проходит — что отвечаем?"
options = ["Ответить по шаблону", "Позвоню сам", "Позже"]
when = "tax_check.py нашёл проблему"

[[decisions]]
question = "Отправить пачку из N? (напоминания о платежах: скоро, сегодня, просрочено)"
options = ["Да", "Нет"]
when = "по будням, если есть платежи"

[[decisions]]
question = "Просрочка больше 30 дней — что делаем?"
options = ["Напомнить", "Позвонить", "Перенести платёж", "Ничего"]
when = "блокировка карты или неустойка — только если есть пункт договора и решение человека"
