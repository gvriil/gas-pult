result = "Агент отметил бы прибытие бригады и напомнил через 10 минут, если локализации так и нет."
[[moments.buttons]]
label = "Передать руководителю"
result = "Агент сообщил бы руководителю аварийной службы: заявка, время, кто выехал."

[[moments]]
at = "09:02"
module = "uk-emergency"
text = """Заявителю по № 1187 не сообщили срок исполнения (30 мин) — отметить?"""
[[moments.buttons]]
label = "Сообщили — отметить"
