# Модуль «Остатки и урожай» — формат файла: docs/MODULES.md
id = "horeca-harvest"
version = "1.0"
title = "Остатки и урожай"
industry = "Поставщики HoReCa"
about = "Каждое утро — что есть, что поспевает, что заказано; излишек с коротким сроком — предложить скидку, решаете вы."
description = """
Свежая продукция живёт 5–10 дней. В 7:00 агент сводит остатки и ожидаемый сбор (data/stock.csv, data/harvest.csv)
с заказами на ближайшие дни (data/orders-ahead.csv): чего не хватит — вопрос, кому урезать или что предложить
заменой; что останется и истечёт через {{surplus_days}} дн. — вопрос «Предложить ресторанам скидку N %?» (скидка не
ниже себестоимости). Предложение скидки — реклама: уходит пачкой только ресторанам с согласием на рекламу и только
после «Да». Списание и переработку решает человек.
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Сведи остатки, урожай и заказы (навык surplus-check) \
и покажи излишки и нехватку — без рассылок."""
uses = ["reminders"]

[settings]
stock = "data/stock.csv"
harvest = "data/harvest.csv"
orders = "data/orders-ahead.csv"
customers = "data/customers.csv"
surplus_days = 2
discounts = "15, 25, 40"

[[integrations]]
id = "telegram-sender"
title = "Бот компании для сообщений ресторанам"
why = "Отправить одобренное предложение излишков. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота компании."
optional = true

[[data_sources]]
title = "Остатки, урожай, заказы вперёд: data/stock.csv, data/harvest.csv, data/orders-ahead.csv"
kind = "client_export"
about = "учёт поставщика: склад, план сбора, подтверждённые заказы"

[[schedule]]
at = "07:00"
title = "Остатки, урожай и заказы"
prompt = """Сведи остатки, урожай и заказы на ближайшие дни (навык surplus-check): нехватка и излишки — HARVEST.md, \
затем вопросы. Предложение скидки ресторанам — только пачкой после «Да» и только с согласием на рекламу."""

[[decisions]]
question = "Излишек: <позиция> <кол-во>, годен до <дата>. Предложить ресторанам скидку N %?"
options = ["Да", "Другая скидка", "Списать или переработать", "Нет"]
when = "свободный остаток истекает в ближайшие дни"

[[decisions]]
question = "Не хватает <позиция> на <дата>: заказано X, будет Y. Что делаем?"
options = ["Предложить замену", "Урезать пропорционально", "Докупить", "Решу сам"]
when = "заказов больше, чем остаток и сбор"
