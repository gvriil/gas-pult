# Первый разговор: бейджики-сценарии в пустой сессии и новом чате (GAS-37; владелец 19.11).
# Нажатие — не готовый ответ, а короткое интервью: агент задаёт вопросы ниже по одному (с вариантами — кнопками),
# потом делает дело; внешнее действие (письмо, встреча, сообщение людям) — только после «Да / Нет / Позже».
# Правит штаб без кода. Поля: id, title (2–4 слова), occ_only (только под занятие, не в общем ряду), needs (mail | calendar | docs | vkusvill | ""), instead (id бейджика, если нужного
# не подключено), goal (что сделать), questions (2–3 вопроса; варианты — через « | »).
# Необязательно: chat_title (как назвать чат по смыслу — кто · что · сумма или срок), then (следующий шаг после дела),
# template (шаблон документа из help/templates/<имя>.md — уходит агенту вместе с заданием).

[[starter]]
id = "day-plan"
title = "План на день"
needs = ""
goal = "составить мне план на сегодня: что важно, что срочно, что можно отложить"
questions = ["Сколько у вас сегодня свободных часов? | 1–2 | 3–5 | весь день",
             "Что обязательно нужно успеть сегодня?",
             "Есть встречи или звонки по времени? | да, скажу | нет | посмотри в календаре"]

[[starter]]
id = "meeting"
title = "Назначить встречу"
needs = "calendar"
instead = "connect-calendar"
goal = "найти время и подготовить приглашение на встречу"
questions = ["С кем встреча?", "Когда удобно? | сегодня | завтра | на этой неделе | на следующей",
             "Сколько длится? | 15 минут | 30 минут | 1 час"]

[[starter]]
id = "mail"
title = "Разобрать почту"
needs = "mail"
instead = "connect-mail"
goal = "разобрать входящие: что важно, на что ответить, что можно в архив"
questions = ["За какой период? | сегодня | 3 дня | неделя",
             "Что важнее всего? | клиенты | деньги и счета | всё подряд"]

[[starter]]
id = "client-reply"
title = "Ответить клиенту"
needs = "mail"
instead = "connect-mail"
goal = "подготовить ответ клиенту"
questions = ["Кому отвечаем? Имя или тема письма", "Какой тон? | дружелюбно | официально | коротко",
             "Что главное сказать?"]

[[starter]]
id = "docs"
title = "Спросить по документам"
needs = "docs"
instead = "connect-docs"
goal = "найти ответ в моих документах (find_in_docs) и ответить цитатой: файл и место; не нашлось — так и сказать"
questions = ["Что ищем? Вопрос или слова из документа", "Где искать? | договоры | инструкции | прайсы | везде"]

[[starter]]
id = "business-plan"
title = "Бизнес-план"
needs = ""
goal = "набросать бизнес-план на одну страницу: идея, клиенты, деньги, первые шаги"
questions = ["Какой бизнес или идея?", "Кто клиенты? | частные люди | компании | и те и другие",
             "Какой срок важен? | месяц | 3 месяца | год"]

[[starter]]
id = "find-doc"
title = "Найти документ"
needs = ""
goal = "найти нужный документ в моих файлах и на Диске"
questions = ["Что за документ? Слова из названия или о чём он", "Примерно когда? | эта неделя | этот месяц | давно"]

[[starter]]
id = "reminder"
title = "Напомнить о деле"
needs = ""
goal = "поставить напоминание или задачу"
questions = ["О чём напомнить?", "Когда? | через час | вечером | завтра утром | в дату, скажу"]

[[starter]]
id = "connect-mail"
title = "Подключить почту"
needs = ""
connect = true
goal = "помочь подключить мою почту к пульту — по шагам, без паролей в чате"
questions = ["Какая почта? | Gmail | Яндекс | Mail.ru | другая"]

[[starter]]
id = "connect-calendar"
title = "Подключить календарь"
needs = ""
connect = true
goal = "помочь подключить календарь — по шагам, без паролей в чате"
questions = ["Какой календарь? | Google | iCloud (Apple) | другой"]

[[starter]]
id = "connect-docs"
title = "Подключить документы"
needs = ""
connect = true
goal = "помочь подключить папку с моими документами к пульту (интеграция «Документы»), чтобы искать по ним"
questions = ["Где лежат документы? | на сервере | на Google Диске | у меня на компьютере"]

# ---------- «Чем вы занимаетесь?» (владелец 19.11: «на пустом чате — спросить, чем человек занимается, и предложить
