# Модуль «Ночная смена» — формат файла: docs/MODULES.md
id = "night-shift"
version = "1.0"
title = "Ночная смена"
industry = "Общие"
about = "Ночью агент идёт по плану: код → проверка → ревью безопасности. Будит только по трём причинам."
description = """
Вечером вы пишете задачи в PLAN.md, ночью агент выполняет их по одной: пишет код, прогоняет тесты и линтер,
проверяет изменения на уязвимости и утечки, коммитит в рабочую ветку. Будит человека только когда без него
нельзя: нужно необратимое или внешнее действие, работа заблокирована, найден риск для безопасности или данных —
вопросом с кнопками «Да» / «Нет» в Telegram и в панели. Не больше {{iterations}} итераций за смену. Утром — отчёт
в REPORT.md: что сделано, что нет и почему, что ждёт решения.
"""
start = """Прочитай CLAUDE.md и PLAN.md этой папки. Если в PLAN.md нет задач — спроси меня через вопрос с вариантами, \
что делать этой ночью. Если задачи есть — перескажи план в 3–5 строках и спроси «Начинаю ночную смену?» \
с вариантами «Да» и «Нет»."""

[settings]
iterations = 20          # лимит итераций за смену; дошли — остановиться и написать отчёт
plan = "PLAN.md"
report = "REPORT.md"
branch = "night/"        # префикс рабочих веток: night/2026-11-02

[[integrations]]
id = "github"
why = "Задачи из issues и пулл-реквест утром. Без GitHub работа остаётся в локальной ветке — тоже можно."
optional = true

[[integrations]]
id = "linear"
why = "Взять задачи смены из трекера и отметить сделанное."
optional = true

[[schedule]]
at = "07:30"
title = "Утренний отчёт"
prompt = """Утро. Закончи текущий шаг (новый не начинай), допиши {{report}} по шаблону из CLAUDE.md и коротко \
доложи: что сделано, что не сделано и почему, что ждёт моего решения."""

[[decisions]]
question = "Нужно необратимое или внешнее действие — разрешаете?"
options = ["Да", "Нет"]
when = "push, деплой, миграция живой базы, удаление данных, письмо или платёж, установка в систему"

[[decisions]]
question = "Работа заблокирована — пропустить задачу и идти дальше?"
options = ["Да", "Нет"]
when = "нет доступа или ключа, противоречие в плане, проверка падает не по задаче после трёх попыток"

[[decisions]]
question = "Найден риск безопасности или данных — исправлять сейчас?"
options = ["Да", "Нет"]
when = "уязвимость, секрет в коде или истории, утечка персональных данных"
