# Роль «Поставщик ресторанов (HoReCa)» — формат: docs/SCENARIOS.md. Компания, рестораны и люди выдуманы.
title = "Поставщик ресторанов (HoReCa)"
short = "Свежая продукция ресторанам: остатки и урожай утром, дебиторка, «как обычно?», заказы из мессенджера."
industries = ["Поставщики HoReCa"]
offer = ["horeca"]
modules = ["horeca-harvest", "horeca-receivables", "horeca-reorder", "horeca-orders"]
who = """Вы возите ресторанам зелень, молочку, мясо. Шефы присылают заказ в мессенджер в 23:00 «как обычно», \
дебиторка растёт, а излишек с коротким сроком приходится списывать."""
without = """Ночные заказы вы переносите в таблицу утром — что-то теряется, что-то путается с прайсом. Кто из ресторанов \
забыл заказать в свой обычный день, видно, только когда он уже взял у другого. Дебиторку смотрите раз в неделю, \
стоп-отгрузку ставите, когда долг уже сверх всех лимитов. Излишек рукколы — в списание."""
needs = [
    "Прайс, остатки и список ресторанов с лимитами и отсрочками — выгрузка из 1С или таблицы",
    "История заказов за 2–3 месяца — чтобы агент увидел цикл каждого ресторана",
    "Взаиморасчёты — выгрузка из 1С раз в день",
    "Сообщения с заказами — пересылка в бота или папку пространства; отправка шефам — только после вашего «Да»",
]
first_step = """Пришлите выгрузку взаиморасчётов и список ресторанов с лимитами — через неделю в 9:00 будет дебиторка с \
вопросом «что делаем с просрочкой»; заказы и «как обычно?» подключаем следующими."""

[demo]
business = "Поставщик «Пример»"
point = "Основной склад"

[[moments]]
at = "07:00"
module = "horeca-harvest"
text = """Остатки и урожай (демо) · {{business}}
Свободный излишек: руккола 14 кг, годна до послезавтра. На четверг не хватает базилика: заказано 9 кг, будет 6.

Излишек: руккола 14 кг. Предложить ресторанам скидку 25 %?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме агент предложил бы рукколу со скидкой 25 % ресторанам, которые её берут, — после вашего «Да» на пачку."
[[moments.buttons]]
label = "Другая скидка"
result = "Агент спросил бы, какую скидку дать: 15, 25 или 40 %."
[[moments.buttons]]
label = "Списать или переработать"
result = "Агент отметил бы рукколу к списанию или переработке и убрал из предложений."
[[moments.buttons]]
label = "Нет"
result = "Агент ничего не предложит и напомнит завтра утром, если остаток останется."

[[moments]]
at = "09:00"
module = "horeca-receivables"
text = """Дебиторка на утро (демо): должны всего 1 240 000 ₽, просрочено 380 000 ₽ (31 %), больше 30 дней — 96 000 ₽.
Ресторан «Пример-1» (демо) сверх лимита и 41 день просрочки.

Стоп-отгрузка?"""
[[moments.buttons]]
label = "Стоп-отгрузка"
result = "Агент подготовил бы уведомление о стоп-отгрузке по шаблону и показал вам; отправляете вы."
[[moments.buttons]]
label = "Ещё напоминание"
result = "Агент отправил бы второе напоминание по лестнице — после вашего «Да»."
[[moments.buttons]]
label = "Позже"
result = "Агент спросит завтра."

[[moments]]
at = "11:00"
module = "horeca-reorder"
text = """По циклу пора заказывать 6 ресторанам. Первые: «Пример-3» (обычно по вторникам: молочка 12 кг, зелень 4 кг), «Пример-5», «Пример-7».
Текст: «Добрый день! Собираем заказ на завтра — как обычно?»

Напомнить 6 шефам о заказе?"""
[[moments.buttons]]
label = "Да"
result = "В рабочем режиме 6 шефов получили бы «как обычно?» с их обычным набором. Сейчас ничего не отправлено."
[[moments.buttons]]
label = "Нет"
result = "Агент ничего не отправит и проверит цикл завтра."

[[moments]]
at = "22:40"
module = "horeca-orders"
text = """Заказ «Пример-2» (демо) на завтра: 7 позиций, 14 200 ₽. Нет тимьяна 0,5 кг — замена: розмарин 0,5 кг.
Сообщение шефа: «на завтра базилик 2, руккола 3, сливки 33 % 6 л, тимьян пол кило…»

Что делаем?"""
[[moments.buttons]]
label = "Подтвердить"
result = "В рабочем режиме шеф получил бы подтверждение, заказ ушёл бы в лист сборки на утро."
[[moments.buttons]]
label = "Предложить замену"
result = "Агент предложил бы шефу розмарин вместо тимьяна и дождался ответа."
[[moments.buttons]]
label = "Изменить"
result = "Агент спросил бы, что поправить в позициях."
[[moments.buttons]]
label = "Отклонить"
result = "Агент подготовил бы вежливый отказ — отправка после вашего «Да»."

