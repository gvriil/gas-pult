<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Предложение GASTECH</title>
<link rel="icon" href="data:,">
<style>
  /* Предложение GASTECH (offers.py, docs/OFFERS.md). Токены — те же, что в начале index.html; никакого бренда клиента. */
  :root, :root[data-theme="light"] {
    --bg-canvas: #FFFFFF; --bg-surface: #FFFFFF; --bg-subtle: #F0F4F9;
    --border-subtle: #E1E5EA; --border-focus: #0B57D0;
    --text-primary: #1F1F1F; --text-secondary: #444746; --text-muted: #747775;
    --accent-primary: #0B57D0; --accent-soft: #D3E3FD; --on-accent: #FFFFFF;
    --status-running: #1E8E3E; --status-approval: #B26A00; --status-approval-bg: #FFF4D6;
    --status-success: #146C2E; --status-danger: #B3261E;
    --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 9999px;
    --shadow-sm: 0 1px 2px rgba(31,31,31,.06);
  }
  :root[data-theme="dark"] {
    --bg-canvas: #131314; --bg-surface: #1E1F20; --bg-subtle: #282A2C;
    --border-subtle: #3C4043; --border-focus: #A8C7FA;
    --text-primary: #E3E3E3; --text-secondary: #C4C7C5; --text-muted: #8E918F;
    --accent-primary: #A8C7FA; --accent-soft: #1B2B48; --on-accent: #062E6F;
    --status-running: #81C995; --status-approval: #FDD663; --status-approval-bg: #3A2E00;
    --status-success: #6DD58C; --status-danger: #F2B8B5;
    --shadow-sm: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg-canvas); color: var(--text-primary); font-variant-numeric: tabular-nums;
         font: calc(15px * var(--fz, 1))/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .5; cursor: default; }
  button:not(:disabled):active { transform: scale(.97); }
  [hidden] { display: none !important; }
  .i { width: 20px; height: 20px; flex: none; display: block; } .i.s16 { width: 16px; height: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .kicker { display: inline-flex; align-items: center; gap: 6px; font-size: calc(12px * var(--fz, 1)); font-weight: 600; letter-spacing: .06em;
            text-transform: uppercase; color: var(--accent-primary); background: var(--accent-soft); padding: 4px 10px; border-radius: var(--radius-pill); }
  h1 { font-size: calc(26px * var(--fz, 1)); line-height: 1.2; font-weight: 600; margin: 12px 0 6px; overflow-wrap: anywhere; }
  h2 { font-size: calc(19px * var(--fz, 1)); font-weight: 600; margin: 0 0 4px; }
  h3 { font-size: calc(16px * var(--fz, 1)); font-weight: 600; margin: 0; }
  .lead { color: var(--text-secondary); margin: 0 0 12px; }
  .muted { color: var(--text-muted); font-size: calc(13px * var(--fz, 1)); }
  section { margin: 28px 0 0; }
  .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 12px; }
  .pains { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
  .pains li { display: flex; gap: 10px; align-items: flex-start; background: var(--bg-subtle); border-radius: var(--radius-md); padding: 10px 12px; }
  .pains .i { color: var(--status-approval); margin-top: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: calc(12px * var(--fz, 1)); font-weight: 500; padding: 2px 8px; border-radius: var(--radius-pill);
          background: var(--bg-subtle); color: var(--text-secondary); white-space: nowrap; }
  .chip.demo { color: var(--status-approval); background: var(--status-approval-bg); margin: 0; padding: 2px 8px; border-radius: var(--radius-pill); }
  .mod-head { display: flex; gap: 12px; align-items: flex-start; }
  .mod-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-primary); flex: none; }
  .demo { margin-top: 14px; border-radius: var(--radius-md); background: var(--bg-subtle); padding: 12px; }
  .demo-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 600; font-size: calc(14px * var(--fz, 1)); }
  .kpi { width: 100%; border-collapse: collapse; font-size: calc(14px * var(--fz, 1)); }
  .kpi th, .kpi td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
  .kpi th { color: var(--text-muted); font-weight: 500; font-size: calc(12px * var(--fz, 1)); }
  .kpi td.num, .kpi th.num { text-align: right; white-space: nowrap; }
  .kpi tr:last-child td { border-bottom: 0; }
  .bad { color: var(--status-danger); } .good { color: var(--status-success); }
  .msg { background: var(--bg-surface); border-radius: 14px 14px 14px 4px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: calc(14px * var(--fz, 1)); border: 1px solid var(--border-subtle); }
  .q { margin-top: 12px; }
  .q p { margin: 0 0 8px; font-weight: 500; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 1px solid var(--border-subtle); background: var(--bg-surface); border-radius: var(--radius-pill); padding: 8px 14px; font-size: calc(14px * var(--fz, 1)); }
  .opt.on { border-color: var(--accent-primary); color: var(--accent-primary); background: var(--accent-soft); }
  .next { margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; font-size: calc(14px * var(--fz, 1)); color: var(--text-secondary); }
  .next .i { color: var(--accent-primary); margin-top: 1px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: var(--radius-pill); padding: 13px 18px;
         background: var(--accent-primary); color: var(--on-accent); font-weight: 600; text-decoration: none; min-height: 48px; }
  .btn.ghost { background: transparent; color: var(--accent-primary); border: 1px solid var(--border-subtle); }
  .btn.quiet { background: var(--bg-subtle); color: var(--text-primary); }
  .btn.danger { background: transparent; color: var(--status-danger); border: 1px solid color-mix(in srgb, var(--status-danger) 35%, var(--border-subtle)); }
  .btn.sm { min-height: 40px; padding: 8px 14px; width: auto; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; } .row > .btn { flex: 1 1 200px; }
  .note { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--radius-md); padding: 10px 12px; font-size: calc(14px * var(--fz, 1)); }
  .note.info { background: var(--accent-soft); } .note.info .i { color: var(--accent-primary); }
  .note.warn { background: var(--status-approval-bg); } .note.warn .i { color: var(--status-approval); }
  .note.bad { background: color-mix(in srgb, var(--status-danger) 12%, transparent); } .note.bad .i { color: var(--status-danger); }
  .note.ok { background: color-mix(in srgb, var(--status-success) 12%, transparent); } .note.ok .i { color: var(--status-success); }
  .field { margin: 12px 0 0; } .field label { display: block; font-weight: 600; font-size: calc(14px * var(--fz, 1)); margin: 0 0 4px; }
  select, input[type=text] { width: 100%; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 10px 12px; background: var(--bg-canvas); min-height: 44px; }
  select:focus, input:focus { outline: 2px solid var(--border-focus); outline-offset: 1px; }
  .drop { display: block; cursor: pointer; margin-top: 12px; border: 1.5px dashed var(--border-subtle); border-radius: var(--radius-md); padding: 18px 12px; text-align: center; color: var(--text-secondary); }
  .drop .i { margin: 0 auto; width: 28px; height: 28px; color: var(--accent-primary); }
  .demo-top > span:first-child, .q p { display: flex; gap: 6px; align-items: center; }
  .drop.over { border-color: var(--accent-primary); background: var(--accent-soft); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
  .stat { background: var(--bg-subtle); border-radius: var(--radius-md); padding: 10px 12px; min-width: 0; }
  .stat .l { color: var(--text-secondary); font-size: calc(12px * var(--fz, 1)); } .stat .v { font-size: calc(18px * var(--fz, 1)); font-weight: 600; overflow-wrap: anywhere; }
  .stat .n { color: var(--text-muted); font-size: calc(12px * var(--fz, 1)); }
  .tbl { margin: 14px 0 0; overflow-x: auto; } .tbl h3 { margin-bottom: 4px; font-size: calc(14px * var(--fz, 1)); }
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  details summary { cursor: pointer; padding: 8px 0; color: var(--accent-primary); font-weight: 500; }
  .steps { display: flex; gap: 6px; margin: 0 0 14px; } .steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--border-subtle); }
  .steps i.on { background: var(--accent-primary); }
  .terms ol { padding-left: 20px; margin: 8px 0 12px; } .terms li { margin: 0 0 6px; }
  .cc { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin: 10px 0; }
  .cc button, .pick { border: 1px solid var(--border-subtle); border-radius: 10px; padding: 9px 10px; background: var(--bg-surface); text-align: left; display: flex; justify-content: space-between; gap: 6px; }
  .cc button.on, .pick.on { border-color: var(--accent-primary); background: var(--accent-soft); }
  .pick { width: 100%; margin: 0 0 8px; flex-direction: column; } .pick span { color: var(--text-secondary); font-size: calc(13px * var(--fz, 1)); }
  a { color: var(--accent-primary); }
  footer { margin: 36px 0 0; color: var(--text-muted); font-size: calc(12px * var(--fz, 1)); text-align: center; }
  .spin { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (min-width: 900px) { .wrap { padding-top: 40px; } h1 { font-size: calc(32px * var(--fz, 1)); } }
  /* Дежурный помощник «? Подсказать» (docs/HELPER.md): пилюля вверху справа, шторка на 55 % высоты; гостю — только эта
     страница и мастер «Подключить» */
  .hpill { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 30; display: inline-flex; align-items: center; gap: 4px; height: 34px;
           padding: 0 12px 0 8px; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); background: var(--bg-surface); color: var(--accent-primary);
           font-size: calc(13px * var(--fz, 1)); font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.10); }
  .hpill .i { width: 18px; height: 18px; }
  /* на телефоне пилюля — в шапке страницы и уезжает с ней: поверх ползунков и кнопок при прокрутке не ложится */
  @media (max-width: 899px) { body { position: relative; } .hpill { position: absolute; } }
  .hbg { position: fixed; inset: 0; z-index: 40; background: rgba(17,17,16,.42); display: flex; align-items: flex-end; justify-content: center; }
  .hsheet { width: 100%; max-width: 640px; height: 55%; min-height: 320px; display: flex; flex-direction: column; background: var(--bg-surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(0,0,0,.2); }
  .hsheet h3 { display: flex; align-items: center; gap: 6px; margin: 4px 16px 2px; font-size: calc(13px * var(--fz, 1)); color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; }
  .hsheet .hwhere { margin: 0 16px 8px; color: var(--text-secondary); font-size: calc(13px * var(--fz, 1)); }
  .hsheet .hmsgs { flex: 1 1 auto; min-height: 90px; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .hsheet .hq { align-self: flex-end; max-width: 85%; background: var(--accent-soft); border-radius: 14px 14px 4px 14px; padding: 8px 12px; font-size: calc(14px * var(--fz, 1)); overflow-wrap: anywhere; }
  .hsheet .ha { background: var(--bg-subtle); border-radius: 14px 14px 14px 4px; padding: 10px 12px; overflow-wrap: anywhere; } .hsheet .ha p { margin: 0; }
  .hsheet .hnote { margin: 8px 0 0 !important; color: var(--status-approval); font-size: calc(13px * var(--fz, 1)); }
  .hsheet .hgo { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .hsheet .hgo button { display: flex; align-items: center; gap: 6px; text-align: left; padding: 10px 12px; border-radius: var(--radius-md); background: var(--bg-surface);
                        border: 1px solid var(--border-subtle); color: var(--accent-primary); font-weight: 600; font-size: calc(14px * var(--fz, 1)); }
  .hsheet .hfoot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .hsheet .hmark { font-size: calc(12px * var(--fz, 1)); color: var(--text-secondary); padding: 2px 8px; border-radius: var(--radius-pill); background: var(--bg-surface); }
  .hsheet .hfb { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; padding: 0; background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); }
  .hsheet .hfb .i { width: 16px; height: 16px; } .hsheet .hfb.on { color: var(--accent-primary); border-color: var(--accent-primary); background: var(--accent-soft); }
  .hsheet .hchips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 2px; scrollbar-width: none; flex: none; }
  .hsheet .hchips button { flex: none; padding: 7px 12px; border-radius: var(--radius-pill); background: var(--bg-subtle); border: 1px solid var(--border-subtle); font-size: calc(13px * var(--fz, 1)); white-space: nowrap; }
  .hsheet .hrow { display: flex; gap: 8px; padding: 8px 16px 2px; flex: none; }
  .hsheet .hrow input { flex: 1; min-width: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); padding: 10px 14px; background: var(--bg-canvas); font-size: calc(16px * var(--fz, 1)); }
  .hsheet .hsend { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 0; background: var(--accent-primary); color: var(--on-accent); padding: 0; }
  /* День с агентом и калькулятор пользы — та же роль, что в «Примерочной» панели (offers.role_for, scenarios.py) */
  .day { display: grid; gap: 10px; margin-top: 12px; }
  .when { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 8px; } .when .t { font-weight: 600; font-variant-numeric: tabular-nums; }
  .gain { display: grid; gap: 8px; } .gline { background: var(--bg-subtle); border-radius: var(--radius-md); padding: 10px 12px; }
  .gline .v { font-size: calc(18px * var(--fz, 1)); font-weight: 600; font-variant-numeric: tabular-nums; } .gline small { display: block; color: var(--text-muted); font-size: calc(12.5px * var(--fz, 1)); margin-top: 2px; }
  .calc-in { display: grid; gap: 4px; } .calc-in .field { margin: 10px 0 0; }
  .slide { display: flex; align-items: center; gap: 10px; } .slide input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent-primary); height: 32px; }
  .slide input[type=number] { width: 104px; flex: none; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 8px 10px; background: var(--bg-canvas); min-height: 40px; font-variant-numeric: tabular-nums; }
  .slide input[type=number].bad { border-color: var(--status-danger); } .slide .u { flex: none; color: var(--text-muted); font-size: calc(13px * var(--fz, 1)); min-width: 28px; }
  .calc-in .hint { color: var(--text-muted); font-size: calc(12.5px * var(--fz, 1)); margin-top: 2px; }
  .sub { margin: 16px 0 4px; font-size: calc(12px * var(--fz, 1)); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); }
  .hsheet .hclose { margin: 8px 16px 0; padding: 12px; border: 0; border-top: 1px solid var(--border-subtle); background: none; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Загружаю предложение…</p></div>
<button class="hpill" id="helpBtn" hidden aria-label="Подсказать: что делать на этой странице"></button>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const code = (location.pathname.match(/^\/offer\/([A-Za-z0-9_-]+)/) || [])[1] || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const P = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.3"/>',
  lock: '<rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
  wait: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', chat: '<path d="M4.5 5.5h15v10.5H10l-4.5 3.5v-3.5h-1z"/>',
  file: '<path d="M7 3.5h7l4.5 4.5v12.5H7z"/><path d="M14 3.5V8h4.5"/>', ext: '<path d="M14 4h6v6M20 4l-9 9M18.5 14v5.5h-14v-14H10"/>',
  puzzle: '<path d="M12 3.2l7.8 4.4v8.8L12 20.8l-7.8-4.4V7.6z"/><path d="M4.4 7.7L12 12l7.6-4.3M12 12v8.6"/>',
  bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>', send: '<path d="M4 12l16-7-6 15-2.5-6.5z"/>',
  trash: '<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>', refresh: '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5v4.5h-4.5"/>',
  next: '<path d="M9 6l6 6-6 6"/>', book: '<path d="M5 4.5h11a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M5 17.5a2 2 0 0 1 2-2h11"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.5 3.5 5.3 3.5 8.5s-1.1 6-3.5 8.5c-2.4-2.5-3.5-5.3-3.5-8.5s1.1-6 3.5-8.5z"/>',
  inbox: '<path d="M4 13.5l2.5-8h11l2.5 8v6H4z"/><path d="M4 13.5h5l1 2h4l1-2h5"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17.2v.1"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ""}</svg>`;
const note = (kind, icon, html) => `<div class="note ${kind}">${ic(icon)}<div>${html}</div></div>`;

function applyTheme() {
  const mode = params.get("theme") || "auto";
  const dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);

async function api(path, body, extra = {}) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", ...extra }, body: body instanceof Blob ? body : JSON.stringify(body) };
  if (body instanceof Blob) opt.headers = { "Content-Type": "application/octet-stream", ...extra };
  const r = await fetch(`/api/offer/${code}${path}`, { credentials: "same-origin", ...opt });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || `ошибка ${r.status}`);
  return d;
}
async function busy(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = ic("refresh", "spin") + esc(label);
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = old; }
}

let D = null, lastFile = null;
const KIND_ICON = { summary: "chart", reminder: "bell", request: "inbox" };

function demoCard(m) {
  const d = m.demo; let body = "";
  if (d.summary) {
    const s = d.summary;

// ---------- день с агентом и калькулятор пользы: та же роль, что в «Примерочной» панели; модель не вызывается ----------
/* benefit:start — тот же расчёт, что scenarios.benefit() в Python; тест сверяет */
function benefitCalc(s, vals) {
  const c = s.calculator;
  const num = (x, d) => { if (typeof x === "boolean" || x == null) return d; const v0 = typeof x === "string" ? x.trim().replace(",", ".") : x;
    if (v0 === "") return d; const v = Number(v0); return Number.isFinite(v) ? v : d; };
  const inp = {};
  for (const x of c.inputs) inp[x.id] = Math.min(x.max, Math.max(x.min, num(vals?.[x.id], x.default)));
  const rnd = (v, r) => Math.floor(v / r + 0.5) * r;
  const fmt = (v) => { const t = Math.floor(v * 10 + 0.5), w = Math.floor(t / 10), f = t % 10; return String(w).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (f ? "," + f : ""); };
  const lines = c.formulas.map((l) => {
    let base = 1; for (const k of l.of) base *= inp[k];
    const low = rnd(base * l.low, l.round), high = rnd(base * l.high, l.round);
    return { title: l.title, caption: l.caption, unit: l.unit, low, high, text: (low === high ? "≈ " + fmt(low) : fmt(low) + "–" + fmt(high)) + " " + l.unit, about: l.about };
  });
  return { inputs: inp, lines, disclaimer: c.assumptions_disclaimer };
}
/* benefit:end */
const CALC = {};                                       // значения ползунков; по умолчанию — из [demo] предложения

        <input data-num="${id}" type="number" inputmode="decimal" min="${x.min}" max="${x.max}" step="${x.step}" value="${esc(v)}" aria-label="${esc(x.title)}"><span class="u">${esc(x.unit)}</span></div>
      <div class="hint" id="cH_${id}">${esc(x.about)}</div></div>`; };
  return `<section id="day"><h2>День с агентом — ${esc(r.title.toLowerCase())}</h2>

function gain() {                                      // результат и рядом — допущения, из которых он посчитан
  const r = D.scenario; if (!r) return;
  const res = benefitCalc(r, CALC), byId = Object.fromEntries(r.calculator.inputs.map((x) => [x.id, x]));

  $("gain").innerHTML = res.lines.map((x, i) => {
    const used = r.calculator.formulas[i].of.filter((k) => byId[k].assumption).map((k) => `${byId[k].title.toLowerCase()} — ${fmtv(res.inputs[k])} ${byId[k].unit}`);
    return `<div class="gline"><div>${esc(x.title)}${x.caption ? ` <span class="chip demo">${esc(x.caption)}</span>` : ""}</div><div class="v">${esc(x.text)}</div>
      ${used.length ? `<small>Допущение: ${esc(used.join("; "))}</small>` : ""}<small>${esc(x.about)}</small></div>`;
  }).join("");
}

function bindUpload() {
  const drop = $("drop"), inp = $("file");
  inp.addEventListener("change", () => { if (inp.files[0]) send(inp.files[0]); inp.value = ""; });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); });
}
async function send(file, mapping, kind) {
  lastFile = file;
  if (file.size > D.upload.max_mb * 1048576) { $("repOut").innerHTML = note("bad", "warn", `Файл больше ${D.upload.max_mb} МБ — выгрузите период покороче.`); return; }
  $("repOut").innerHTML = `<div style="margin-top:12px">${note("info", "wait", "Считаю сводку…")}</div>`;
  const extra = { "X-Offer-Kind": $("kind").value || kind || "" };
  if (mapping) extra["X-Offer-Map"] = JSON.stringify(mapping);
  try {
    const r = await api("/upload", file, extra);
    if (r.error) { $("repOut").innerHTML = `<div style="margin-top:12px">${note("warn", "warn", esc(r.error))}</div>${mapUI(r)}`; bindMap(r); return; }
    D.session.reports = [r, ...D.session.reports.filter((x) => x.kind !== r.kind)];
    renderReports(r.kind);
  } catch (e) { $("repOut").innerHTML = `<div style="margin-top:12px">${note("bad", "warn", esc(e.message))}</div>`; }
}

}

  $("wBack")?.addEventListener("click", () => wizard(step - 1));
  $("wTerms")?.addEventListener("click", (e) => save(e.currentTarget, { step: "terms", version: D.terms.version }));
  document.querySelectorAll("[data-cc]").forEach((b) => b.addEventListener("click", () => save(b, { step: "country", code: b.dataset.cc })));
  $("ccGo")?.addEventListener("click", (e) => save(e.currentTarget, { step: "country", code: $("ccCode").value.trim() }));
  document.querySelectorAll("[data-mod]").forEach((b) => b.addEventListener("click", () => save(b, { step: "module", id: b.dataset.mod })));
  $("wLogin")?.addEventListener("click", (e) => busy(e.currentTarget, "Готовлю вход…", async () => {
    try {
      const d = await api("/login", {});
      window.open(d.link, "_blank", "noopener");
      $("wLoginOut").innerHTML = `<div style="margin-top:10px">${note("info", "wait", `В Telegram нажмите «Запустить» (Start). Владелец пульта получит запрос; когда он ответит, бот напишет вам, а эта страница откроет панель сама. <a href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">Открыть Telegram ещё раз</a>`)}</div>`;
      clearInterval(tgTimer); const t0 = Date.now();
      tgTimer = setInterval(async () => {
        if (Date.now() - t0 > d.ttl * 1000) { clearInterval(tgTimer); $("wLoginOut").innerHTML = `<div style="margin-top:10px">${note("warn", "wait", "Запрос у владельца. Когда бот напишет, что доступ дан, нажмите «Войти через Telegram» ещё раз.")}</div>`; return; }
        try {
          const r = await (await fetch("/api/login/tg?id=" + encodeURIComponent(d.id), { credentials: "same-origin" })).json();
          if (r.state === "ok") { clearInterval(tgTimer); location.href = "/"; }
          else if (r.state === "no") { clearInterval(tgTimer); $("wLoginOut").innerHTML = `<div style="margin-top:10px">${note("bad", "warn", "Вход отклонён в Telegram.")}</div>`; }
        } catch (err) { /* сеть моргнула — повторим через 3 с */ }
      }, 3000);
    } catch (err) { $("wLoginOut").innerHTML = `<div style="margin-top:10px">${note("bad", "warn", esc(err.message))}</div>`; }
  }));
}

// ---------- дежурный помощник «?» (docs/HELPER.md) ----------
// Гостю — только экраны этой страницы и шаги мастера; сервер сам знает, чьё это предложение (по коду страницы), и
// отвечает подсказками из карты экранов — без модели.
const OFFER_SCREENS = ["offer.connect.terms", "offer.connect.country", "offer.connect.module", "offer.connect.login"];
function offerScreen() {
  const seen = (id) => { const el = $(id); if (!el) return false; const r = el.getBoundingClientRect(); return r.top < innerHeight * 0.55 && r.bottom > 80; };
  if (seen("connect")) return OFFER_SCREENS[wizStep] || "offer.connect.terms";
  if (seen("upload")) return "offer.upload";
  if (seen("mods")) return "offer.modules";
  return "offer.top";
}
function helpContext() { return { screen: offerScreen(), step: String(wizStep), module: (D?.session?.wizard || {}).module || "" }; }
function wizGo(n) {
  const w = D.session.wizard || {}, max = !w.terms ? 0 : !w.country ? 1 : !w.module ? 2 : 3;
  wizard(Math.min(n, max)); $("connect").scrollIntoView({ behavior: "smooth" });
}
const OFFER_GO = {                                     // действие карты → место на странице
  "go:offer.top": () => window.scrollTo({ top: 0, behavior: "smooth" }),
  "go:offer.modules": () => $("mods").scrollIntoView({ behavior: "smooth" }),
  "go:offer.telegram": () => { const b = document.querySelector("[data-tg]"); if (b) { b.scrollIntoView({ behavior: "smooth", block: "center" }); b.focus({ preventScroll: true }); } },
  "go:offer.upload": () => $("upload").scrollIntoView({ behavior: "smooth" }),
  "go:offer.connect": () => wizGo(9),
  "go:offer.connect.terms": () => wizGo(0),
  "go:offer.connect.country": () => wizGo(1),
  "go:offer.connect.module": () => wizGo(2),
  "go:offer.connect.login": () => wizGo(3),
};
function go(id) { const f = OFFER_GO[id]; document.querySelector(".hbg")?.remove(); $("helpBtn").hidden = false; if (f) f(); }
function helpAnswer(r) {
  const box = document.createElement("div"); box.className = "ha"; box.dataset.id = r.id;
  box.innerHTML = `<p>${esc(r.text)}</p>
    ${r.actions.length ? `<div class="hgo">${r.actions.map((a) => `<button data-hgo="${esc(a.id)}">${ic("next", "s16")}Перейти: ${esc(a.title)}</button>`).join("")}</div>` : ""}
    <div class="hfoot"><span class="hmark">Подсказка</span>
      <button class="hfb" data-fb="1" aria-label="Помогло">${ic("check")}</button><button class="hfb" data-fb="0" aria-label="Не помогло">${ic("x")}</button></div>`;
  return box;
}
async function helpAsk(bg, body, label) {
  const msgs = bg.querySelector(".hmsgs");
  if (label) msgs.insertAdjacentHTML("beforeend", `<div class="hq">${esc(label)}</div>`);
  const wait = document.createElement("div"); wait.className = "ha"; wait.textContent = "Думаю…"; msgs.append(wait);
  try {
    const r = await api("/help", { ctx: bg.ctx, ...body });
    wait.replaceWith(helpAnswer(r));
    bg.querySelector(".hwhere").textContent = "Где вы: " + r.title;
    bg.querySelector(".hchips").innerHTML = r.chips.filter((c) => c.id !== body.chip).map((c) => `<button data-chip="${esc(c.id)}">${esc(c.label)}</button>`).join("");
  } catch (e) { wait.innerHTML = `<p class="hnote">${esc(e.message)}</p>`; }
  msgs.scrollTop = msgs.scrollHeight;
}
function openHelp() {
  if (document.querySelector(".hbg")) return;
  const bg = document.createElement("div"); bg.className = "hbg"; bg.ctx = helpContext();
  bg.innerHTML = `<div class="hsheet" role="dialog" aria-label="Помощник"><h3>${ic("help", "s16")}Помощник</h3><div class="hwhere"></div>
    <div class="hmsgs" aria-live="polite"></div><div class="hchips"></div>
    <form class="hrow"><input name="q" maxlength="500" autocomplete="off" placeholder="Спросите, что непонятно…" aria-label="Вопрос помощнику">
      <button class="hsend" type="submit" aria-label="Спросить">${ic("send")}</button></form><button class="hclose" data-close>Закрыть</button></div>`;
  bg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (e.target === bg || b?.hasAttribute("data-close")) { bg.remove(); $("helpBtn").hidden = false; return; }
    if (!b) return;
    const id = b.closest(".ha")?.dataset.id;
    if (b.dataset.chip) return helpAsk(bg, { chip: b.dataset.chip }, b.textContent);
    if (b.dataset.fb) { b.parentElement.querySelectorAll(".hfb").forEach((x) => x.classList.toggle("on", x === b)); api("/helpfb", { id, useful: b.dataset.fb === "1" }).catch(() => {}); return; }
    if (b.dataset.hgo) { api("/helpfb", { id, action: b.dataset.hgo }).catch(() => {}); go(b.dataset.hgo); }
  });
  bg.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault(); const inp = e.target.q, q = inp.value.trim(); if (!q) return; inp.value = ""; helpAsk(bg, { q }, q);
  });
  document.body.append(bg); $("helpBtn").hidden = true;
  helpAsk(bg, { chip: "what" });
}
$("helpBtn").innerHTML = ic("help") + "Подсказать";
$("helpBtn").addEventListener("click", openHelp);

(async () => {
  try { D = await api(""); render(); $("helpBtn").hidden = false; if (location.hash === "#connect") $("connect").scrollIntoView(); }
  catch (e) { $("app").innerHTML = `<h1>Страница не найдена</h1><p class="lead">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
