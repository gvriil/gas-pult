# Модуль «Отзывы по филиалам» (автомойки и шиномонтаж, сеть) — формат файла: docs/MODULES.md
id = "carwash-reviews"
version = "1.0"
title = "Отзывы во всех карточках филиалов"
industry = "Автомойки и шиномонтаж (сеть)"
sections = ["comms"]
about = "Черновики ответов на отзывы во всех картах по каждому филиалу; негатив — сразу управляющему филиала; публикует человек."
description = """
Дважды в день агент собирает новые отзывы по карточкам всех филиалов сети: Google Business Profile — через
официальный API (ответ публикуется после «Да»); Яндекс Карты / Яндекс Бизнес и 2ГИС — по выгрузке или отчёту из
кабинета в data/reviews.csv (публичного API ответов на отзывы у них не нашли на 02.11.2026 — ответ публикует человек
в кабинете). Негатив (1–3 звезды, повреждение машины, «поцарапали», «верните деньги») — сразу отдельным вопросом
управляющему филиала. Остальное — пачкой «Опубликовать N ответов?». Отзывы от имени клиентов агент не пишет, без
скрейпинга карт. Для клиентов в РФ сессия только на российской модели (GigaChat или YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md, data/branches.csv, data/facts.md и data/reviews.csv (пример выдуманный). Подготовь \
черновики ответов (навыки branch-reviews, review-reply), негатив — отдельным вопросом; ничего не публикуй."""
uses = ["reviews"]

[settings]
reviews = "data/reviews.csv"
branches = "data/branches.csv"
facts = "data/facts.md"
signature = "Команда автомойки"
batch_max = 30

[[integrations]]
id = "google-business-profile"
title = "Google Business Profile API — отзывы"
why = "Читать отзывы по карточкам филиалов и публиковать одобренные ответы (reviews.list, reviews.updateReply). Только для подтверждённых карточек."
how = "Google Cloud: доступ к Business Profile APIs (заявка Google), OAuth со scope business.manage от аккаунта владельца карточек; MCP-сервер — панель → Интеграции → «Свой сервер (адрес)». Проверьте, доступны ли кабинет и API для ваших филиалов."
optional = true

[[integrations]]
id = "yandex-business-export"
title = "Яндекс Бизнес — отзывы (выгрузка, без API)"
why = "Публичного API для ответов на отзывы не нашли: отзывы — выгрузкой или списком в data/reviews.csv, ответ публикует человек в кабинете."
how = "Кабинет Яндекс Бизнеса → отзывы по каждому филиалу → перенести новые в data/reviews.csv (вручную или выгрузкой, если кабинет её даёт)."
optional = true

[[integrations]]
id = "2gis-export"
title = "2ГИС — отзывы (выгрузка, без API)"
why = "То же для 2ГИС: публичного API ответов не нашли, ответ публикует человек в кабинете 2ГИС или приложении для бизнеса."
how = "Кабинет 2ГИС → отзывы филиалов → новые в data/reviews.csv. Логин и пароль кабинета агенту не даём."
optional = true

[[data_sources]]
title = "Отзывы Google по карточкам филиалов"
kind = "official_api"
about = "Google Business Profile API (developers.google.com/my-business), OAuth владельца карточек"

[[data_sources]]
title = "Отзывы Яндекс Карт и 2ГИС: data/reviews.csv"
kind = "client_export"
about = "из кабинетов сети (Яндекс Бизнес, 2ГИС) — выгрузка или ручной перенос; без парсинга карт"

[[data_sources]]
title = "Филиалы, управляющие, факты: data/branches.csv, data/facts.md"
kind = "client_export"
about = "от сети: часы, услуги, гарантии, как оформить претензию"

[[schedule]]
at = "10:00"
title = "Отзывы филиалов — утро"
prompt = """Собери новые отзывы по всем карточкам филиалов (навык branch-reviews), подготовь черновики (review-reply). \
Негатив — сразу отдельным вопросом управляющему филиала; остальное — «Опубликовать N ответов?». Без «Да» не публикуй."""

[[schedule]]
at = "17:00"
title = "Отзывы филиалов — вечер"
prompt = """Новые отзывы с утра — как утром (branch-reviews, review-reply). Без «Да» не публикуй; новых нет — одна строка."""

[[decisions]]
question = "Опубликовать N ответов? (по филиалам и площадкам, первый ответ)"
options = ["Опубликовать все", "По одному", "Нет"]
when = "дважды в день после черновиков"

[[decisions]]
question = "Негатив ★1–3 по <филиал> (<площадка>): суть — ответ готов, что делаем?"
options = ["Опубликовать", "Изменить", "Не отвечать", "Позвонить клиенту"]
when = "сразу, как пришёл негатив; вопрос — управляющему филиала"
