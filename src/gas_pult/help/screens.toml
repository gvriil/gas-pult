# Карта экранов дежурного помощника (helper.py, docs/HELPER.md).
#
# Формат — TOML: ядро пульта — только стандартная библиотека Python, парсер TOML (tomllib) в ней есть, YAML — нет.
#
# [[action]] — именованный переход («Перейти: …»). Модель не придумывает ссылки: она может вернуть только id отсюда,
#   сервер сверяет каждый id с картой и ролью. Поля: id, title, roles. Обработчик — go(id) панели (index.html) или
#   страницы предложения (offer.html); тест сверяет, что он есть и открывает реальный экран.
# [[faq]] — общие частые вопросы (на любом экране роли): id, q, a, actions, roles.
# [[screen]] — экран, лист или шаг мастера: id, where (panel | offer), title, roles, purpose, steps, next
#   (куда дальше — id действий), chips (id вопросов-подсказок; «Что здесь делать?» есть всегда), [[screen.faq]].
# Роли: owner — владелец, member — участник, viewer — наблюдатель, guest — гость страницы предложения,
#   anon — ещё не вошёл (экран входа). Гостю — только экраны offer.* и действия go:offer.*.
# Только реальные экраны: новый экран — сначала в панели, потом сюда (тест проверит оба направления).
#
# [[persona]] — роль интерфейса (personas.py): tone / tone_en — тон ответов модели (итерация 2), [[persona.faq]] — её
#   вопросы, первыми чипами на любом экране (на двух языках). У [[action]] — required_cap: возможность, без которой
#   экрана нет; помощник предложит «Включить и перейти», если права позволяют, иначе переход не покажет.
#
# Тексты — коротко, по-русски, без путей, ключей, адресов серверов и команд терминала: их видит каждый.

