# Модуль «Долги и суды» (пакет «УК-старт») — формат файла: docs/MODULES.md
id = "uk-debts"
version = "1.0"
title = "Долги и суды"
industry = "Управляющие компании — «УК-старт»"
sections = ["analytics", "docs", "comms"]
about = "Должники по ступеням: напоминание, претензия, судебный приказ, дело, исполнение; пени по ЖК РФ — юрист только подписывает."
description = """
Для управляющей организации (РФ). Агент разбирает долги собственников за жилое помещение и коммунальные услуги по
выгрузке начислений и оплат (data/), считает пени по ч. 14 ст. 155 ЖК РФ скриптом (1/300 ставки ЦБ с 31-го по 90-й
день, 1/130 с 91-го, с предельной ставкой 9,5 % по ПП РФ № 329 и мораториями — таблицы в data/) и ведёт должников
по ступеням: напоминание (через {{remind_after_days}} дн.) → досудебная претензия (просрочка от
{{claim_after_days}} дн. и долг от {{claim_min_sum}} ₽) → заявление о вынесении судебного приказа (гл. 11 ГПК РФ, до
{{order_max_sum}} ₽, госпошлина по ст. 333.19 НК РФ — скриптом) → дело → исполнительное производство. На следующую
ступень — только после «Да» человека; претензии и заявления — черновики, юрист проверяет и подписывает. Статусы дел
агент не собирает с сайтов судов и ФССП: человек вносит их в data/cases.csv, агент напоминает проверить по ссылке.
Сверено 02.11.2026 — сверять с КонсультантПлюс. Сессия — только на российской модели (GigaChat или YandexGPT,
docs/RU-MODELS.md): долги собственников — персональные данные, 152-ФЗ, хранение в РФ.
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Посчитай долг и пени по всем счетам скриптом penalty.py \
(навык penalty-calc) на сегодня и разложи должников по ступеням (debt-ladder) — ничего не отправляй и ступени не меняй."""
uses = ["receivables", "documents", "deadlines", "reminders"]

[settings]
debtors = "data/debtors.csv"
charges = "data/charges.csv"
payments = "data/payments.csv"
cases = "data/cases.csv"
remind_after_days = 10      # напоминание — через N дней после срока оплаты
claim_after_days = 60       # претензия — при просрочке самого старого долга от N дней…
claim_min_sum = 5000        # …и долге от N ₽
order_after_days = 30       # заявление о приказе — через N дней после вручения претензии без оплаты
order_max_sum = 500000      # ст. 121 ГПК РФ: приказ — если требование не больше 500 000 ₽
case_check_days = 7         # напомнить проверить статус дела или ИП — раз в N дней
message_gap_days = 7        # одному должнику — не чаще раза в N дней
region = "РФ"

[[integrations]]
id = "billing-export"
title = "Выгрузка начислений и оплат (биллинг УК, 1С)"
why = "Начисления и оплаты по лицевым счетам для долга и пеней. Без неё — data/charges.csv и data/payments.csv вручную."
how = "Из биллинга УК или 1С — выгрузка «начисления и оплаты по лицевым счетам» в CSV в data/ раз в день (или раз в неделю)."
optional = true

[[integrations]]
id = "gmail"
why = "Напоминания собственникам с согласием на сообщения и письма юристу. Без него — черновики в outbox/."
optional = true

[[data_sources]]
title = "Начисления и оплаты: data/charges.csv, data/payments.csv"
kind = "client_export"
about = "выгрузка биллинга или 1С самой УК"

[[data_sources]]
title = "Должники и ступени: data/debtors.csv"
kind = "client_export"
about = "реестр УК; ступень меняется только после «Да»"

[[data_sources]]
title = "Ставки ЦБ и ограничения пеней: data/key_rate.csv, data/penalty_rules.csv"
kind = "client_export"
about = "человек дописывает новую ставку с cbr.ru и новые постановления — агент их не скачивает"

[[data_sources]]
title = "Дела и исполнительные производства: data/cases.csv"
kind = "client_export"
about = "статусы вносит человек по официальным ссылкам (сайт суда, банк данных ФССП) — без скрейпинга"

[[schedule]]
at = "09:30"
days = [1, 3]
title = "Должники и ступени"
prompt = """Посчитай долг и пени на сегодня (penalty-calc), разложи должников по ступеням (debt-ladder): кандидатов \
на переход — вопросом, по каждому отдельно или пачкой до 5. Дела и ИП со сроком проверки сегодня — строкой со ссылкой \
(case-watch). Итог — DEBTS.md. Без «Да» ничего не отправляй, ступени не меняй, документы — только черновики."""

[[decisions]]
question = "ЛС-000-01: долг <сумма> ₽ за <периоды>, пени <сумма> ₽. Перевести на «<следующая ступень>»?"
options = ["Да", "Нет", "Отложить на 14 дней", "Рассрочка"]
when = "должник дошёл до порога следующей ступени"

[[decisions]]
question = "Заявление о вынесении судебного приказа по <лс> готово (черновик): долг, пени, пошлина — что дальше?"
options = ["Передать юристу", "Изменить", "Оставить"]
when = "после «Да» на ступень «заявление о выдаче судебного приказа»"

[[decisions]]
question = "Приказ по <лс> отменён (возражения должника). Переходим к исковому порядку?"
options = ["Да, готовить иск (юрист)", "Нет", "Позже"]
when = "человек внёс в data/cases.csv отмену приказа или отказ в принятии"

[[decisions]]
question = "Отправить пачку из N напоминаний о долге? Первые: <лс>"
options = ["Да", "Нет"]
when = "ступень «напоминание», после «Да» на переход"
