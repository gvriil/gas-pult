text = """💬 Напоминание клиенту (демо)
«Олег, добрый день! Давно не видели вас в «{{point}}». Будем рады снова помыть машину — ответьте, когда удобно. Не хотите таких сообщений — ответьте «стоп»».

Не были 30–45 дней и дали согласие: {{n}} клиентов. Отправить пачку из {{n}}?"""
buttons = ["Отправить", "Показать первых трёх", "Не сейчас"]
replies = ["В рабочем режиме сообщения ушли бы {{n}} клиентам — только с согласием на рассылку, через канал сети. Сейчас ничего не отправлено.", "Агент показал бы: Олег (демо) — 38 дней, Анна (демо) — 41 день, Павел (демо) — 44 дня; и спросил бы снова.", "Агент ничего не отправит и спросит завтра."]

[[demo.telegram]]
text = """📊 Утренние цифры (демо) · {{business}}
Вчера: 142 визита, вернулись после напоминаний — 9, допродажа детейлинга — 6 из 40 предложений (15 %).
Хуже всего возврат в «{{point}}»: 2 из 14."""
buttons = []
replies = []

