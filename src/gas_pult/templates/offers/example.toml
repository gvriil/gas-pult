# Пример предложения GASTECH — компания выдуманная. Формат и безопасность: docs/OFFERS.md.
#
# Настоящие предложения — только вне репозитория: ~/.config/gas-pult/offers/<код>.toml (права 0600).
# Создаёт их команда (она же придумывает неугадываемый код и печатает ссылку):
#   gas-pult offer new путь/к/файлу.toml --url https://<адрес панели>
#   gas-pult offer new --name "Имя бизнеса" --url https://<адрес панели>     # этот пример с другим именем

# Имя бизнеса — просто текст: на странице будет «Предложение GASTECH для <имя>». Логотипов, цветов и доменов
# клиента на странице нет и быть не должно.
business = "Автомойка «Пример»"

# Отрасль — для выдуманных демо-данных: carwash, fitness, horeca, uk, sellers, services (generic — то же, что services).
industry = "carwash"

# Что болит — 1–6 строк, как сказал сам клиент на встрече.
pains = [
    "Утром не видно, как вчера сработал каждый филиал — цифры собираем вручную к обеду.",
    "Клиенты пропадают после 2–3 моек, и никто не напоминает им вернуться.",
    "Отзывы на картах висят без ответа по неделе.",
]

# 1–3 модуля из каталога (id — как в /modules бота или «Из модуля» в панели).
modules = ["carwash-morning", "carwash-return", "carwash-reviews"]

# Последний день, когда ссылка работает (необязательно). После — та же страница 404, что и на неизвестный код.
expires = "2026-12-31"

# Внутренняя заметка — клиенту не показывается никогда.
note = "Встреча 05.11, контакт — через знакомого (пример)."

# Выдуманные, но «похожие на его» данные для живого демо (необязательно — иначе берутся типичные для отрасли).
[demo]
points = ["Север", "Центр", "Юг"]          # филиалы / точки / клубы — 1–8 названий (выдуманные или обобщённые)
point_word = "филиал"                      # как называть точку в демо
avg_check = 1400                           # средний чек, ₽
daily_revenue = 60000                      # выручка точки в день, ₽
clients = 1500                             # клиентов в базе — от этого число «пачки» напоминаний
items = ["Мойка кузова", "Комплекс", "Химчистка салона", "Полировка"]   # услуги / позиции
