# Модуль «Сверка раскрытия в ГИС ЖКХ» (пакет «УК-старт») — формат файла: docs/MODULES.md
id = "uk-gis-disclosure"
version = "1.0"
title = "Сверка раскрытия в ГИС ЖКХ"
industry = "Управляющие компании — «УК-старт»"
sections = ["docs"]
about = "Раз в месяц: чек-лист раскрытия против выгрузки из ГИС ЖКХ — что не размещено или просрочено, директору с «Поручить?»."
description = """
Для управляющей организации (РФ). В {{workday}}-й рабочий день месяца агент сверяет чек-лист раскрытия информации
(data/disclosure_checklist.csv: что, по какому дому, периодичность, срок, основание) с выгрузкой из ГИС ЖКХ, которую
делает сотрудник УК (data/gis_export.csv), и даёт директору список «что не размещено или размещено с опозданием»
с вопросом «Поручить?». В ГИС ЖКХ агент не заходит и ничего там не размещает. Основание — ч. 10.1 ст. 161 ЖК РФ,
209-ФЗ о ГИС ЖКХ и приказ Минстроя России от 07.02.2024 № 79/пр (заменил приказ № 74/114/пр). Сроки чек-листа с
пометкой «сверить» — пример: перед работой юрист сверяет их с действующей редакцией № 79/пр в КонсультантПлюс.
Итог — DISCLOSURE.md, его читает утренняя сводка директора. Сессия — только на российской модели (GigaChat или
YandexGPT, docs/RU-MODELS.md).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Сверь чек-лист с выгрузкой скриптом disclosure_check.py \
(навык disclosure-check) на сегодня и покажи, что не размещено, — никому не поручай."""
uses = ["deadlines"]

[settings]
checklist = "data/disclosure_checklist.csv"
export = "data/gis_export.csv"
houses = "data/houses.csv"
workday = 1           # в какой рабочий день месяца сверять
months = 3            # за сколько месяцев смотреть сроки
region = "РФ"

[[integrations]]
id = "gis-zhkh-export"
title = "Выгрузка из ГИС ЖКХ (делает сотрудник УК)"
why = "Что и когда размещено по домам. Без неё сверять не с чем — агент попросит выгрузку."
how = "ГИС ЖКХ (dom.gosuslugi.ru), кабинет УК → реестры и отчёты по размещению → выгрузка в Excel/CSV в data/ перед сверкой; или ведите data/gis_export.csv вручную."
optional = true

[[data_sources]]
title = "Чек-лист раскрытия: data/disclosure_checklist.csv"
kind = "client_export"
about = "что, срок, периодичность, основание — ведёт и сверяет УК"

[[data_sources]]
title = "Размещённое в ГИС ЖКХ: data/gis_export.csv"
kind = "client_export"
about = "выгрузка сотрудника УК — без автоматического входа в кабинет и без скрейпинга"

[[schedule]]
workday = 1
at = "09:00"
title = "Сверка раскрытия в ГИС ЖКХ"
prompt = """Ежемесячная сверка раскрытия (навык disclosure-check): выгрузка старше 3 дней — сначала попроси свежую. \
Итог — DISCLOSURE.md и копия в history/; директору — вопрос «Поручить?» по не размещённому. В ГИС ЖКХ не заходи."""

[[decisions]]
question = "ГИС ЖКХ: не размещено N (первое: <что, дом, срок>), с опозданием M. Поручить?"
options = ["Поручить всё ответственному", "Поручить по пунктам", "Уже размещено — обновлю выгрузку", "Позже"]
when = "после ежемесячной сверки, если есть не размещённое"

[[decisions]]
question = "Выгрузка из ГИС ЖКХ от <дата> — старая. Сверять по ней или подождать новую?"
options = ["Подождать новую", "Сверять по старой"]
when = "выгрузка старше 3 дней"
