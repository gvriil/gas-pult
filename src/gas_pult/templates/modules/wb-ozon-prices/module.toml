# Модуль «Ценовой страж WB и Ozon» — формат файла: docs/MODULES.md
id = "wb-ozon-prices"
version = "1.0"
title = "Ценовой страж WB и Ozon"
industry = "Селлеры WB и Ozon"
sections = ["analytics"]
about = "Ловит цену ниже минимальной, маржу ниже порога и скачки цены после акций площадки; изменить цену решаете вы."
description = """
Дважды в день агент сверяет цены продажи на Wildberries и Ozon (официальный API или выгрузка data/prices.csv)
с вашей экономикой: себестоимость, комиссия, логистика, минимальная цена (data/prices.csv). Сигнал, если цена ниже
минимальной, маржа ниже {{min_margin}} %, цена изменилась больше чем на {{jump}} % со вчерашнего дня (акция площадки,
ошибка в скидке), или товар попал в акцию в минус. Агент предлагает цену — «Изменить цену X → Y?» —
и меняет её через API только после «Да», не больше чем на {{max_step}} % за раз. Цены конкурентов не собирает.
"""
start = """Прочитай CLAUDE.md и data/prices.csv (пример выдуманный). Проверь цены навыком price-guard и покажи, \
где маржа ниже порога, — ничего не меняй."""

[settings]
prices = "data/prices.csv"
min_margin = 15
jump = 10
max_step = 10

[[integrations]]
id = "wb-api"
title = "Wildberries API — «Цены и скидки»"
why = "Читать текущие цены и скидки и менять цену после вашего «Да». Без него — выгрузка и файл для загрузки в кабинет."
how = "Кабинет продавца WB → доступ к API → токен с категорией «Цены и скидки». MCP-сервер — панель → Интеграции → «Свой сервер (адрес)»."
optional = true

[[integrations]]
id = "ozon-seller-api"
title = "Ozon Seller API — цены"
why = "Текущие цены, комиссии и участие в акциях Ozon; изменение цены после «Да»."
how = "Кабинет продавца Ozon → Seller API: Client-Id и API-ключ с правами на цены; MCP-сервер — «Свой сервер (адрес)»."
optional = true

[[data_sources]]
title = "Цены, скидки и акции Wildberries"
kind = "official_api"
about = "API «Цены и скидки», dev.wildberries.ru — ключ продавца"

[[data_sources]]
title = "Цены, комиссии и акции Ozon"
kind = "official_api"
about = "Ozon Seller API (docs.ozon.ru/api/seller) — Client-Id и API-ключ продавца"

[[data_sources]]
title = "Экономика товара: data/prices.csv"
kind = "client_export"
about = "себестоимость, минимальная цена, комиссия и логистика — из учёта продавца"

[[schedule]]
at = "09:30"
title = "Ценовой страж — утро"
prompt = """Проверь цены (навык price-guard): свежие цены из API или data/, сигналы, PRICES.md. По каждому сигналу \
— вопрос «Изменить цену X → Y?». Без «Да» ничего не меняй."""

[[schedule]]
at = "15:30"
title = "Ценовой страж — после обеда"
prompt = """Повтори проверку цен (навык price-guard) — только новые сигналы с утра. Без «Да» ничего не меняй."""

[[decisions]]
question = "<артикул> на <площадка>: маржа <m> % (порог — 15 %). Изменить цену X → Y?"
options = ["Да", "Другая цена", "Нет"]
when = "цена ниже минимальной, маржа ниже порога, скачок цены"

[[decisions]]
question = "<артикул> в акции площадки в минус (маржа <m> %). Что делаем?"
options = ["Выйти из акции", "Остаться", "Поднять цену до акции"]
when = "товар попал в акцию площадки, маржа ниже порога"
