# Модуль «Пропал» (фитнес-клубы, семейные) — формат файла: docs/MODULES.md
id = "fitness-lapsed"
version = "1.0"
title = "«Пропал»: мягкий возврат"
industry = "Фитнес-клубы (семейные)"
about = "2–3 недели без посещений — мягкое сообщение; хочет уйти — заморозка по «Да»."
description = """
Каждый день агент смотрит посещения (data/visits.csv) участников с действующей картой. Кто не был от {{lapse_from}}
до {{lapse_to}} дней — мягкое сообщение без давления и акций («всё ли в порядке, чем помочь»), одному участнику не
чаще раза в {{min_gap_days}} дней. Дольше {{lapse_to}} дней — в список звонков менеджеру. Ответил «хочу отказаться» —
агент не спорит: человеку вопрос «Предложить заморозку N дней?» (дни — по правилам клуба для типа карты, скрипт
lapsed.py); заморозку оформляет администратор после «Да», отказ — тоже администратор, без затягивания. Пачка
уходит только после «Отправить пачку из N?» — «Да». Для клиентов в РФ — российская модель (GigaChat или YandexGPT,
docs/RU-MODELS.md), хранение в РФ (152-ФЗ).
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Запусти lapsed.py на 2026-11-02 (навык lapsed-segment) \
и покажи, кому написали бы и кому позвонить, — ничего не отправляй."""
uses = ["reminders"]

[settings]
members = "data/members.csv"
visits = "data/visits.csv"
lapse_from = 14               # дней без посещений — мягкое сообщение
lapse_to = 21                 # дольше — звонок менеджера, не сообщение
min_gap_days = 14             # одному участнику — не чаще раза в N дней
freeze = "12 мес.:30;6 мес.:14;3 мес.:7"   # дней заморозки в год по типу карты — правила вашего клуба (пример)
batch_max = 50

[[integrations]]
id = "club-crm"
title = "Учётная система клуба / CRM (официальный API)"
why = "Посещения, карты, заморозки напрямую. Без неё — выгрузки в data/."
how = "Если у вашей системы учёта клуба есть официальный API — MCP-сервер с ключом клуба: панель → Интеграции → «Свой сервер (адрес)». Иначе — ежедневная выгрузка CSV или XLSX в data/."
optional = true

[[integrations]]
id = "club-sender"
title = "Бот или SMS-шлюз клуба для сообщений участникам"
why = "Отправить одобренную пачку. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота или SMS-шлюза клуба."
optional = true

[[data_sources]]
title = "Карты, заморозки и согласия: data/members.csv"
kind = "client_export"
about = "выгрузка учётной системы клуба; согласия — отдельными полями"

[[data_sources]]
title = "Посещения: data/visits.csv"
kind = "client_export"
about = "выгрузка турникета или учётной системы"

[[data_sources]]
title = "Учётная система клуба"
kind = "official_api"
about = "только официальный API с ключом клуба, если подключён"

[[schedule]]
at = "12:00"
days = [1, 2, 3, 4, 5]
title = "«Пропал» — мягкий возврат"
prompt = """Кто не был {{lapse_from}}–{{lapse_to}} дней (навык lapsed-segment): пачка мягких сообщений \
(reminder-batch) и вопрос «Отправить пачку из N?»; дольше {{lapse_to}} дней — список звонков менеджеру. Разбери \
ответы (reminder-replies): «хочу отказаться» — вопрос о заморозке. Нет никого — одна строка."""

[[decisions]]
question = "Отправить пачку из N? (мягкий возврат, первые три имени)"
options = ["Да", "Нет"]
when = "по будням, если есть кого вернуть"

[[decisions]]
question = "Участник хочет отказаться — предложить заморозку N дней?"
options = ["Предложить заморозку", "Оформить отказ", "Позвоню сам"]
when = "ответ «хочу отказаться / вернуть деньги»; оформляет администратор"

# Демо для страницы предложения и «Попробовать в Telegram» (docs/OFFERS.md): данные выдуманные, ничего не отправляется.
[demo]
kind = "reminder"

[[demo.telegram]]
text = """📥 Заявка (демо) · {{business}}
Пробная тренировка, клуб «{{point}}», суббота 10:00. Мария (демо), с сайта."""
buttons = ["Записать", "Предложить другое время"]
replies = ["В рабочем режиме агент записал бы гостя к тренеру и отправил подтверждение. Сейчас ничего не отправлено.", "Агент предложил бы два свободных окна у тренеров и дождался ответа."]

[[demo.telegram]]
text = """💬 Мягкий возврат (демо)
«Ирина, добрый день! Давно не видели вас в «{{point}}» — всё ли в порядке? Если неудобно время, ответьте — подберём расписание или тренера».

Без посещений 2–3 недели, согласие на уведомления есть: {{n}} участников. Отправить пачку из {{n}}?"""
buttons = ["Отправить", "Показать список", "Не сейчас"]
replies = ["В рабочем режиме сообщения ушли бы {{n}} участникам — сервисные, без акций. Сейчас ничего не отправлено.", "Агент показал бы список: имя, сколько дней без посещений, до какого числа карта.", "Агент ничего не отправит и спросит завтра."]

[[demo.telegram]]
text = """📊 Утренние цифры (демо) · {{business}}
Вчера: продано 6 карт (3 новые, 3 продления), посещений 412, загрузка групповых — 74 %.
«{{point}}»: продления ниже плана на 18 %."""
buttons = []
replies = []

[[demo.telegram]]
text = """❓ Вопрос агента (демо)
Сергей (демо) ответил «хочу уйти». Предложить заморозку на 30 дней?"""
buttons = ["Предложить заморозку", "Передать администратору", "Ничего"]
replies = ["Агент отправил бы текст про заморозку по правилам клуба; оформляет администратор. Сейчас ничего не отправлено.", "Агент передал бы диалог администратору клуба с кратким пересказом.", "Агент ничего не сделает: отказ — право участника."]
