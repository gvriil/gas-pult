# Модуль «Детское направление» (фитнес-клубы, семейные) — формат файла: docs/MODULES.md
id = "fitness-kids"
version = "1.0"
title = "Детское направление"
industry = "Фитнес-клубы (семейные)"
sections = ["docs", "comms"]
about = "Родителям — расписание, отмены, сборы; переход по возрасту решает человек."
description = """
Каждый день агент смотрит события детских групп (data/events.csv: отмены, переносы, сборы, соревнования) и готовит
родителям сервисные уведомления на сегодня и завтра — по согласию родителя на уведомления. Раз в неделю считает, кто
по возрасту выходит из своей группы в ближайшие {{horizon_days}} дней (скрипт age_transition.py: дата рождения и
возрастные границы групп из data/groups.csv), и предлагает человеку перевод — решает он. Пишем только родителю —
законному представителю; данные ребёнка — минимум полей и только с согласием родителя (152-ФЗ, ст. 9). Реклама
родителям — только с их согласием (ст. 18 ФЗ «О рекламе»). Всё уходит после «Да». Для клиентов в РФ — российская
модель (GigaChat или YandexGPT, docs/RU-MODELS.md), хранение в РФ.
"""
start = """Прочитай CLAUDE.md и data/ (пример выдуманный). Покажи уведомления родителям на 2026-11-04 и переходы \
по возрасту на 2026-11-02 (навык age-transition), — ничего не отправляй."""
uses = ["reminders"]

[settings]
children = "data/children.csv"
parents = "data/parents.csv"
groups = "data/groups.csv"
events = "data/events.csv"
horizon_days = 60             # за сколько дней предупреждать о переходе по возрасту
batch_max = 50

[[integrations]]
id = "club-crm"
title = "Учётная система клуба / CRM (официальный API)"
why = "Дети, группы, родители и согласия напрямую. Без неё — выгрузки в data/."
how = "Если у вашей системы учёта клуба есть официальный API — MCP-сервер с ключом клуба: панель → Интеграции → «Свой сервер (адрес)». Иначе — выгрузка CSV или XLSX в data/."
optional = true

[[integrations]]
id = "club-sender"
title = "Бот или SMS-шлюз клуба для сообщений родителям"
why = "Отправить одобренную пачку. Без него — черновики в outbox/."
how = "Панель → Интеграции → «Другой сервис» → «Свой сервер (адрес)»: MCP-сервер бота или SMS-шлюза клуба."
optional = true

[[data_sources]]
title = "Дети, группы, родители: data/children.csv, data/groups.csv, data/parents.csv"
kind = "client_export"
about = "выгрузка учётной системы; у ребёнка — имя, дата рождения, группа; контакты — только у родителя"

[[data_sources]]
title = "События групп: data/events.csv"
kind = "client_export"
about = "отмены, переносы, сборы — ведёт администратор детского направления"

[[data_sources]]
title = "Учётная система клуба"
kind = "official_api"
about = "только официальный API с ключом клуба, если подключён"

[[schedule]]
at = "09:30"
title = "Уведомления родителям"
prompt = """События детских групп на сегодня и завтра (data/events.csv): пачки сервисных уведомлений родителям по \
группам (reminder-batch, templates/event.md) и вопрос «Отправить пачку из N?». Нет событий — одна строка."""

[[schedule]]
at = "10:00"
days = [1]
title = "Переход по возрасту"
prompt = """Кто выходит из группы по возрасту в ближайшие {{horizon_days}} дней (навык age-transition): TRANSITIONS.md \
и вопрос человеку о каждом ребёнке «Предложить родителю перевод?». Нет таких — одна строка."""

[[decisions]]
question = "Отправить пачку из N? (отмена, перенос или сбор; группа, первые три имени родителей)"
options = ["Да", "Нет"]
when = "есть события на сегодня или завтра"

[[decisions]]
question = "Ребёнок выходит из группы по возрасту — предложить родителю перевод?"
options = ["Предложить группу", "Оставить до конца сезона", "Позвоню сам"]
when = "раз в неделю; группу и условия выбирает человек"
