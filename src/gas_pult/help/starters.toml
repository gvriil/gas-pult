# ---------- семейная история (владелец 22.11) ----------

[[starter]]
id = "grave-search"
title = "Найти место захоронения"
needs = ""
occ_only = true
goal = """найти, где похоронен мой родственник. Ищи только в открытых официальных источниках: «Память народа», \
«Мемориал» Минобороны, сайты кладбищ и архивов. К каждой находке дай ссылку на источник. Не нашёл — так и \
скажи прямо. Не придумывай и не гадай"""
questions = ["Кого ищем? Фамилия, имя, отчество и годы жизни",
             "Какие документы есть? | справка о смерти | свидетельство о смерти | письма и фото | ничего нет",
             "Где человек жил или служил? Город, область или страна"]
chat_title = "Где похоронен: <кто> — <годы жизни>"
then = "Нашёл — скажи, как это проверить и куда написать за подтверждением"

[[starter]]
id = "archive-request"
title = "Запрос в архив"
needs = ""
occ_only = true
goal = """подготовить черновик запроса в архив или ЗАГС: кому писать, что приложить и сам текст. Это только \
черновик. Ничего не отправляй и не подавай сам"""
questions = ["О ком запрос? Фамилия, имя, отчество и годы жизни",
             "Что хотим узнать? | дату и место рождения | службу в армии | место захоронения | другое",
             "Куда писать? | ЗАГС | архив области | архив Минобороны | не знаю"]
chat_title = "Запрос в архив: <о ком> — <что узнаём>"
then = "Покажи черновик целиком и спроси: «Отправляем?». Отправить — только после моего «Да»"

[[starter]]
id = "family-photos"
title = "Разобрать семейные фото"
needs = ""
occ_only = true
goal = """разобрать семейные фото: разложить копии по годам и по людям и подписать, кто на снимке. Оригиналы не \
трогай и ничего не удаляй. Работай только с копиями. Не знаешь, кто на фото, — спроси меня"""
questions = ["Где лежат фото? | на телефоне | на компьютере | на Диске | бумажные снимки",
             "Как разложить? | по годам | по людям | по событиям"]
chat_title = "Семейные фото: <чьи> — <годы>"

[[starter]]
id = "family-story"
title = "Записать рассказ близкого"
needs = ""
occ_only = true
goal = """записать рассказ близкого человека и оформить его главой семейной книги. Рассказ я надиктую кнопкой \
микрофона в поле ввода — текст придёт сюда. Исправь ошибки записи, но сохрани слова рассказчика. Неясное \
место отметь и спроси меня"""
questions = ["Чей рассказ? | мамы | папы | бабушки | дедушки | другого родственника",
             "О чём рассказ? | детство | война и трудные годы | работа | семья | о чём захочет",
             "Как оформить? | от первого лица | от автора | вопросы и ответы"]
chat_title = "Семейная книга: <кто рассказывает> — <о чём>"
then = "В конце предложи 2–3 вопроса, чтобы продолжить разговор в следующий раз"
