# Модуль «Сроки обращений жителей» (пакет «УК-старт») — формат файла: docs/MODULES.md
id = "uk-requests"
version = "1.0"
title = "Сроки обращений жителей"
industry = "Управляющие компании — «УК-старт»"
sections = ["search", "comms"]
about = "Реестр обращений со сроками по Правилам № 416 и № 354 в рабочих днях, сигнал заранее и черновик ответа — отправляет УК."
description = """
Для управляющей организации многоквартирных домов (РФ). Обращения жителей (из ГИС ЖКХ, почты, приёма, телефона —
выгрузкой или списком в data/requests.csv) агент относит к виду и считает срок ответа в рабочих днях по
производственному календарю: следующий день — информация из п. 31–32 Правил № 416; 3 рабочих дня — документы и
сведения из п. 34 и жалоба на качество коммунальной услуги (Правила № 354); 10 рабочих дней — прочее (п. 36);
30 календарных — не собственникам (п. 37). Сигнал за 1 рабочий день и в день срока, просрочка — руководителю.
Черновик ответа — по фактам из данных УК; отправляет сотрудник УК после «Да». Сроки сверены 02.11.2026 —
сверять с КонсультантПлюс перед продажей. Сессия — только на российской модели (GigaChat или YandexGPT,
docs/RU-MODELS.md): данные жителей — персональные данные, 152-ФЗ, хранение в РФ.
"""
start = """Прочитай CLAUDE.md, data/requests.csv и data/houses.csv (пример выдуманный). Посчитай сроки по реестру \
(навык request-deadline) и покажи, что горит, — ответов не отправляй."""
uses = ["deadlines", "documents"]

[settings]
requests = "data/requests.csv"
houses = "data/houses.csv"
region = "РФ"

[[integrations]]
id = "gis-zhkh-export"
title = "Выгрузка обращений из ГИС ЖКХ"
why = "Обращения из ГИС ЖКХ — выгрузкой сотрудника УК в data/. Ответ в ГИС ЖКХ размещает сотрудник УК."
how = "ГИС ЖКХ (dom.gosuslugi.ru), кабинет УК → обращения → выгрузка в Excel/CSV; файл — в data/ дважды в день."
optional = true

[[integrations]]
id = "gmail"
why = "Обращения, пришедшие на почту УК, и отправка ответов почтой после «Да». Без него — черновики в outbox/."
optional = true

[[data_sources]]
title = "Обращения жителей: data/requests.csv"
kind = "client_export"
about = "выгрузка из ГИС ЖКХ и журнала обращений УК — только выгрузки самой УК"

[[data_sources]]
title = "Дома, акты, графики работ: data/houses.csv, data/"
kind = "client_export"
about = "из учёта УК"

[[schedule]]
at = "08:30"
days = [1, 2, 3, 4, 5]
title = "Сроки обращений — утро"
prompt = """Обнови сроки по реестру обращений (навык request-deadline): новые — вид и срок; сегодня и завтра — \
черновики ответов (resident-reply); просроченные — вопрос руководителю «ПРОСРОЧЕНО». Без «Да» ответы не отправляй."""

[[schedule]]
at = "14:00"
days = [1, 2, 3, 4, 5]
title = "Сроки обращений — после обеда"
prompt = """Новые обращения с утра — вид и срок (request-deadline); что истекает сегодня — напомни вопросом. \
Без «Да» ответы не отправляй."""

[[decisions]]
question = "Ответ жителю (дом, кв., тема), срок <дата> — отправить?"
options = ["Отправить", "Изменить", "Не отправлять"]
when = "черновик ответа готов"

[[decisions]]
question = "ПРОСРОЧЕНО: обращение № <n> (дом, тема), срок был <дата>. Что делаем?"
options = ["Ответить сегодня", "Передать руководителю", "Уже ответили — отметить"]
when = "срок прошёл, ответа нет"

[[decisions]]
question = "Не могу определить вид обращения № <n> — какой срок?"
options = ["3 рабочих дня", "10 рабочих дней", "Следующий день", "30 дней (не собственник)"]
when = "вид неочевиден"

